<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTSeek 实时风险监控大屏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .timestamp {
            font-size: 1.1em;
            color: #a0d2eb;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #a0d2eb;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .risk-score-container {
            text-align: center;
            padding: 20px;
        }

        .risk-score {
            font-size: 4em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .risk-level {
            font-size: 1.5em;
            margin-top: 10px;
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
        }

        .risk-level.LOW {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }

        .risk-level.MEDIUM {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .risk-level.HIGH {
            background: linear-gradient(135deg, #f5576c, #ff416c);
        }

        .risk-level.CRITICAL {
            background: linear-gradient(135deg, #833ab4, #fd1d1d);
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .metric-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .metric-value {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .metric-label {
            font-size: 0.9em;
            color: #a0d2eb;
        }

        .position-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #4CAF50;
        }

        .position-item.HIGH {
            border-left-color: #f44336;
        }

        .position-item.MEDIUM {
            border-left-color: #ff9800;
        }

        .position-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .position-code {
            font-size: 1.2em;
            font-weight: bold;
        }

        .position-risk {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .position-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            font-size: 0.9em;
        }

        .alert-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #2196F3;
        }

        .alert-item.CRITICAL {
            border-left-color: #f44336;
            background: rgba(244, 67, 54, 0.1);
        }

        .alert-item.WARNING {
            border-left-color: #ff9800;
            background: rgba(255, 152, 0, 0.1);
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .alert-level {
            font-size: 0.75em;
            padding: 2px 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
        }

        .alert-message {
            font-size: 0.95em;
        }

        .alert-time {
            font-size: 0.8em;
            color: #a0d2eb;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5em;
            color: #a0d2eb;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 1em;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.1);
        }

        .auto-refresh {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9em;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4CAF50;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 2s infinite;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ FTSeek 实时风险监控大屏</h1>
            <div class="timestamp" id="timestamp">
                <span class="live-indicator"></span>
                实时数据 · 自动刷新
            </div>
        </header>

        <div class="status-bar">
            <div>
                <strong>系统状态:</strong> <span id="system-status">运行中</span>
            </div>
            <div>
                <strong>最后更新:</strong> <span id="last-update">--:--:--</span>
            </div>
        </div>

        <div id="dashboard-content">
            <div class="loading">🔄 加载数据中...</div>
        </div>

        <button class="refresh-btn" onclick="loadDashboard()">
            🔄 立即刷新
        </button>

        <div class="auto-refresh">
            🔄 自动刷新：<span id="countdown">5</span>s
        </div>
    </div>

    <script>
        const TOKEN = '5a8f072c2cba9db1579dd829214a38112fdcddefe089d4ba58e05742097dd272';
        const API_BASE = '/api/risk';
        let countdown = 5;

        function getRiskLevelClass(score) {
            if (score >= 80) return 'CRITICAL';
            if (score >= 60) return 'HIGH';
            if (score >= 40) return 'MEDIUM';
            return 'LOW';
        }

        function getRiskLevelColor(level) {
            const colors = {
                'LOW': '#38ef7d',
                'MEDIUM': '#f5576c',
                'HIGH': '#ff416c',
                'CRITICAL': '#fd1d1d'
            };
            return colors[level] || '#38ef7d';
        }

        async function loadDashboard() {
            try {
                const response = await fetch(`${API_BASE}/dashboard?token=${TOKEN}`);
                const data = await response.json();

                if (data.status === 'ok') {
                    renderDashboard(data.dashboard);
                    updateLastUpdateTime();
                } else {
                    document.getElementById('dashboard-content').innerHTML = 
                        `<div class="loading">❌ ${data.message || '加载失败'}</div>`;
                }
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('dashboard-content').innerHTML = 
                    `<div class="loading">❌ 加载失败：${error.message}</div>`;
            }
        }

        function renderDashboard(dashboard) {
            const riskLevel = getRiskLevelClass(dashboard.risk_score);
            const riskColor = getRiskLevelColor(riskLevel);

            const html = `
                <div class="dashboard-grid">
                    <!-- 风险评分 -->
                    <div class="card">
                        <div class="card-title">📊 风险评分</div>
                        <div class="risk-score-container">
                            <div class="risk-score" style="color: ${riskColor}">
                                ${dashboard.risk_score.toFixed(1)}
                            </div>
                            <div class="risk-level ${riskLevel}" style="background: ${riskColor}">
                                ${riskLevel}
                            </div>
                        </div>
                    </div>

                    <!-- 核心指标 -->
                    <div class="card">
                        <div class="card-title">📈 核心指标</div>
                        <div class="metric-grid">
                            <div class="metric-item">
                                <div class="metric-value">¥${(dashboard.metrics.total_capital / 10000).toFixed(0)}万</div>
                                <div class="metric-label">总资金</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-value">${dashboard.metrics.total_exposure}</div>
                                <div class="metric-label">总仓位</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-value" style="color: ${parseFloat(dashboard.metrics.current_drawdown) > 0.05 ? '#ff416c' : '#38ef7d'}">
                                    ${dashboard.metrics.current_drawdown}
                                </div>
                                <div class="metric-label">当前回撤</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-value">${dashboard.metrics.win_rate}</div>
                                <div class="metric-label">胜率</div>
                            </div>
                        </div>
                    </div>

                    <!-- 持仓风险 -->
                    <div class="card">
                        <div class="card-title">💼 持仓风险</div>
                        ${renderPositions(dashboard.positions)}
                    </div>

                    <!-- 最近警报 -->
                    <div class="card">
                        <div class="card-title">🚨 最近警报</div>
                        ${renderAlerts(dashboard.recent_alerts)}
                    </div>
                </div>

                <!-- 摘要信息 -->
                <div class="card">
                    <div class="card-title">📋 风险摘要</div>
                    <div class="metric-grid">
                        <div class="metric-item">
                            <div class="metric-value">${dashboard.summary.total_positions}</div>
                            <div class="metric-label">总持仓数</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value" style="color: ${dashboard.summary.high_risk_positions > 0 ? '#ff416c' : '#38ef7d'}">
                                ${dashboard.summary.high_risk_positions}
                            </div>
                            <div class="metric-label">高风险持仓</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value">${dashboard.summary.total_alerts_today}</div>
                            <div class="metric-label">今日警报</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value">${dashboard.metrics.unrealized_pnl}</div>
                            <div class="metric-label">未实现盈亏</div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('dashboard-content').innerHTML = html;
        }

        function renderPositions(positions) {
            if (!positions || Object.keys(positions).length === 0) {
                return '<div style="text-align: center; padding: 20px; color: #a0d2eb;">无持仓</div>';
            }

            return Object.entries(positions).map(([code, risk]) => `
                <div class="position-item ${risk.risk_level}">
                    <div class="position-header">
                        <span class="position-code">${code}</span>
                        <span class="position-risk" style="background: ${getRiskLevelColor(risk.risk_level)}">
                            ${risk.risk_level}
                        </span>
                    </div>
                    <div class="position-details">
                        <div>
                            <div style="color: #a0d2eb; font-size: 0.85em;">市值</div>
                            <div>¥${(risk.market_value / 10000).toFixed(1)}万</div>
                        </div>
                        <div>
                            <div style="color: #a0d2eb; font-size: 0.85em;">盈亏</div>
                            <div style="color: ${parseFloat(risk.unrealized_pnl_percent) >= 0 ? '#38ef7d' : '#ff416c'}">
                                ${risk.unrealized_pnl_percent}
                            </div>
                        </div>
                        <div>
                            <div style="color: #a0d2eb; font-size: 0.85em;">止损距离</div>
                            <div style="color: ${risk.stop_loss_distance < 0.02 ? '#ff416c' : '#38ef7d'}">
                                ${risk.stop_loss_distance}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderAlerts(alerts) {
            if (!alerts || alerts.length === 0) {
                return '<div style="text-align: center; padding: 20px; color: #a0d2eb;">无警报</div>';
            }

            return alerts.map(alert => `
                <div class="alert-item ${alert.level}">
                    <div class="alert-header">
                        <span class="alert-level">${alert.level}</span>
                        <span style="font-size: 0.85em; color: #a0d2eb;">${alert.type}</span>
                    </div>
                    <div class="alert-message">${alert.message}</div>
                    <div class="alert-time">${alert.timestamp}</div>
                </div>
            `).join('');
        }

        function updateLastUpdateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
            document.getElementById('last-update').textContent = timeStr;
        }

        function startAutoRefresh() {
            setInterval(() => {
                countdown--;
                document.getElementById('countdown').textContent = countdown;
                
                if (countdown <= 0) {
                    countdown = 5;
                    loadDashboard();
                }
            }, 1000);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
            startAutoRefresh();
        });
    </script>
</body>
</html>
