[pytest]
# 2026-08-22 (结案A2): tests/archive 存放随死代码归档的旧测试, 不再收集.
testpaths = tests
norecursedirs = tests/archive tests/integration .* __pycache__ scripts/archive
markers =
    allow_production_data_write: 显式豁免生产 data/ 写入硬闸 (tests/conftest.py _isolate_production_data_writes), 必须在测试内注明为何需要写真路径
    allow_outbound_notification: 该用例**故意**触达通知渠道 send 层 (tests/conftest.py 会话结束的"出站通知泄漏"报红将对它豁免), 必须在测试内注明为何需要打到渠道层
    allow_live_broker_order: 该用例**故意**触达真券商写口 place_order/modify_order/cancel_order (tests/conftest.py _block_live_broker_orders 将对它豁免), 必须在测试内注明为何不能打桩
