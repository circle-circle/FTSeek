# ============================================================
# FTSeek-US Exit Profiles — Harness/Shadow 影子系统专用
# ============================================================
# ⚠️ 适用范围 (重要, 避免误改):
# - 仅由 app/harness/shadow_bridge.py 加载 (通过 ExitModuleRegistry)
# - 用于策略辩论引擎 / 回测 / shadow 测试, 不影响生产 PnL
# - 改本文件不会改变主线交易行为
#
# 主线生产退出参数请改: app/risk/exit_policy.yaml (SSOT)
#
# 注意: 即使参数名相同 (如 activation_profit_atr), 这里和
# exit_policy.yaml 是独立配置, 数值差异是设计预期 (各 profile 适配
# 不同时间框架/策略变体).
# ============================================================
# 设计原则:
# 1. 每条策略变体配独立的 exit profile
# 2. 参数与 9 条门禁策略的时间框架匹配
# 3. 辩论引擎可通过 config/overrides/ 注入覆盖参数
# ============================================================

version: "1.0"
last_updated: "2026-05-23"

exit_profiles:

  # ── 5 分钟族群 (高动量短线) ──

  aggressive_5m_high_momentum:
    stop_loss_type: fixed_pct
    stop_loss_params:
      pct: -0.015              # -1.5% 固定止损
    take_profit_type: trailing
    take_profit_params:
      activation_profit_atr: 1.0   # 盈利 1×ATR 激活追踪
      multiplier: 1.5              # 从最高点回撤 1.5×ATR 退出
    max_holding_minutes: 30
    pre_close_behavior: force_close

  aggressive_5m_moderate_momentum:
    stop_loss_type: atr_multi
    stop_loss_params:
      multiplier: 1.2
      max_loss_pct: -0.02      # -2% 硬底限
    take_profit_type: trailing
    take_profit_params:
      activation_profit_atr: 0.8
      multiplier: 1.2
    max_holding_minutes: 45
    pre_close_behavior: force_close

  aggressive_5m_scalp:
    stop_loss_type: fixed_pct
    stop_loss_params:
      pct: -0.01               # -1% 极紧止损
    take_profit_type: fixed_pct
    take_profit_params:
      target_pct: 0.02         # +2% 目标
    max_holding_minutes: 15
    pre_close_behavior: force_close

  # ── 15 分钟族群 (超卖反转) ──

  stable_15m_base:
    stop_loss_type: atr_multi
    stop_loss_params:
      multiplier: 1.5
      max_loss_pct: -0.02      # -2% 硬底限
    take_profit_type: fixed_pct
    take_profit_params:
      target_pct: 0.04         # +4% 目标
    max_holding_minutes: 120
    pre_close_behavior: reduce

  stable_15m_relaxed_oversold:
    stop_loss_type: atr_multi
    stop_loss_params:
      multiplier: 1.5
      max_loss_pct: -0.02
    take_profit_type: scale_out
    take_profit_params:
      tiers:
        - profit_pct: 3.0      # +3% 平 50%
          close_pct: 50
          move_sl_to: breakeven
        - profit_pct: 6.0      # +6% 平剩余 50%
          close_pct: 50
          move_sl_to: chandelier_2x
    max_holding_minutes: 180
    pre_close_behavior: hold

  stable_15m_tight_trend:
    stop_loss_type: atr_multi
    stop_loss_params:
      multiplier: 1.2          # 更紧止损
      max_loss_pct: -0.015
    take_profit_type: trailing
    take_profit_params:
      activation_profit_atr: 1.0
      multiplier: 1.8
    max_holding_minutes: 150
    pre_close_behavior: reduce

  stable_15m_deep_oversold:
    stop_loss_type: atr_multi
    stop_loss_params:
      multiplier: 2.0          # 放宽止损给空间
      max_loss_pct: -0.03
    take_profit_type: scale_out
    take_profit_params:
      tiers:
        - profit_pct: 2.0
          close_pct: 33
          move_sl_to: breakeven
        - profit_pct: 5.0
          close_pct: 33
          move_sl_to: chandelier_2x
        - profit_pct: 8.0
          close_pct: 100
    max_holding_minutes: 240
    pre_close_behavior: hold

  # ── 日线族群 (深度反转) ──

  radical_daily_deep_oversold:
    stop_loss_type: fixed_pct
    stop_loss_params:
      pct: -0.07               # -7% 止损 ($7 per $100)
    take_profit_type: fixed_pct
    take_profit_params:
      target_pct: 0.14         # +14% 目标 (2:1 ratio)
    time_stop_days: 10
    max_holding_minutes: 0     # 无分钟级限制，由 time_stop_days 控制
    pre_close_behavior: hold

  radical_daily_moderate_oversold:
    stop_loss_type: atr_multi
    stop_loss_params:
      multiplier: 2.5
      max_loss_pct: -0.05
    take_profit_type: scale_out
    take_profit_params:
      tiers:
        - profit_pct: 5.0
          close_pct: 30
          move_sl_to: breakeven
        - profit_pct: 10.0
          close_pct: 30
          move_sl_to: chandelier_2x
        - profit_pct: 18.0
          close_pct: 40
          move_sl_to: chandelier_1x
    time_stop_days: 7
    max_holding_minutes: 0
    pre_close_behavior: hold

  # ── 数据驱动风控配置 (2026-05-23, 辩论P0-2) ──
  # 验证: 118→85笔, WR 52%→54%, PF 1.22→1.74, 底90% -171%→-10%

  mean_reversion_risk_managed:
    stop_loss_type: atr_multi
    stop_loss_params:
      multiplier: 1.0              # ATR×1.0 (均值回归最优)
      max_loss_pct: -0.05          # 硬底限 -5%
    take_profit_type: fixed_pct
    take_profit_params:
      target_pct: 0.04             # +4% 止盈
    max_holding_minutes: 4320      # 3天 = 72h = 4320min
    pre_close_behavior: hold
    # 风控参数 (由 DynamicRiskExit 读取)
    risk_params:
      max_stock_loss_pct: 0.01     # 个股最大亏损占总资金 1%
      max_consecutive_losses: 3    # 连续3亏暂停
      blacklist: ["NVDA", "META"]  # 排除高亏损标的
      capital: 100000.0
