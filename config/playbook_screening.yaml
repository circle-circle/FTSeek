  insider_net_buy:
    weight: 2
    enabled: true
    description: Insider net buy (non-cluster)
  rsi_oversold:
    weight: -3
    enabled: false
    condition: rsi_14 < 40
    description: RSI oversold pullback
  above_ma20:
    weight: 1
    enabled: true
    condition: price > ma20
    description: 'Price above 20-day MA (2026-07-07: 降权4→2, bayesian_wr=21.8%, 需共振触发)'
