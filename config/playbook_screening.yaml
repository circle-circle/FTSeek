  news_positive:
    weight: 1
    enabled: true
    condition: sentiment_score > 0
    description: Positive news sentiment (last 3 days)
  earnings_beat_streak:
    weight: 1
    enabled: true
    condition: beat_rate > 0.5
    description: Earnings beat rate > 50%
  volume_expansion:
    weight: -2
    enabled: true
    condition: volume_5d_avg_ratio > 1.2
    description: Volume expansion
  pe_below_industry:
    weight: -3
    enabled: false
    description: PE below industry average
  rsi_overbought:
    weight: -4
    enabled: true
    condition: rsi_14 > 70
    description: RSI overbought
  insider_net_sell:
    weight: -5
    enabled: false
    description: Insider net sell
  news_negative:
    weight: -4
    enabled: false
    condition: sentiment_score < -0.3
    description: Negative news sentiment
  earnings_imminent:
    weight: -3
    enabled: false
    condition: days_until_earnings < 3
    description: Earnings < 3 days, too volatile
