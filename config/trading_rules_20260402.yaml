# FTSeek 交易约束配置 - 2026 年 4 月 2 日
# 制定依据：2026-04-01 交易复盘 + 中芯国际诊断 + 泡泡玛特成功模式
# 制定时间：2026-04-01 20:09

# ============================================================
#  全局约束
# ============================================================
global_rules:
  # 单日止损
  daily_stop_loss: -500  # HKD，触发后停止交易
  
  # 连续亏损冷静期
  consecutive_loss_limit: 2  # 连续亏损 2 笔后冷静 30 分钟
  
  # 单笔最大亏损
  single_trade_stop_loss: -200  # HKD
  
  # 交易时段限制
  restricted_periods:
    - start: "09:30"
      end: "10:00"
      action: "禁止交易"
      reason: "避开开盘波动"
    - start: "13:00"
      end: "13:30"
      action: "谨慎交易"
      reason: "午后高风险时段"

# ============================================================
# 泡泡玛特 (HK.09992) 策略配置
# ============================================================
stock_HK09992:
  enabled: true
  priority: "high"  # 重点交易
  
  # 入场约束
  entry_rules:
    max_entry_premium: 0.1  # 入场价≤当日最低价 +0.1
    require_pullback: true  # 必须回调不破前低/前高
    min_interval_minutes: 45  # 交易间隔≥45 分钟
  
  # 出场策略
  exit_rules:
    holding_time_window:
      min: 36  # 分钟
      max: 43  # 分钟
    take_profit_targets:
      - profit_pct: 0.5
        action: "100% 止盈"
        max_holding_minutes: 30
      - profit_pct: 1.5
        action: "100% 止盈"
        max_holding_minutes: 40
      - profit_pct: 2.5
        action: "100% 止盈"
        max_holding_minutes: 50
      - profit_pct: 2.5
        action: "50% 止盈 +50% 让利润奔跑"
        min_holding_minutes: 50
  
  # 仓位控制
  position_rules:
    shares_per_trade: 100  # 单笔 100 股
    max_daily_trades: 3  # 每日≤3 笔
    max_position_shares: 200  # 最大仓位 200 股
  
  # 最佳时段
  preferred_periods:
    - start: "10:30"
      end: "11:30"
    - start: "13:30"
      end: "15:00"

# ============================================================
# 中芯国际 (HK.00981) 策略配置
# ============================================================
stock_HK00981:
  enabled: true
  priority: "low"  # 限制交易
  
  # 入场约束 (严格)
  entry_rules:
    max_entry_premium: 0.1  # 入场价≤当日最低价 +0.1
    require_pullback: true
    min_interval_minutes: 45  # 交易间隔≥45 分钟
  
  # 出场策略 (分级)
  exit_rules:
    holding_time_by_profit:
      - profit_hkd: 150
        action: "≤30 分钟止盈"
      - profit_hkd: 250
        action: "30-50 分钟止盈"
      - profit_hkd: 999999
        action: ">50 分钟止盈"
  
  # 仓位控制 (严格)
  position_rules:
    shares_per_trade: 100  # 单笔 100 股
    max_daily_trades: 2  # 每日≤2 笔 (严格)
    max_position_shares: 100  # 最大仓位 100 股
  
  # 时段限制
  restricted_periods:
    - start: "09:30"
      end: "10:00"
      action: "禁止交易"
    - start: "13:00"
      end: "13:30"
      action: "建议观望"

# ============================================================
# 违规处理配置
# ============================================================
violation_rules:
  type_a:
    name: "入场价格超标"
    condition: "entry_price > daily_low + 0.1"
    penalty: "警告 + 冷静 30 分钟"
  
  type_b:
    name: "交易间隔不足"
    condition: "interval_minutes < 45"
    penalty: "警告 + 冷静 30 分钟"
  
  type_c:
    name: "超出交易频次"
    condition: "daily_trades > max_daily_trades"
    penalty: "停止该股交易 1 日"
  
  type_d:
    name: "时段违规"
    condition: "trade_time in restricted_periods"
    penalty: "警告 + 记录日志"

# ============================================================
# 监控指标配置
# ============================================================
monitoring:
  targets:
    total_pnl: 2500  # HKD
    win_rate: 65  # %
    avg_pnl_per_trade: 400  # HKD
    total_trades: 5  # 笔 (4-6 笔范围)
  
  warnings:
    win_rate_below: 60  # %
    avg_pnl_below: 300  # HKD
    trades_above: 8  # 笔
    daily_loss_below: -200  # HKD
  
  critical:
    win_rate_below: 50  # %
    avg_pnl_below: 200  # HKD
    trades_above: 10  # 笔
    daily_loss_below: -500  # HKD

# ============================================================
# 盘后复盘配置
# ============================================================
post_market_review:
  time: "16:00-17:00"
  tasks:
    - time: "16:00-16:15"
      task: "数据收集"
      items:
        - "导出今日交易 CSV"
        - "统计核心 KPI"
        - "记录违规情况"
    - time: "16:15-16:30"
      task: "绩效分析"
      items:
        - "对比目标值"
        - "计算达成率"
    - time: "16:30-16:45"
      task: "问题诊断"
      items:
        - "违规交易分析"
        - "错失机会分析"
        - "情绪化交易分析"
    - time: "16:45-17:00"
      task: "优化调整"
      items:
        - "调整明日策略"
        - "更新约束规则"
        - "记录经验教训"
