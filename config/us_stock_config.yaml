# 美股中长线投资配置
# 最后更新：2026-03-24

# ==================== 监控配置 ====================
monitor:
  # 检查频率 (秒)
  check_interval: 300          # 正常时段 5 分钟检查一次
  night_interval: 900          # 夜间 15 分钟检查一次 (美东非交易时段)
  
  # 通知
  dingtalk_enabled: true
  push_on_trigger: true        # 触发止损止盈时推送
  push_daily_summary: true     # 每日汇总推送 (美东收盘后)

# ==================== 默认止损止盈参数 ====================
# 可在 individual_stocks 中覆盖
defaults:
  stop_loss: -0.08             # 默认止损 -8%
  take_profit: 0.15            # 默认止盈 +15%
  
  # 追踪止盈
  trailing_stop:
    enabled: true
    trigger: 0.10              # 盈利 10% 后启用
    percent: 0.05              # 回撤 5% 触发

# ==================== 个股配置 ====================
# 可针对每只股票设置不同参数
individual_stocks:
  US.AAPL:
    name: Apple Inc.
    enabled: true
    stop_loss: -0.10           # 苹果波动小，止损放宽到 -10%
    take_profit: 0.20          # 止盈 +20%
    notes: 科技龙头，稳健增长
  
  US.NVDA:
    name: NVIDIA Corp.
    enabled: true
    stop_loss: -0.12           # 英伟达波动大，止损放宽到 -12%
    take_profit: 0.25          # 止盈 +25%
    trailing_stop:
      enabled: true
      trigger: 0.15            # 盈利 15% 后启用追踪
      percent: 0.08            # 回撤 8% 触发
    notes: AI 芯片龙头，高波动高增长
  
  US.TSLA:
    name: Tesla Inc.
    enabled: true
    stop_loss: -0.15           # 特斯拉波动极大，止损 -15%
    take_profit: 0.30          # 止盈 +30%
    trailing_stop:
      enabled: true
      trigger: 0.20            # 盈利 20% 后启用追踪
      percent: 0.10            # 回撤 10% 触发
    notes: 电动车龙头，极高波动
  
  US.AMZN:
    name: Amazon.com
    enabled: true
    stop_loss: -0.10
    take_profit: 0.20
    notes: 电商 + 云服务双龙头
  
  US.MSFT:
    name: Microsoft Corp.
    enabled: false             # 暂未启用
    stop_loss: -0.08
    take_profit: 0.18
    notes: 软件龙头，稳健型
  
  US.GOOG:
    name: Alphabet Inc.
    enabled: false
    stop_loss: -0.10
    take_profit: 0.20
    notes: 谷歌母公司，待启用

# ==================== 仓位管理 ====================
position:
  max_position_per_stock: 0.20  # 单股最大仓位 20%
  total_max_position: 0.80      # 总仓位上限 80%
  cash_reserve: 0.10            # 保留 10% 现金

# ==================== 交易时间配置 ====================
trading_hours:
  # 美东交易时间 (转换为北京时间)
  us_market_open: "21:30"       # 北京时间 21:30 (美东 9:30)
  us_market_close: "04:00"      # 北京时间 次日 04:00 (美东 16:00)
  
  # 检查频率调整
  pre_market_check: false       # 盘前不检查 (可选)
  after_hours_check: false      # 盘后不检查 (可选)

# ==================== 风险提示 ====================
risk_warnings:
  - 美股 T+1 交易制度，当日买入次日才能卖出
  - 夜间交易注意流动性风险
  - 财报季波动加剧，建议调整止损参数
  - 汇率风险 (美元/人民币)
