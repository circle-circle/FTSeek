    atr_stop:
      enabled: false
      multiplier: 3.2
    stop_loss: -0.07
    take_profit: 0.09
    time_stop:
      enabled: false
      max_holding_days: 96
    trailing_stop:
      enabled: false
      trail_percent: 0.045
      trigger_profit: 0.05
  range_bound:
    atr_stop:
      enabled: false
      multiplier: 1.6
    stop_loss: -0.035
    take_profit: 0.05
    time_stop:
      enabled: false
      max_holding_days: 3
    trailing_stop:
      enabled: false
      trail_percent: 0.018
      trigger_profit: 0.025
  strong_trend_down:
    atr_stop:
      enabled: false
      multiplier: 1.4
    stop_loss: -0.03
    take_profit: 0.045
    time_stop:
      enabled: false
      max_holding_days: 24
    trailing_stop:
      enabled: false
      trail_percent: 0.015
      trigger_profit: 0.02
  strong_trend_up:
    atr_stop:
      enabled: false
      multiplier: 3.0
    partial_take_profit:
      enabled: false
      levels:
      - ratio: 0.25
        trigger: 0.1
      - ratio: 0.25
        trigger: 0.18
      - ratio: 0.3
        trigger: 0.25
    stop_loss: -0.08
    take_profit: 0.25
    time_stop:
      enabled: false
      max_holding_days: 25
    trailing_stop:
      enabled: false
      trail_percent: 0.05
      trigger_profit: 0.08
