    # 2026-09-03 (DEB-20260903 议题二后续): 穿透影子周频分析环 (LLM出题/代码判卷)
    penetration_pattern_analysis:
      fallback: deepseek
      primary: qwen
    regime_classifier:
      fallback: deepseek
      primary: qwen
    sentiment: qwen-flash
    stock_analyst:
      fallback: qwen
      primary: glm-5
    thesis_challenge: qwen
    thesis_inferer: qwen
    universe_expansion_reasoning:
      # 2026-08-27 (用户裁决): UE 主模型 qwen-max(qwen3.7-max) → qwen3.8-flash.
      #   降档切换 (max→flash): 成本 0.008/0.024 → 0.0003/0.0006 (输入/输出 $/K tok,
      #   约 27x/40x 降幅), UE 每轮 30-40 候选 brief + repair 调用是全链最高频 LLM
      #   路径 (570 次调用累计). 风险: flash 推理能力弱于 max, UE 指令生成质量
      #   (tier 判定/thesis 引证/short_check) 可能退化 → 兜底链 fallback=deepseek-pro
      #   不变 (schema 失败/空响应自动降级), 且 UE 指令行落 model_used 字段
      #   (llm_universe_scan 记录级归因), 新旧模型样本天然可切分归因 — 3.8-flash
      #   时代盈亏 vs 3.7-max 时代 (8/3-8/27) 可对比裁决. 模型可达性已实测
      #   (2026-08-27 DashScope 实弹, 返回 model=qwen3.8-flash; json_mode+schema
      #   校验链也实测通过).
      #   ⚠️ 实测延迟特性: 3.8-flash 输出带 reasoning_content (思考 token 计费),
      #   实弹简单调用 32s~180s vs 3.7-max ~1s 直答 — UE scan 单轮等待变长属预期,
      #   timeout=300 已配足 (实体定义处); 若 21:10 轮超时频发, 先看 llm_audit
      #   latency_ms 分布再裁 (勿直接改 timeout 掩盖问题).
      #   回滚: primary 改回 qwen (原 qwen-max, 2026-08-27 同日别名去规格化) + 重启.
      # 2026-09-14 (用户裁决): UE 兜底 deepseek(deepseek-v4-pro) → deepseek-v4.1-flash.
      #   只动本 feature 一行, 专用实体见 llm.models.deepseek-v41-flash (为何不改
      #   deepseek 实体: 该别名被 30 个 feature 引用, 改实体=超授权范围静默降档).
      #   DA 侧同名诉求在 hermes skill config.py 的 CHALLENGER_MODEL 一行, 不经本 yaml.
      #   回滚: 本行改回 fallback: deepseek 一行.
      fallback: deepseek-v41-flash
      # 2026-08-30 (用户裁决, DEB-20260829 第8轮, 方案A): UE 主模型 qwen3.8-flash → glm-5 (glm-5.2).
      #   [E6 更正 2026-08-31, DEB-20260830 第7轮派生·用户批准] 原依据"invalidation_triggers
      #   填充是 GLM 独占能力 (96% vs qwen 全系 0)"已被 E3/Q1 证为模板伪影: 当时台面是
      #   漏字段的 v2.7 模板, v2.8 (字段显式) 下 qwen3.8-flash 即填充 10/18=56% (含 1 轮 0/6
      #   波动), glm-5.2 14/18=78% (data/shadow/q1_v28_model_bakeoff.jsonl)。"独占"不成立。
      #   剩余在档依据 (非本次更正对象): 推理质量并列第一梯队 / 浮现数与引证精度优势
      #   (DEB-20260830 第4轮 B-4) / 绝对成本 ¥7.8/月。选型是否重裁待用户 (见该档第 8 轮);
      #   本注释只更正已证伪的依据, 不动 primary (回滚=本注释段还原)。
      #   原依据全文留档: 6模型×3轮同材料同参数 bakeoff 实测 (8/30) — invalidation_triggers
      #   填充 (盘中失效核销器唯一结构化输入, 生产 0/208 病灶本身) ~~是 GLM 独占能力~~:
      #   ~~glm-5.2 45/47=96% 且全部过白名单校验; qwen 全系(含3.8-max)+deepseek 全 0 填充~~
      #   (模板伪影, 见上)。
      #   推理质量 glm 与 3.8-max 并列第一梯队 (引证伪造 0 例; 唯一正确识别"仅记录不入围"票).
      #   生产同构风险已实测排除: json_mode ✓ / 数组格式system+cache_control ✓ /
      #   parse_json_strict 解 fenced ✓ / 延迟 63-69s 在 timeout=300 内 ✓.
      #   配套: llm_universe_scan.py 主调用点 max_tokens 4000→8000 (glm 实测输出 5448-6070
      #   tok, 4000 必截断 → JSON 解析失败 → 静默回退 = 切换空操作, 已实测实锤).
      #   成本: ¥0.13/轮 → ¥7.8/月 (77x 但绝对值小); 归因: model_used 落库, 8/31 起
      #   glm 时代 vs flash 时代样本可切分对比 (预注册: 10交易日观察延迟/截断/填充率).
      #   回滚: primary 改回 qwen3.8-flash + max_tokens 可保留 8000 (对 flash 无害).
      # 2026-09-15 (用户裁「请将ue中glm-5.2模型更换为glm-5.3」): UE 主模型 glm-5(=glm-5.2)
      #   → glm-5.3 (裸名; dashscope /models 实测 created=2026-09-15, 8/29 时尚不存在见
      #   DEB-20260829 §326 "GLM系最新=glm-5.2"). 只动 UE 一行: glm-5 别名同时被
      #   stock_analyst(L441) 引用, 改实体 model_name 会连带它静默升版 (超「UE」授权范围),
      #   故新增 glm-5.3 专用实体 + 改本行 (同 deepseek-v41-flash 先例: 单 feature 换档改 features 一行).
      #   同档同系列升版 (非降档); 涨价 输入6→8/输出20→28 元每百万 (华北2裸名定价, help.aliyun.com
      #   /zh/model-studio/glm-5-3), UE ¥/轮级别绝对值小. max_tokens=16000 不变 (官方思维链上限
      #   131072, Max Output 131072, 远大于 16000). prompt_cache 保留 (官方 Context Caching ✓).
      #   归因: model_used 落库, 9/15 起 glm-5.3 时代 vs glm-5.2 时代样本可切分.
      #   回滚: 本行改回 glm-5 一行 (glm-5.3 实体可留, 零引用无害).
      # ⚠️ 必配套 extra_body.enable_thinking=true (2026-09-15 实弹实锤, 缺则切换为空操作):
      #   glm-5.3 是**强制思考**模型 — dashscope 对 enable_thinking=False 返回
      #   HTTP 400 "The value of the enable_thinking parameter is restricted to True."
      #   而 app/llm/model_call.py:_http_call 对全部 dashscope 调用
      #   `payload.setdefault("enable_thinking", False)` (2026-07-06 P0修复: 关思考消灭
      #   empty_response 根因 + 速度 10x) ⇒ glm-5.3 必 400.
      #   失败形态隐蔽: call_llm 两发全 400 → 静默 fallback 到 deepseek-v4.1-flash 且
      #   success=True / fallback_used=True ⇒ **主模型实际变成兜底模型而无人察觉**
      #   (llm_audit id=11675 glm-5.3 HTTP400 → id=11676 deepseek ok, 实测复现).
      #   解法纯配置: payload.update(extra_body) 在 setdefault **之前** (model_call.py:148
      #   vs :163) ⇒ extra_body 已置 True 则 setdefault 不覆盖. 先例 dr_debate(L386).
      #   代价 (诚实披露): 思考 token 计入 max_tokens=16000 预算且计费.
      #   glm-5.2 时代 UE 已有 1 笔 tokens_out=16000 撞顶 + 1 笔 empty_response 失败
      #   (llm_audit 实测 n=39), glm-5.3 思考量更大 (trivial prompt 即 809 tok, 5.2 为 20)
      #   ⇒ 撞顶/截断风险高于 5.2. 若上线后出现 empty_response 或 tokens_out 贴 16000,
      #   处置=抬 max_tokens (官方 Max Output 131072) 或加 thinking_budget 限流.
      extra_body:
        enable_thinking: true
        # 2026-09-18: GLM-5.3 官方参数 reasoning_effort 未传时默认 max, UE 真实
        #   brief 会烧满输出预算并 schema_failed; high 实测 3256 completion tok /
        #   34s / JSON 有效 (low 1727 tok / 18s / JSON 有效但无 reasoning token).
        reasoning_effort: high
      primary: glm-5.3
      prompt_cache: true
    web_search_fundamental:
      cache_on_fail: false
      fallback: deepseek
      max_tokens: 1500
      primary: qwen
      temperature: 0.2
    weekly_proposer:
      fallback: qwen
      primary: deepseek
  # 2026-09-17 (用户裁「要做」): schema失败+finish_reason=length 时自动降max_tokens重试
  #   历史默认False因9/1实测2次全败(输出真超限必死), 但UE glm-5.3撞顶4/4=100%属
  #   "思考链烧预算"非"输出真超限" → 降档可释放输出空间. 回滚: 改回false.
  retry_downshift_enabled: true
  # ── 模型替换 SSOT 指南 (2026-08-27 收敛后) ──────────────────────────────
  # 同档换底层模型: 改本段实体 model_name 一处 → 全部引用该别名的 feature 自动跟随.
  # 单 feature 换档: 改 llm.features.<feature>.primary 一行. 均零代码+热重载生效.
  # 平行直连域 (用真实模型名, 非本段别名 — 有意独立, 勿混):
  #   · scheduler.debate.claude_api_models / claude_cli_model / hermes_model (Claude runner)
  #   · hermes 侧 DA skill env (LLM_MODEL/CHALLENGER_MODEL, ~/.hermes)
  # 已清理死键 (勿再造): llm.legacy_aliases / llm_features.*.model /
  #   llm.strategy_engine 的 model·api_key 系 / config.BAILIAN_MODEL 常量.
  # 2026-08-27 (用户裁决·别名去规格化): 实体 qwen-max → qwen, deepseek-pro → deepseek.
  #   纯键名重命名 — model_name (qwen3.7-max / deepseek-v4-pro) 与全部参数/路由不变,
  #   llm.features 引用已同步. 歧义源=旧别名与 DashScope 真实模型名 qwen-max 同名不同物
  #   (config/__init__.py BAILIAN_MODEL 等直连场景用的是真模型). 归因无断点: model_used
  #   落的是 model_name 真实名, 非别名. 同日删除 llm.legacy_aliases 段 — 唯一消费方
  #   call_llm_compat 为零调用死桥接 (multi_model_client.py 已删), 且 qwen/deepseek
  #   两键与新实体名冲突. 回滚: 键名与 llm.features 引用同步改回 + 恢复 legacy_aliases.
  # 2026-09-01 (PE 审阅卫生批·用户裁"核查确认无误后清理"): 删两个零引用别名 —
  #   ①deepseek-flash (deepseek-v4-flash 直连): features/代码/测试全库零引用,
  #     DEEPSEEK_API_KEY 仅剩 archive 脚本消费; ②qwen-plus (qwen3.6-plus):
  #     features 零引用, review_orchestrator 的 model="qwen3.6-plus" 系
  #     _call_llm_direct 死参数 (该函数明文"忽略, 由 YAML 路由"), 测试引用系
  #     自含 fixture 不读本 yaml。qwen3.8-flash 保留 — UE 8/30 切 glm-5 的
  #     文档化回滚目标 (见该实体注释)。回滚: 恢复两实体块即可, 无消费方依赖。
  models:
    deepseek:
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      cost_in: 0.000298
      cost_out: 0.001191
      model_name: deepseek-v4-pro
      provider: dashscope
      timeout: 300
    # 2026-09-14 (用户裁决): UE 兜底专用实体 — 新增别名, 不动上面 deepseek 实体.
    #   诉求: "DA 和 UE 中 deepseek 版本改 deepseek-v4.1-flash". DA 侧 = hermes
    #   skill 的 CHALLENGER_MODEL 一行, 不经本 yaml; 本实体只服务
    #   UE 侧 (llm.features.universe_expansion_reasoning.fallback).
    #   为何新增别名而非改 deepseek 实体: deepseek 别名被 38 个 feature 中的 30 个
    #   引用 (15 primary + 15 fallback, 含现役 agent_bridge — 9/1 起 49 次生产调用),
    #   改实体 model_name = 这 30 个 feature 全部静默降档 pro→flash, 远超"DA 和 UE"
    #   授权范围. 本仓 SSOT 约定"单 feature 换档 = 改 features 一行", 故新增实体.
    #   ⚠️ 档位提示 (非阻塞, 记录在案): 这是 pro→flash 降档, 不是同档换版 —
    #   v4.1-flash 为 2026-09-10 新发布代次, 但价格与延迟都在 flash 档. UE 兜底位
    #   只在 primary(glm-5) schema 失败/空响应时触发 (9/1 起仅 3 次), 影响面=兜底
    #   路径, 非 UE 主路径.
    #   可达性已实测 (2026-09-14 DashScope 实弹): 返回 model=deepseek-v4.1-flash;
    #   json_mode(schema) ✓; reasoning_content ✓ (思考 token 计入输出计费).
    #   cost 依据 (2026-09-14 修正): 原值系推断 (DashScope /models 不暴露价格, 当时
    #   借 flash 档同价 + Fireworks 旁证估 0.0002/0.0004) — 用户令"模型的调用价格说明
    #   <定价页> 以人民币计价"后, 改按官方定价页换算。
    #     来源: help.aliyun.com/zh/model-studio/model-pricing, 华北2(北京) 表 —
    #     deepseek-v4.1-flash 输入 忙时2元/闲时1元, 输出 忙时8元/闲时4元 (每百万 Token)。
    #     列头"思维链+回答" ⇒ 思考 token **已含在输出单价内**, 不另计费 (本地 reasoning
    #     token 因此天然进 cost_out, 无需单独系数)。
    #   取**闲时**档的依据: 本系统全部 DA/UE 调度都落在忙时窗外 — 忙时 = 周一至周五
    #     9:00-12:00 与 14:00-18:00 (北京时间), 其余全部时间皆闲时; 实测 UE 主 scan
    #     21:10 / inject+push 21:10 / confirm 21:40·22:40 / DA 20:00-20:30 /
    #     UE score 05:40 / midday 00:30 — 无一落在忙时。若将来把调用移进忙时窗,
    #     实账单是本地读数的 2x。
    #   换算: 1元/1M = 0.001元/1k; 汇率 USD/CNY 6.7156 (2026-09-14, open.er-api.com)
    #     ⇒ 输入 $0.0001489/1k, 输出 $0.0005956/1k (即 $0.1489 / $0.5956 per 1M)。
    #   ⚠️ 修正方向**不对称** (留档, 勿当作无意义抖动): 输入被高估 34%
    #     (0.0002→0.000149), 输出被低估 33% (0.0004→0.000596)。两者恰好在
    #     "输入:输出 ≈ 1:1"的混合比例上相互抵消, 所以旧值在总量上偶然接近真值 —
    #     但结构是错的: 本模型输出单价是输入的 4x, 任何输入/输出配比变化都会露馅。
    #   两处未建模的偏差 — 恒定 cost 字段无法表达, 实际账单**低于**本读数:
    #     ①显式缓存: 创建按输入单价 125%、命中按 10% 计费 (百炼规则); 本实体未挂
    #       cache_control, 故 UE 兜底位用不到 (UE 主路径用缓存的是别的实体);
    #     ②Batch 调用半价 (本系统未启用)。
    #   归因: UE 指令行落 model_used=真实 model_name ⇒ v4.1-flash 时代样本与
    #   glm-5/qwen 时代天然可切分。
    #   回滚: universe_expansion_reasoning.fallback 改回 deepseek 一行 (本实体可留,
    #   零引用无害; 若要清干净, 删本块)。备份: unified_config.yaml.bak-v41flash-cost-20260914。
    deepseek-v41-flash:
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      cost_in: 0.000149
      cost_out: 0.000596
      model_name: deepseek-v4.1-flash
      provider: dashscope
      timeout: 300
    glm-5:
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      cost_in: 0.000893
      cost_out: 0.002978
      model_name: glm-5.2
      provider: dashscope
      timeout: 300
    # 2026-09-15 (用户裁「请将ue中glm-5.2更换为glm-5.3」): UE 主模型专用实体.
    #   为何新增而非改 glm-5 实体: glm-5 别名被 UE + stock_analyst 两 feature 共享,
    #   改实体 model_name = stock_analyst 连带静默升版 (超授权). 单 feature 换档 = 新增实体
    #   + 改 features 一行 (本仓 SSOT 约定, 同 deepseek-v41-flash 先例).
    #   cost 依据: help.aliyun.com/zh/model-studio/glm-5-3 华北2(北京)裸名定价 —
    #   输入 8 / 输出 28 / 缓存命中输入 2 (元每百万 tokens), 单一档无 32k 分档.
    #   换算 (2026-09-17 修正): model_call.py:230-244 cost = tok/1000 × rate, 字段名
    #     cost_usd ⇒ 实体单位 = 美元每千 tokens. 人民币价 ÷ 汇率 6.7156 (2026-09-14
    #     open.er-api.com). glm-5.3: 8/28 元每百万 ÷1000 ÷6.7156 → 0.001191 / 0.004169.
    #   ⚠️ 较 glm-5.2 (0.000893/0.002978) 涨价 输入+33%/输出+40%; UE 主调用 max_tokens=16000,
    #   单轮成本仍 ¥ 级别 (8/30 实测 glm-5.2 ¥0.13/轮 → 5.3 约 ¥0.18/轮), 绝对值小.
    #   可达性已实测 (2026-09-15 dashscope 实弹): model 回显 glm-5.3 / json_mode ✓ /
    #   finish=stop / reasoning_content 有 (同 glm-5.2, 思考 token 计入输出计费).
    glm-5.3:
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      cost_in: 0.001191
      cost_out: 0.004169
      model_name: glm-5.3
      provider: dashscope
      timeout: 300
    kimi-k2:
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      cost_in: 0.000596
      cost_out: 0.002383
      model_name: kimi-k2.6
      provider: dashscope
      timeout: 60
    qwen-flash:
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      cost_in: 0.0003
      cost_out: 0.0006
      model_name: qwen3.6-flash
      provider: dashscope
      timeout: 8
    # 2026-08-27 (UE 主模型切换配套): qwen3.8-flash 实体定义 — DashScope 实测可达
    #   (2026-08-27 实弹返回 model=qwen3.8-flash, 带 reasoning_content 非流式可关).
    #   cost 按 qwen flash 档公开价与 qwen-flash 同价 (0.0003/0.0006), 实际账单
    #   以 DashScope 为准 — 若 DashScope 后续调整, 从 llm_audit.cost_usd 偏差可发现.
    #   timeout 300 对齐 qwen (原 qwen-max; UE brief 输入大, 8s 会截断长输出; flash 实测
    #   reasoning token 占用, 需给足生成时间).
    qwen3.8-flash:
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      cost_in: 0.0003
      cost_out: 0.0006
      model_name: qwen3.8-flash
      provider: dashscope
      timeout: 300
    qwen:
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      cost_in: 0.001191
      cost_out: 0.003574
      model_name: qwen3.7-max
      provider: dashscope
      timeout: 300
  # 2026-08-27 (SSOT收敛·A类清理): 删除本块 model/api_key/api_key_env/base_url/
