COST_MODEL:
  assumed_holding_days: 5.0
  commission_per_share: 0.0
  default_adv_shares: 5000000
  default_borrow_rate: 0.02
  default_option_spread_bps: 80.0
  default_stock_spread_bps: 3.0
  enabled: true
  fixed_fee_bps: 0.3
  impact_coef_bps: 12.0
  max_penalty: -20
  net_edge_floor_bps: 5.0
  net_edge_safe_bps: 25.0
  option_commission_per_contract: 0.65
  option_exchange_fee_bps: 1.0
  option_max_spread_pct: 0.05
  pre_after_session_mult: 3.0
broker:
  futu_us:
    commission_per_share: 0.01
    commission_min_per_order: 1.99
    commission_max_pct_of_amount: 0.003
    platform_fee: 0.0
    settlement_per_share: 0.003
    sec_fee_schedule:
    - from: '1900-01-01'
      rate: 0.0
    - from: '2026-04-04'
      rate: 2.06e-05
    sec_fee_min: 0.01
    taf_per_share: 0.000195
    taf_min: 0.01
    taf_max: 9.79
    cat_per_share_nms: 3.0e-06
    cat_per_share_otc: 3.0e-08
    borrow_day_basis: 365
capital:
  description: 'Capital mode for adaptive risk. "simulation": uses fixed_amount. "live":
    reads from broker.'
  fixed_amount: 82000
  tiers: &id001
    inst:
      max_equity: null
      max_position_pct: 0.15
      max_positions: 15
      min_equity: 1000000
      min_trade_usd: 10000
      risk_pct: 0.02
      total_pct: 0.1
    large:
      max_equity: 1000000
      max_position_pct: 0.2
      max_positions: 10
      min_equity: 200000
      min_trade_usd: 5000
      risk_pct: 0.025
      total_pct: 0.15
    medium:
      max_equity: 200000
      max_position_pct: 0.08    # DEB-20260815 P0-A (2026-08-15): 0.25→0.08 单名帽收紧,
      #   实盘人工8个月教训: MU单名集中86%($44.5k/$51.7k)+SNDK扛单-$65.9k. 回滚: 改回0.25.
      max_positions: 10
      min_equity: 50000
      min_trade_usd: 2000
      risk_pct: 0.03
      total_pct: 0.2
    micro:
      max_equity: 10000
      max_position_pct: 0.35
      max_positions: 3
      min_equity: 0
      min_trade_usd: 100
      risk_pct: 0.05
      total_pct: 0.3
    small:
      max_equity: 50000
      max_position_pct: 0.3
      max_positions: 5
      min_equity: 10000
      min_trade_usd: 500
      risk_pct: 0.035
      total_pct: 0.25
catalyst:
  enabled: false
  postmarket:
    enabled: true
    generate_lessons: false
  premarket:
    consensus_threshold: 0.4
    debate_timeout_seconds: 180
    min_severity: HIGH
    scan_news_hours: 12
  reverse_catalyst:
    enabled: false
    min_change_pct: 0.03
    quick_debate_rounds: 1
    quick_debate_timeout: 60
  sector_mapping:
    ai_chip:
    - NVDA
    - AMD
    - AVGO
    - MU
    - ARM
    - QCOM
    big_tech:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    chinese_adr:
    - FUTU
    - BABA
    - PDD
    - BIDU
    - JD
    - NIO
    - LI
    - XPEV
    chinese_broker:
    - FUTU
    - TIGR
    - HLBZ
    ev:
    - TSLA
    - RIVN
    - LCID
    - NIO
    - XPEV
    - LI
  sources:
    cls_interval_minutes: 2
    csrc:
      enabled: false
      interval_seconds: 300
    hkex:
      enabled: false
      interval_seconds: 120
data_sources:
  alphavantage:
    api_key: ${ALPHAVANTAGE_API_KEY}
    cache_ttl:
      quote: 300
      spy: 900
      timeseries: 1800
      vix: 60
    premium: false
    rate_limit_per_day: 500
    rate_limit_per_min: 5
  finnhub:
    api_key: ${FINNHUB_API_KEY}
    cache_ttl:
      news: 7200
      quote: 60
      sentiment: 3600
    rate_limit_per_min: 60
    refill_interval_sec: 1.0
  priority:
    fallback: alphavantage
    primary: twelvedata+finnhub
  twelvedata:
    api_key: ${TWELVEDATA_API_KEY}
    batch_size: 8
    cache_ttl:
      quote: 300
      spy: 900
      timeseries: 1800
      vix: 60
    rate_limit_per_min: 8
    refill_interval_sec: 7.5
  futu_lv3:
    stock_sub_types:
    - QUOTE
    - K_1M
    active_set_orderflow_enabled: true
database:
  backup_enabled: true
  backup_interval_hours: 24
  path: data/ftseek_us.db
  type: sqlite
decision:
  market_regime:
    check_interval: 300
  position_ratios:
    high: 1.0
    low: 0.25
    medium: 0.5
  signal_thresholds:
    high_score: 85
    medium_score: 70
    min_score: 50
  signal_timing:
    cooldown_seconds: 120
    expire_seconds: 300
  strategy_weights:
    ma_cross: 0.28
    price_break: 0.36
    rsi_rebound: 0.36
deployment:
  feature_flags:
    ic_feedback_to_screener: false
    ic_hard_blocking: true
    unified_backfill: false
    vix_hard_blocking: true
    weight_v2_active: true
description: FTSeek-US 美股模拟交易系统 - 统一配置 v3 (含新闻V2 + 配置治理 + 地缘增强)
diagnostics:
  description: 非交易路径诊断 Overlay — 零侵入现有交易管线
  enabled: true
  geopolitical_reasoner:
    min_confidence: 0.65
    mode: rules
  schedule:
    on_demand:
      enabled: true
      modules:
      - geopolitical_reasoner
    post_market:
      enabled: false
      modules:
      - shadow_account
      - statistical_validator
      time: '20:30'
  shadow_account:
    lookback_days: 30
  statistical_validator:
    n_simulations: 1000
    risk_free_rate: 0.05
dual_mode:
  aggressive:
    max_daily_auto_trades: 5
    max_per_trade_usd: 30000
    max_position_pct: 0.2
    max_total_exposure: 0.75
    min_confidence: 0.45
    min_signal_strength: 40
    position_scale_factor: 1.5
    stop_loss_tighten_factor: 1.2
  auto_enabled: true
  conservative:
    max_daily_auto_trades: 3
    max_per_trade_usd: 5000
    max_position_pct: 0.06
    max_total_exposure: 0.3
    min_confidence: 0.7
    min_signal_strength: 70
    position_scale_factor: 0.5
    stop_loss_tighten_factor: 0.7
  normal:
    max_daily_auto_trades: 4
    max_per_trade_usd: 20000
    max_position_pct: 0.12
    max_total_exposure: 0.6
