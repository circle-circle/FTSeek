version: 3.0.0
updated: '2026-04-29'
description: FTSeek-US 美股模拟交易系统 - 统一配置 v3 (含新闻V2 + 配置治理 + 地缘增强)
base:
  project_name: FTSeek-US
  version: 1.0.0
  market: US
  currency: USD
  timezone: America/New_York
  trade_env: 1
  simulate_account_id: ''

# 运行模式 (2026-05-14, karpathy MVP):
# - normal: 标准风控 + 标准频率 (实盘 / 上线候选)
# - sandbox: 模拟盘加速实验 — 风控放宽 + 频率提升, 仅 universe 内交易
# 切换: 改 mode.sandbox.enabled 后重启
# 数据隔离: trade_records.mode 字段标记 (sandbox/normal), 不混淆复盘
mode:
  sandbox:
    enabled: true               # P1-D (2026-05-15): 启用沙盒加速实验
    # O7 (2026-05-16): rebalance — 干掉 AAPL/MSFT/META (5/15 信号 0 笔, ATR 干涸)
    # 加入 RIVN/LCID/SNDK/ARM/NIO/BWXT/MU (5/15 实际有信号触发的高波动小盘)
    # 保留 NVDA/TSLA/AMD/SPY/QQQ 作为 anchor + ETF beacon. 总 12 只.
    universe:                   # 沙盒仅交易这些 symbol (覆盖 watchlist)
      # ── Anchor (大盘半导体 + 龙头, 保留 LLM 计划匹配能力) ──
      - NVDA                    # AI 龙头, 计划频繁出现
      - TSLA                    # EV 龙头, 计划频繁出现
      - AMD                     # 半导体二线, ATR 中等
      # ── 高波动小盘 (Scalping 友好, 信号易触发) ──
      - RIVN                    # ATR%≈0.20%, 5/15 实际有 LONG 触发
      - LCID                    # ATR%≈0.19%, 与 TSLA 非完全同步, 5/14 跌 8 笔
      - SNDK                    # 高波存储芯片, 5/15 SHORT +$195
      - ARM                     # 5/15 SHORT +$1219 (单日最大盈利)
      - NIO                     # 中概 EV, 高波动
      - BWXT                    # 唯一 SHORT 信号高触发的工业股
      - MU                      # 存储周期股, 波段明确
      # ── 市场 beacon (大盘+科技基准, Beta 对冲) ──
      - SPY
      - QQQ
    # 风控放宽 (但不禁)
    overrides:
      scheduler.scan_interval_minutes: 3       # 10 → 3
      scheduler.monitor_interval_minutes: 0.25 # 0.5 → 0.25
      strategy.signal_cooldown: 30             # 120 → 30
      risk.signal_quality.min_confidence: 0.45 # 0.50 → 0.45
      strategies.defaults.min_strength: 20     # 25 → 20
      MAX_DAILY_DRAWDOWN: 0.05                 # 0.03 → 0.05
      risk.position.max_per_sector: 0.55       # 0.40 → 0.55
      symbol_cooldown.reversal_seconds: 60     # F1: 沙盒加速实验 (180 → 60)
    # 永远不动的硬底线 (即使沙盒也保留)
    keep_strict:
      - kill_switch
      - per_trade_risk_pct                     # 单笔风险 R 不动
      - max_total_position                     # 总敞口不动
      - sector_circuit_breaker
      - critical_alerts

# F18 (2026-05-12): 路径单一真相源 — 所有模块通过 app.core.paths 获取
paths:
  data_dir: "data"
  reviews_dir: "data/daily_reviews"
  weekly_reviews_dir: "data/weekly_reviews"
  monthly_reviews_dir: "data/monthly_reviews"
  improvement_plans_dir: "data/improvement_plans"
  decisions_db: "data/decisions.db"
  rejections_db: "data/rejections.db"
  trade_records_db: "data/ftseek_us.db"
  trade_records_legacy_db: "data/trade_records.db"
  trade_records_json: "data/trade_records.json"
  exit_quality_db: "data/exit_quality.db"
  review_db: "data/ftseek_us_review.db"
  battle_plan: "data/daily_battle_plan_us.json"
  obsidian_vault: "obsidian_vault"
  vix_cache_dir: "data/vix_cache"
  news_us_db: "data/rsshub_us/news_us.db"
  debate_history_db: "data/debate_framework/debate_history.db"
  watchlist: "config/watchlist_us.json"
  us_stock_config: "config/us_stock_config.yaml"
  logs_dir: "logs"
  config_path: "config/unified_config.yaml"
  exit_policy: "app/risk/exit_policy.yaml"

# LLM 预算控制 (2026-05-13)
llm_budget:
  daily_max_usd: 5.0           # 每日 LLM 总成本上限
  per_module:
    attribution: 2.0           # 逐笔归因上限
    weekly_proposal: 2.0       # 周度假设上限
    premarket: 1.0             # 盘前上限
  cost_alerts:
    warn_pct: 0.7              # 70% 告警
    halt_pct: 1.0              # 100% 停用

# 异构模型配置 (2026-05-13)
# DEPRECATED (2026-05-15): llm_models 配置 0 代码引用 (死配置)
# 实际模型映射在 app/llm/multi_model_client.py:DEFAULT_MODEL_FOR
# 保留此 section 仅为兼容性参考, 修改不会生效
llm_models:
  attribution: "qwen"          # DEPRECATED — 实际由 DEFAULT_MODEL_FOR 控制
  proposal: "deepseek"         # DEPRECATED
  sentiment: "minimax"         # DEPRECATED
  fallback: "qwen"             # DEPRECATED

# ─── 统一 LLM 路由 (2026-05-17, model_call.py SoT) ───
# 切换模型只动这里: llm.models.<alias>.model_name
# 业务 feature → 模型映射: llm.features.<feature>
llm:
  # 4 个具体型号 (替代旧 multi_model_client.MODEL_REGISTRY)
  # flash = 低延迟轻量, pro = 深度推理
  models:
    qwen-flash:
      provider: dashscope
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model_name: qwen3.6-flash       # ← 升级模型仅改这里
      timeout: 8                       # 秒
      cost_in: 0.0003                  # USD per 1k tokens
      cost_out: 0.0006
    qwen-plus:
      provider: dashscope
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model_name: qwen3.6-plus
      timeout: 30
      cost_in: 0.004
      cost_out: 0.012
    deepseek-flash:
      provider: deepseek
      api_key_env: DEEPSEEK_API_KEY
      base_url: https://api.deepseek.com
      model_name: deepseek-v4-flash
      timeout: 8
      cost_in: 0.0002
      cost_out: 0.0008
    deepseek-pro:
      provider: deepseek
      api_key_env: DEEPSEEK_API_KEY
      base_url: https://api.deepseek.com
      model_name: deepseek-v4-pro
      timeout: 30
      cost_in: 0.002
      cost_out: 0.008

  # Feature → Model 路由
  # 简单格式: 'feature_name: <alias>' (单模型, 失败 None)
  # 完整格式: 'feature_name: {primary, fallback, cache_on_fail}'
  features:
    # 延迟敏感 (FLASH, 单模型, 失败仅日志)
    news_classifier:    qwen-flash
    thesis_inferer:     qwen-plus              # 2026-05-21: 改用 dashscope
    sentiment:          qwen-flash

    # 质量敏感 (PRO, 主备 + 缓存兜底)
    premarket_planner:  {primary: qwen-plus,     fallback: deepseek-pro, cache_on_fail: true}
    daily_review:       {primary: deepseek-pro,  fallback: qwen-plus,    cache_on_fail: true}
    weekly_proposer:    {primary: deepseek-pro,  fallback: qwen-plus}
    daily_auto_tuner:   {primary: deepseek-pro,  fallback: qwen-plus}
    regime_classifier:  {primary: qwen-plus,     fallback: deepseek-pro}

    # 关键决策 (PRO + critique 双调, 通过 cross_check 字段控制)
    earnings_analyst:        {primary: qwen-plus,    fallback: deepseek-pro}
    large_position_review:   {primary: qwen-plus,    fallback: deepseek-pro}
    emergency_review:        {primary: deepseek-pro, fallback: qwen-plus}

    # ⭐ NEW 2026-05-19 — 真正影响交易决策的 LLM features
    # 第一性原则: LLM 只做量化做不到的事 (跨时间模式 + 多源综合 + 因果推理)
    pre_entry_gate:          {primary: deepseek-pro, fallback: qwen-plus, cache_on_fail: false}
    failure_mode_miner:      {primary: deepseek-pro, fallback: qwen-plus}
    adaptive_tuner:          {primary: deepseek-pro, fallback: qwen-plus}

    # ⭐ 2026-05-21 统一迁移 — 原散在 _call_llm 模块
    llm_strategy_engine:     {primary: qwen-plus,     fallback: deepseek-pro}   # json_mode, 策略打分
    model_agent:             {primary: deepseek-pro,  fallback: qwen-plus}      # json_mode, 投票评分
    debate_engine:           {primary: qwen-plus,     fallback: deepseek-pro}   # enable_thinking=false
    agent_bridge:            {primary: deepseek-pro,  fallback: qwen-plus}      # json_mode, 辩论桥接
    claude_code:             {primary: deepseek-pro,  fallback: qwen-plus}      # 代码生成

  # 旧别名兼容映射 (2026-05-21): 原 multi_model_client 的 "qwen"/"deepseek" 等别名
  # 迁移期使用，后续代码统一改用 feature 路由后可删除
  legacy_aliases:
    qwen: qwen-plus
    deepseek: deepseek-pro
    minimax: qwen-flash          # MiniMax 已停用，降级用 qwen-flash
    fallback: qwen-plus

  # 默认值
  defaults:
    cache_dir: data/llm_cache
    divergence_threshold: 0.5     # cross_check 时 critic severity ≥ 此值则拒方案

  # 旧 strategy_engine — 仅 app/strategy/llm_strategy_engine.py 仍读
  # 2026-05-17 已合并入主 llm 段, 防 yaml 重复 key 覆盖. premarket_planner 已迁 model_call.
  strategy_engine:
    enabled: true
    provider: bailian
    model: qwen-max
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: BAILIAN_API_KEY
    api_key: ''
    timeout_seconds: 300
    thinking_level: high

# LLM 增强 features (L1-L12, 2026-05-14) — 默认全部 disabled, 模拟盘逐项打开验证
llm_features:
  # ─── L1 新闻 LLM 解读 ───
  news_classifier:
    enabled: true                 # P1-B (2026-05-15): 启用 — 新闻 alpha 缺失修复
    model: minimax              # 情绪分析便宜
    timeout_sec: 20
    daily_max_usd: 0.50         # 单 feature 预算
  news_signal_gen:              # L9, 依赖 L1
    enabled: false
    min_credibility: 0.6
    min_abs_sentiment: 0.5
    cooldown_sec: 300
    max_position_pct: 0.05
    impacted_min_confidence: 0.7
  news_multilang:               # L12, 依赖 L1
    enabled: false              # 中/日/英 prompt 适配

  # ─── L2 LLM 风控 gating ───
  emergency_review:
    enabled: false
    model: qwen
    timeout_sec: 30
    cooldown_sec: 3600
    price_drop_5m_threshold: 0.03
    vix_spike_5m_threshold: 0.20
    negative_news_threshold: 0.6
    daily_max_usd: 0.30

  # ─── L3 entry_thesis 推断 ───
  thesis_inferer:
    enabled: true                 # PB-1 (2026-05-15): 启用 — 让退出按入场理由选 policy
    model: qwen-plus            # 2026-05-21: 改用 dashscope (DEEPSEEK_API_KEY 未配置)
    timeout_sec: 15
    daily_max_usd: 0.40

  # ─── L4 Earnings analyst — DEPRECATED 2026-05-19 ───
  # 砍掉理由: 财报日期是公开数据, 用日历 + RSS 即可, LLM 多余.
  # 第一性原则: LLM 应做量化做不到的事, 财报日历不属于此类.
  earnings_analyst:
    enabled: false              # DEPRECATED — 不要重新启用, 见 docs/LLM_FIRST_PRINCIPLES_2026-05-19.md
    model: qwen
    timeout_sec: 30
    daily_max_usd: 0.40

  # ─── L5 多模型分歧仲裁 — DEPRECATED 2026-05-19 ───
  # 砍掉理由: 主线 voting 已是 5 model agent (technical/sentiment/momentum/regime/risk),
  # 再加 LLM 仲裁是"在多模型上加多模型", 不是真正解决决策问题.
  disagreement_arbitrator:
    enabled: false              # DEPRECATED — voting 多模型已足够
    arbitrator_model: qwen
    disagreement_threshold: 0.5
    daily_max_calls: 10
    timeout_sec: 30
    daily_max_usd: 0.30

  # ─── L6 场景分类器 — 暂保留 (但不启用) 2026-05-19 ───
  # 现状: market_data_router 已用 RSI/MACD 规则给出 regime (TREND_UP/DOWN/RANGE),
  # 5/18 实测 regime 准确率约 70-80%. LLM regime_classifier 30min 一次频率太高 + 成本 ~$1/日.
  # 替代方案: 改在 weekly_proposer 中由 LLM 给出"本周市场 regime 主基调", 替代 30min 高频
  regime_classifier:
    enabled: false              # 暂禁用, 可能在 weekly_proposer 中复用
    model: qwen
    interval_minutes: 30
    timeout_sec: 20
    daily_max_usd: 0.30

  # ─── L7 大仓位 LLM 确认 — DEPRECATED 2026-05-19 ───
  # 砍掉理由: max_position_pct 已是硬约束 (yaml.risk.max_position_pct=0.25),
  # LLM 入场前复审反而拖慢 100ms+, 在快速行情中增加 missed alpha 风险.
  large_position_review:
    enabled: false              # DEPRECATED — 风控硬约束已经够
    model: qwen
    position_pct_threshold: 0.05
    cooldown_sec: 3600
    timeout_sec: 60
    daily_max_usd: 0.30

  # ─── L8 日级 AutoTuner — 待重构启用 2026-05-19 ───
  # 重构方向: 输出 yaml 调参建议写入 auto_tuner_proposals.db, 人工 review 后应用.
  # 见 scripts/llm_adaptive_tuner.py
  daily_auto_tuner:
    enabled: false              # 待 scripts/llm_adaptive_tuner.py 实施
    model: deepseek
    timeout_sec: 60
    daily_max_usd: 0.50

  # ─── L10 复盘对话 CLI ───
  replay_dialog:
    enabled: true               # 默认开 (CLI 工具无副作用)
    daily_max_usd: 1.00

  # ─── L11 行业关联推理 — DEPRECATED 2026-05-19 ───
  # 砍掉理由: 信号已含 SPY 对冲信息, 行业关联是 nice-to-have, ROI 不明确.
  # 5/12-5/18 数据看, 单 symbol 模式 (LCID LONG 14 笔全亏) 比行业关联更直接.
  sector_correlation:
    enabled: false              # DEPRECATED — ROI 不明确, 优先做 Pre-Entry Gate
    model: qwen
    anchor_move_threshold: 0.02
    cooldown_sec: 1800
    timeout_sec: 30
    daily_max_usd: 0.30

  # ─── L13 紧急风控 LLM 复审 — DEPRECATED 2026-05-19 ───
  # 砍掉理由: 风控触发时必须立刻平仓, LLM 反应慢 100x. 与第一性原则矛盾 (在快速决策路径加慢调用).
  # 见 yaml.llm_features.emergency_review (line 192)

  # ─── L14 ⭐ Pre-Entry Signal Gate — NEW 2026-05-19 ───
  # 新增: 在 main entry 前用 LLM 拦截"看历史就该拒"的入场信号.
  # 输入: 候选信号 + 该 symbol+direction 7d 历史 + market_ctx
  # 输出: {go: bool, reason: str, confidence: float}
  # 失败降级: go=True (不阻塞主线, 向后兼容)
  # 价值: 5/12-18 LCID LONG 14 笔 -$694 这种, LLM 看历史立即拦截
  pre_entry_gate:
    enabled: false              # 默认 disabled, 等今晚 audit raw 数据观察后启用
    model: deepseek-pro         # 走 model_call yaml route 实际优先级
    timeout_sec: 5              # 主线 entry 路径必须快, 5s 超时降级放行
    min_history_trades: 5       # 该 symbol+direction 至少 5 笔历史才用 LLM (否则数据不足放行)
    cache_ttl_sec: 300          # 同 symbol+direction 5min 内复用结果, 减成本
    daily_max_usd: 1.50         # 主线 ~30 entry/天 × $0.05 = ~$1.5

# ── 统一推送 PushHub 配置 (2026-05-16, app/push/) ──
# 防疲劳 + 聚合 + 多通道 fallback. 旧 app/notifier/* 仍可用 (作为 channel backend).
push:
  dedup_ttl_sec: 60               # 同 dedup_key 60s 内去重
  aggregate_window_sec: 300       # LOW 级别消息 5min 窗口聚合
  health_check: true              # 每小时 ping 验证通道存活
  # 渐进迁移 (2026-05-16): 启用 PushHub, 旧 notifier 调用方逐步切
  enabled: true

trading_hours:
  market_open: 09:30
  market_close: '16:00'
  pre_market_open: 04:00
  after_market_close: '20:00'
opend:
  host: ${OPEND_HOST}
  port: 11111
  login_account: ${FUTU_LOGIN_ACCOUNT}
  login_password: ${FUTU_LOGIN_PWD}
data_sources:
  twelvedata:
    api_key: ${TWELVEDATA_API_KEY}
    rate_limit_per_min: 8
    refill_interval_sec: 7.5
    cache_ttl:
      quote: 300
      timeseries: 1800
      vix: 600
      spy: 900
    batch_size: 8
  finnhub:
    api_key: ${FINNHUB_API_KEY}
    rate_limit_per_min: 60
    refill_interval_sec: 1.0
    cache_ttl:
      quote: 60
      news: 7200
      sentiment: 3600
  alphavantage:
    api_key: ${ALPHAVANTAGE_API_KEY}
    premium: false
    rate_limit_per_min: 5
    rate_limit_per_day: 500
    cache_ttl:
      quote: 300
      timeseries: 1800
      vix: 600
      spy: 900
  priority:
    primary: twelvedata+finnhub
    fallback: alphavantage
