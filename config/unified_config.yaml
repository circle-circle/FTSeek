      fixed_target: 0.05
      initial_stop: 0.02
notification:
  dingtalk:
    enabled: true
    mode: enterprise
    webhook_url: ${DINGTALK_WEBHOOK_URL}
    secret: ${DINGTALK_SECRET}
    app_key: ${DINGTALK_APP_KEY}
    app_secret: ${DINGTALK_APP_SECRET}
    agent_id: ${DINGTALK_AGENT_ID}
    timeout: 600
    push_on_signal: true
    push_on_execution: true
    push_on_error: true
  alerts:
    contacts:
    - name: 管理员
      phone: ${ADMIN_PHONE}
      email: ${ADMIN_EMAIL}
schedule:
  daily_stats_time: '16:30'
  weekly_report_time: 09:00
  monthly_report_time: 09:00
  risk_monitor_interval: 120
monitoring:
  metrics:
    enabled: true
    collect_interval: 10
    storage_dir: data/metrics
    retention_hours: 24
    core_metrics:
    - system_cpu_percent
    - system_memory_percent
    - system_disk_percent
    - opend_connection_status
    - trade_success_rate
    - signal_count
  alerts:
    enabled: true
    rules_config: config/alert_rules.yaml
    storage_dir: data/alerts
    default_cooldown: 3600
  health_check:
    enabled: true
    port: 8899
    endpoints:
    - /health
    - /health/live
    - /health/ready
    - /health/status
    - /health/metrics
server:
  callback_host: 0.0.0.0
  callback_port: 8899
  callback_external_url: http://39.97.58.4:8899
  api_token: ${API_TOKEN}
  tradingview_webhook_token: ${TRADINGVIEW_WEBHOOK_TOKEN}
  rate_limit:
    max_requests: 30
    window_seconds: 60
  signal_expire_seconds: 300
persistence:
  state_file: data/state_snapshot.json
  decision_log_file: data/decision_log.json
  sessions_dir: data/sessions
  auto_snapshot_interval: 300
  max_decision_log_entries: 10000
  session_expiry_hours: 24
database:
  type: sqlite
  path: data/ftseek.db
  pool:
    enabled: false
    max_connections: 10
    timeout: 30
  backup:
    enabled: true
    interval_hours: 24
    retention_days: 30
    backup_dir: data/backups
backtest:
  presets_file: config/backtest_presets.json
  default:
    initial_capital: 1000000
    commission_rate: 0.0003
    slippage: 0.001
    start_date: '2025-01-01'
    end_date: '2025-12-31'
logging:
  level: INFO
  format: '%(asctime)s [%(name)s] [%(trace_id)s] %(levelname)s: %(message)s'
  propagate: true
  dir: logs
  files:
    main: ftseek.log
    error: ftseek_error.log
    warning: ftseek_warning.log
    trade: trades.log
    risk: risk.log
  max_size_mb: 50
  backup_count_size: 5
  backup_count_daily: 30
  enable_json_format: false
  enable_trace_id: true
  console_output: true
trading_costs:
  commission_rate: 0.0003
  min_commission: 15.0
  stamp_duty: 0.0013
  trading_fee: 5.0e-06
  clearing_fee: 2.0e-06
  platform_fee: 15.0
markets:
  hk:
    market_type: hk
    currency: HKD
    trading_hours:
      open: 09:30
      close: '16:00'
      lunch_break_start: '12:00'
      lunch_break_end: '13:00'
    check_interval: 300
    night_interval: 900
  us:
    market_type: us
    currency: USD
    trading_hours:
      open: '21:30'
      close: 04:00
    check_interval: 300
    night_interval: 900
migration:
  note: 本配置文件已整合所有分散配置
  merged_files:
  - risk_config.yaml
  - strategy_params.json
  - dynamic_exit_params.yaml
  - position_strategy.yaml
  - app_config.yaml
  - system_config.yaml
  deprecated_after: '2026-04-30'
  action: 移至 config/deprecated/ 目录
alerts:
  dingtalk:
    enabled: true
    webhook: ${DINGTALK_WEBHOOK_URL}
    secret: ${DINGTALK_SECRET}
  feishu:
    enabled: true
    webhook: ${FEISHU_WEBHOOK_URL}
    secret: ${FEISHU_SECRET}
  rules:
  - id: daily_loss
    condition: daily_loss_pct > 0.03
    action: halt_trading
    notify: true
    level: P0
  - id: max_drawdown
    condition: drawdown_pct > 0.12
    action: close_all
    notify: true
    level: P0
  - id: circuit_breaker
    condition: reject_count > 8
    action: pause_trading
    notify: true
    level: P1
market_regime:
  adx_thresholds:
    trend: 25
    range: 20
  regime_check_interval_sec: 300
