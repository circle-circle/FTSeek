    max_daily_trades: 500
    max_order_amount: 120000
    min_liquidity_ratio: 0.5
  signal_quality:
    # P0 (2026-06-03): 0.65→0.55, 降低基线让 direction_bias 控制
    # 数据: confidence 0.5-0.65 区间是唯一正期望 (+$5,712)
    # 真正的过滤器是 signal_strength>=60 (阻断 -$18K vlow 区间)
    min_confidence: 0.70
    min_consensus: 0.25   # P0 (2026-06-03): 0.20→0.25, 对齐 scheduler
    min_score: 60         # 2026-06-13: 50→60 对齐所有 min_strength 路径 (pre_trade/strategies/scheduler均为60)
  # Task #6 (2026-05-30): 仓位计算ATR联动配置
  # risk_per_trade_pct: 0.005 → 0.008 (单笔风险预算放大), max_position_pct: 0.15 → 0.12 (单标的上限收紧)
  position_sizing:
    risk_per_trade_pct: 0.008    # 0.5% → 0.8% 单笔风险
    max_position_pct: 0.12       # 15% → 12% 单标的最大仓位
  # P1 Regime Gate (2026-05-24 辩论共识): 方向感知入场过滤
  # SPY<MA200 仅拦截 LONG (SHORT 仍允许); VWAP 过滤低强度多头
  p1_regime_gate:
    enabled: true                    # 总开关
    vwap_filter_enabled: true        # VWAP 子开关 (LONG + strength<80 + price<VWAP → 拦截)
    vwap_threshold: -0.001           # VWAP 偏离度阈值 (<此值视为弱势)
  # stop_loss / take_profit: 已迁移到 dynamic_exit.* (regime-aware profiles)
  # 历史字段已删除 (2026-06-01) — grep 确认无代码引用. 改动: 服务 OKR PnL ≥ 0
  circuit_breaker:
    strategy:
      consecutive_losses: 3
      hourly_loss_threshold: -0.02
      daily_loss_threshold: -0.03
      pause_duration: 1800
    symbol:
      volatility_threshold: 0.05
      spread_threshold: 0.005
      volume_drop_threshold: 0.5
    system:
      market_data_timeout: 60
      order_latency_threshold: 5
      missing_fill_timeout: 3
# Phase 4 (2026-05-31): ExitRuleDispatcher 正式路由控制器
# 由 app/pipeline/position_monitor.py::_check_positions 读取
# 与 risk.exit_routing 共存：本控制器决定 dispatcher 是否参与主路径执行；
# risk.exit_routing 仅控制 position_exit_monitor 内部的 shadow 评估日志。
exit_rules_controller:
  dispatcher_enabled: true        # 启用 ExitRuleDispatcher 主路径
  shadow_mode: false              # false=正式执行；true=仅记录决策
  monitor_comparison: true        # 保留新旧决策对比日志（用于验证）
  fallback_on_error: true         # dispatcher 异常时回退到旧 PositionExitMonitor
  log_suppressed_rules: true      # 记录被互斥压制的规则
