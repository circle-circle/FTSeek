# FTSeek V5 统一配置文件
# version: 5.1.0
# updated: 2026-04-02
# description: 完整统一配置（合并所有分散配置）

# ============================================================================
# 基础配置
# ============================================================================
version: 5.1.0
environment: production
updated: 2026-04-02
description: "FTSeek 港股量化交易系统 - 统一配置"

# ============================================================================
# 策略配置（合并 strategy_params.json）
# ============================================================================
strategy:
  # 启用的策略
  enabled:
    primary: "confluence_v2"      # 主力策略
    trend: "supertrend"           # 趋势策略
    sentiment: "sentiment_ai"     # 情绪策略
    disabled:
      - "rsi"
      - "macd"
      - "bollinger"
      - "confluence"
      - "price_break"
  
  # 策略权重
  weights:
    confluence_v2: 1.5            # 主力融合策略
    supertrend: 1.0               # 趋势跟踪
    sentiment_ai: 0.8             # AI情绪分析
  
  # 共识引擎配置
  consensus:
    threshold: 1.1                # 触发阈值
    min_strategies: 2             # 最少策略数
    window_seconds: 90            # 共识窗口（秒）
    adx_trend: 25                 # ADX趋势判定
    adx_range: 20                 # ADX震荡判定
    short_bias_factor: 1.0        # 做空偏置因子
  
  # AI配置
  ai:
    weight: 0.15                  # AI权重
    min_accuracy: 0.5             # 最低准确率
    disable_threshold: 0.45       # 禁用阈值
    signal_boost: 1.1             # 信号增强系数
  
  # 仓位配置
  position:
    initial_ratio: 0.3            # 初始仓位比例
    max_position_ratio: 0.12      # 最大仓位比例
    dynamic_sizing: true          # 动态仓位
    vol_adjustment: true          # 波动率调整
  
  # 趋势过滤
  trend_filter:
    enabled: true
    use_multi_timeframe: true
    ma_period_short: 5
    ma_period_long: 20
    ma_period_intraday: 10
    prevent_buy_in_downtrend: true
    prevent_short_in_uptrend: true
    min_adx_for_trend: 20
    require_both_timeframes: true
  
  # 做多信号参数
  long_signals:
    rsi_oversold: 35
    macd_histogram_threshold: 0.001
    supertrend_multiplier: 2.5
    min_confidence: 0.55
  
  # 做空信号参数
  short_signals:
    rsi_overbought: 60
    macd_histogram_threshold: 0.0005
    supertrend_multiplier: 2.0
    min_confidence: 1.0
    short_bias_factor: 0.0
    volume_confirm: 1.5
    trend_confirm: true
  
  # 融合权重
  fusion:
    technical_weight: 0.6         # 技术指标权重
    sentiment_weight: 0.25        # 情绪权重
    ai_weight: 0.15               # AI权重
  
  # 策略特定配置
  confluence_v2:
    enabled: true
  
  fusion_v2_enabled: true
  fusion_v3_enabled: true

# ============================================================================
# 交易配置
# ============================================================================
trading:
  mode: paper                     # paper (模拟盘) | real (实盘)
  max_daily_trades: 10            # 日最大交易次数
  max_single_position: 0.20       # 单标的最大仓位 20%
  max_total_position: 0.60        # 总仓位最大 60%
  max_daily_loss: 0.03            # 日亏损限制 3%
  default_position_size: 0.10     # 默认仓位大小
  max_open_positions: 2           # 最大持仓数
  min_signal_confidence: 0.5      # 最小信号置信度
  trading_mode: "simulate"        # 交易模式
  manual_confirm_for_live: true   # 实盘需手动确认
  short_selling_enabled: false    # 是否允许做空

# ============================================================================
# 风控配置
# ============================================================================
risk_limits:
  # 信号级
  min_confidence: 0.45            # 最小置信度
  
  # 订单级
  max_single_position: 0.18       # 单笔最大仓位
  max_single_loss: 0.05           # 单笔最大亏损 5%
  trailing_percent: 0.03          # 移动止损 3%
  max_holding_hours: 72           # 最大持仓 72 小时
  atr_multiplier: 2.0             # ATR乘数
  
  # 仓位级
  max_total_position: 0.75        # 总仓位限制
  max_daily_trades: 5             # 日交易次数
  max_daily_loss: 0.03            # 日亏损限制
  max_weekly_loss: 0.08           # 周亏损限制
  
  # 账户级
  max_drawdown: 0.12              # 最大回撤
  consecutive_loss_limit: 3       # 连续亏损限制
  
  # 策略级
  strategy_min_trades: 20         # 策略最小交易数
  strategy_min_winrate: 0.45      # 策略最小胜率

# 止损止盈
stop_loss_percent: 0.025          # 止损 2.5%
take_profit_percent: 0.06         # 止盈 6.0% (盈亏比 2.4:1)
breakeven_trigger: 0.015          # 保本触发 1.5%

# 动态止盈配置
take_profit:
  trailing_percent: 0.03          # 移动止盈 3%
  time_limit_hours: 72            # 时间止盈 72 小时
  rsi_overbought: 70              # RSI超买阈值
  macd_dead_cross: true           # MACD死叉止盈

# 信号冷却配置
signal_cooldown:
  default_seconds: 120            # 默认冷却 120 秒
  high_confidence_seconds: 90     # 高置信度冷却
  after_loss_seconds: 180         # 亏损后冷却

# 亏损暂停
loss_pause:
  enabled: true
  consecutive_losses: 3           # 连续亏损次数
  pause_minutes: 60               # 暂停时间（分钟）

# 熔断器
circuit_breaker:
  daily_loss_limit: -3000         # 日亏损限额
  pause_on_triggered: true        # 触发后暂停

# ============================================================================
# 通知配置
# ============================================================================
notification:
  dingtalk:
    enabled: true
    mode: enterprise              # enterprise | webhook
    timeout: 600                  # 确认超时 10 分钟
    webhook_url: "${DINGTALK_WEBHOOK_URL}"
    secret: "${DINGTALK_SECRET}"
    app_key: "${DINGTALK_APP_KEY}"
    app_secret: "${DINGTALK_APP_SECRET}"
    agent_id: "${DINGTALK_AGENT_ID}"

# 预警配置
alerts:
  dingtalk_webhook: "${DINGTALK_WEBHOOK_URL}"
  dingtalk_secret: "${DINGTALK_SECRET}"
  alert_contacts:
    - name: "管理员"
      phone: "${ADMIN_PHONE}"
      email: "${ADMIN_EMAIL}"

# 定时推送
schedule:
  daily_stats_time: "16:30"
  weekly_report_time: "09:00"
  monthly_report_time: "09:00"
  risk_monitor_interval: 120      # 风控监控间隔（秒）

# ============================================================================
# 功能开关
# ============================================================================
features:
  four_step_confirmation: true    # 四步确认
  auto_confirm: true              # 超时自动确认
  smart_push: true                # 智能推送决策
  state_persistence: true         # 状态持久化
  decision_logging: true          # 决策日志
  session_management: true        # 会话管理

# 四步确认配置
four_step:
  min_signal_score: 0.50          # Step 1 最小信号评分
  min_confidence: 0.60            # Step 2 最小置信度
  manual_confirm_min_confidence: 0.75  # 人工确认最小置信度
  auto_confirm_timeout: 600       # 自动确认超时（秒）

# 智能推送配置
smart_push:
  manual_confirm_min_confidence: 0.75
  manual_confirm_min_score: 0.70
  momentum_threshold: 0.70
  pattern_threshold: 0.65
  auto_execute_min_confidence: 0.60

# ============================================================================
# 状态持久化配置
# ============================================================================
persistence:
  state_file: data/state_snapshot.json
  decision_log_file: data/decision_log.json
  sessions_dir: data/sessions
  auto_snapshot_interval: 300     # 自动快照间隔（秒）
  max_decision_log_entries: 10000
  session_expiry_hours: 24

# ============================================================================
# 富途 OpenD 配置
# ============================================================================
futu:
  host: 127.0.0.1
  port: 11111
  trade_env: 1                    # 1=模拟盘，0=实盘
  simulate_account_id: "8246818"  # 融资融券模拟账户（支持卖空）
  login_account: "${FUTU_LOGIN_ACCOUNT}"
  trade_password_md5: "${FUTU_TRD_PWD_MD5}"
  force_simulate: true            # 强制模拟盘

# ============================================================================
# 市场配置
# ============================================================================
markets:
  hk:                             # 港股
    market_type: hk
    currency: HKD
    trading_hours:
      open: "09:30"
      close: "16:00"
      lunch_break_start: "12:00"
      lunch_break_end: "13:00"
    check_interval: 300           # 检查间隔（秒）
    night_interval: 900           # 夜间检查间隔
  
  us:                             # 美股
    market_type: us
    currency: USD
    trading_hours:
      open: "21:30"               # 北京时间
      close: "04:00"              # 次日北京时间
    check_interval: 300
    night_interval: 900

# ============================================================================
# 监控股票列表（引用 watchlist.json）
# ============================================================================
watchlist_file: config/watchlist.json

# ============================================================================
# 回测配置（引用 backtest_presets.json）
# ============================================================================
backtest_presets_file: config/backtest_presets.json

# ============================================================================
# 日志配置 (增强版)
# ============================================================================
logging:
  level: INFO
  format: "%(asctime)s [%(name)s] [%(trace_id)s] %(levelname)s: %(message)s"
  dir: logs
  max_size_mb: 50
  backup_count_size: 5       # 按大小轮转备份数
  backup_count_daily: 30     # 按天轮转备份数
  enable_json_format: false  # JSON 格式输出 (生产环境建议开启)
  enable_trace_id: true      # TraceID 全链路追踪
  console_output: true       # 控制台输出
  # 分离日志文件
  files:
    main: ftseek.log
    error: ftseek_error.log
    warning: ftseek_warning.log
    trade: trades.log
    risk: risk.log

# ============================================================================
# 监控配置 (新增)
# ============================================================================
monitoring:
  # 指标采集
  metrics:
    enabled: true
    collect_interval: 10          # 采集间隔 (秒)
    storage_dir: data/metrics
    retention_hours: 24           # 数据保留时间
    # 核心指标
    core_metrics:
      - system_cpu_percent
      - system_memory_percent
      - system_disk_percent
      - opend_connection_status
      - trade_success_rate
      - signal_count
  
  # 告警配置
  alerts:
    enabled: true
    rules_config: config/alert_rules.yaml
    storage_dir: data/alerts
    # 飞书推送
    feishu:
      enabled: true
      webhook_url: "${FEISHU_WEBHOOK_URL}"
      secret: "${FEISHU_SECRET}"
    # 默认冷却时间
    default_cooldown: 3600        # 1 小时
  
  # 健康检查
  health_check:
    enabled: true
    port: 8899
    endpoints:
      - /health
      - /health/live
      - /health/ready
      - /health/status
      - /health/metrics

# ============================================================================
# 配置迁移说明
# ============================================================================
migration:
  note: "已合并的配置文件（向后兼容至 2026-04-30）"
  merged_files:
    - app_config.yaml
    - risk_config.yaml
    - strategy_params.json
    - system_config.yaml
    - position_strategy.yaml
  deprecated_after: "2026-04-30"
  action: "移至 config/deprecated/ 目录"
