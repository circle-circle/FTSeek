  #   21:10 CST scan 生成假设; 开盘+10min 用真实盘中价裁决信息是否已被价格反映
  #   (双季 cron 双挂: EDT 21:40 / EST 22:40 CST = 09:40 ET, 见 crontab 注释)。
  #   Phase 1 = 影子 (data/shadow/ue_confirm_gate.jsonl), 不拦既有 21:10 inject 链。
  #   阈值校准 (7/14-8/25 浮现回放 n=159): 盘前同向动量 <2% 组前瞻均值 +0.54% (命中50%),
