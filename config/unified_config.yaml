risk:
  # Task #9 (2026-06-02): 风控 Pipeline 单步/总超时控制
  # 防御场景: VIX API/Earnings DB/LLM 调用阻塞导致整条 pipeline 卡住, 后续信号错过
  # fail-open: 非关键检查超时 → 默认通过 + WARNING; fail-close: 关键检查超时 → 拒绝交易
  # 读取者: app/risk/us_risk_pipeline.py::USRiskPipeline.__init__
  risk_pipeline:
    per_check_timeout: 5.0          # 单步超时 (秒) — 每个 RiskCheck 独立线程超时
    total_timeout: 30.0             # Pipeline 总超时 (秒) — 超过则 fail-close
    critical_checks_fail_close:     # 关键检查 (超时 fail-close, 拒绝交易)
      - DrawdownCheck               # 日内回撤 — 资金安全护栏
      - PositionLimitCheck          # 仓位限制 — 集中度护栏
      - BuyingPowerCheck            # 资金可用 — 防止超买
      - MarketCircuitCheck          # 大盘熔断
      - CircuitBreakerCheck         # 系统/策略/品种熔断
  # Phase 3 (2026-05-31): 退出路由统一 — ExitRuleDispatcher 影子模式开关
  # use_unified_dispatcher=true: 主路径走新 dispatcher (谨慎启用, 仅验证后切换)
  # log_comparison_mode=true: 与 legacy 并行评估, 仅记录差异 (默认 false 避免日志噪声)
  exit_routing:
    use_unified_dispatcher: false
    # 注意: 此为 ExitMonitor 内部的对比日志开关，与 exit_rules_controller (Dispatcher 主路径) 是独立的两套系统
    log_comparison_mode: true    # 原 shadow_mode 重命名，避免与 exit_rules_controller.shadow_mode 混淆
    log_diff_only: true   # log_comparison_mode 下仅在决策不一致时输出日志
  # Phase 1 (2026-05-31): 策略隔离开关 — 退出监控按 owner_strategy 严格校验
  # 关闭时走原 fallback 逻辑 (向后兼容); 开启时 owner_strategy 缺失/未知的仓位将被跳过
  strategy_enforcement:
    strict_owner_validation: true
  # 模拟盘数据采集: 放宽做空门禁
  pre_trade:
    short_min_strength: 60          # 高确信度门槛 (2026-06-13): 30→60
    long_min_strength: 60           # 高确信度门槛 (2026-06-13): 35→60
    battle_plan_bonus_enabled: true
    battle_plan_bonus: 0.5          # 计划标的再降50%
    min_effective_strength_floor: 5 # 默认30→5
  # 模式适配 (Task #6, 2026-05-31)：模拟/实盘共享同一份风控参数易掩盖实盘风险，
  # 此处按 TradingMode 给出三套阈值，由 app/core/trading_mode.py 在运行时挑选。
  mode_adaptation:
    simulate:
      max_position_pct: 15.0
      max_daily_loss_pct: 5.0
      max_total_exposure_pct: 80.0
      circuit_breaker_loss_pct: 8.0
    live_conservative:
      max_position_pct: 8.0       # 仓位减半
      max_daily_loss_pct: 2.0     # 日亏损更严
      max_total_exposure_pct: 40.0 # 总敞口减半
      circuit_breaker_loss_pct: 3.0 # 熔断更敏感
    live_normal:
      max_position_pct: 12.0
      max_daily_loss_pct: 3.0
      max_total_exposure_pct: 60.0
      circuit_breaker_loss_pct: 5.0
  # P0 全局黑名单 (2026-05-30): 跨策略统一拦截亏损标的，不仅限于Scalping
  # 实施在 app/pipeline/stages/risk_stage.py 的入场校验最早期
  global_blacklist:
    - US.QCOM     # 44笔 22.7%胜率 -$3.8K (保留)
    - US.LCID     # 16%胜率 (保留)
    - US.TME      # 0%胜率 (保留)
    - HK.00700    # [Phase A 2026-06-13] 跨市场符号，阻断数据/交易管道
    - US.HK.00700 # [Phase A 2026-06-13] Futu US格式，同上
    # 模拟盘数据采集: 移除此前添加的额外黑名单项, 允许更多标的交易

  # 实盘隔离 (2026-06-09): 自管持仓 — position_sync/position_recovery 跳过这些标的
  # 这些标的存在于真实账户但不纳入系统管理，由用户自行操作
  # 读取者: app/core/position_sync.py (每30s同步时跳过), app/core/position_recovery.py
  self_managed_symbols:
    - US.AMD      # 自管做空，系统不介入
    - US.BABA     # 自管做多，系统不介入
    - HK.00700    # 腾讯港股，自管做多，系统不介入
    - US.HK.00700 # Futu US市场返回的腾讯代码格式

    - US.NVDA     # 自管做多，系统不介入 (2026-06-10)
    - US.AAPL     # 自管做多，系统不介入 (2026-06-10)

  # RFC-056 (2026-06-01): HIGH_VOL 市况 VIX 阈值多档化
  # 数据驱动 (n=141, 90天): HIGH_VOL regime 14.9% 胜率 -$39,537, 占总亏损 271%
  # 旧逻辑: VIX>30 才熔断, VIX 22-29 区间放任入场 → 主要亏损源
  # 新逻辑: 4 档 — VIX<low: 不动; low-mid: 信号×0.85; mid-high: ×0.5; >=critical: 拒绝
  # 读取者: app/risk/market_regime_filter.py::MarketRegimeFilter._load_vix_levels
  market_regime_filter:
    vix_levels:
      low: 18                  # < 18: 信号 ×1.0 (正常)
      mid: 22                  # 18-22: 信号 ×0.85 (轻度防御)
      high: 25                 # 22-25: 信号 ×0.5 (强力削弱)
      critical: 28             # >= 28: 完全拒绝 (从 30 降至 28)
    short_exempt_critical: false # SHORT 在 critical 时也拒绝 (默认 false 保守)
                                  # 数据看 SHORT 33.9% 胜率好, 后续可改 true 仅放过 SHORT
    long_in_high_zone_strength_mult: 0.5  # mid-high 区间 LONG 削减更狠 (LONG 20.9% wr)
    short_in_high_zone_strength_mult: 0.85 # SHORT 在 22-25 区间轻削
  # RFC-058 (2026-06-01): LONG 方向默认削弱 30%, 仅 BULL regime 豁免
  # 数据驱动 (n=134, 90天): LONG 20.9% wr +$2,644 vs SHORT 174 笔 33.9% +$13,016 (5×差距)
  # 默认: LONG strength × 0.7 折扣
  # BULL 豁免条件 (全部满足): SPY > MA50 + SPY > MA200 + VIX < 20 + 连涨 ≥ 2 日
  # 读取者: app/risk/market_regime_filter.py::MarketRegimeFilter._apply_long_discount
  long_direction_filter:
    enabled: true
    default_discount: 0.7        # LONG strength × 0.7 (削 30%)
    bull_regime_exempt:          # 满足全部条件不打折
      spy_above_ma50: true
      spy_above_ma200: true
      vix_max: 20
      consecutive_up_days_min: 2
    log_every_discount: true     # 每次打折记日志便于审计
  # F10 (2026-05-12): 风险单位 R 配置 — 仓位 = 风险预算 / 止损距离
  # P0-X (2026-05-15, 基于 14 日 LCID 8 笔 -$634 教训): 标的级日亏损护栏
  symbol_daily_loss_guard:
    # 实测调参 (2026-05-15): 历史 7 天 win_rate 5%, 多标的 2 笔全亏即触发场景
    enabled: true                       # 关键防御, 永远开
    max_daily_loss_pct: 0.005           # 0.5% 净值 (从 1% 收紧)
    max_consecutive_losses: 5           # 模拟盘: 2→5, 允许更多连续亏损以收集数据
    min_trades_for_winrate_check: 3     # 3+ 笔启动胜率检查 (从 5 收紧)
    max_loss_rate: 0.66                 # 3 中 2 亏即触发 (从 70% 收紧)
    exempt_symbols: []                  # 手动豁免名单 (慎用)

  # 模拟盘数据采集: VIX放宽到30, 收集更多市场状态数据
  vix_block_threshold: 30
  per_trade_risk_pct: 0.010    # P0 (2026-06-03): 0.5%→1.0%, 固定风险仓位
  max_trade_risk_pct: 0.010    # 极限 1.0% (不再按信号强度加码)
  # F17 (2026-05-12): 组合层面止损
  portfolio:
    warn_drawdown_pct: 0.02     # -2% 警告
    reduce_drawdown_pct: 0.025  # -2.5% 减半
    stop_drawdown_pct: 0.03     # -3% 全平
  capital_safety:
    water_levels:
      green:
        threshold: -0.05
        risk_mult: 1.0
        pos_mult: 1.0
      yellow:
        threshold: -0.1
        risk_mult: 0.5
        pos_mult: 0.5
      orange:
        threshold: -0.2
        risk_mult: 0.25
        pos_mult: 0.25
      red:
        threshold: -0.35
        risk_mult: 0.0
        pos_mult: 0.0
    tiers: &id001
      micro:
        min_equity: 0
        max_equity: 10000
        risk_pct: 0.05
        total_pct: 0.3
