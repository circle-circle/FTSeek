# ============================================================
# Phase 6: 引擎委托配置 (灰度迁移)
# ============================================================
engine:
  # 止损/止盈执行委托给 ExitStateEngine
  # false: 使用原始实现 (默认，安全)
  # true: 使用引擎版本 (需验证)
  exit_delegation: false

  # 闪崩检测委托
  # true: 使用引擎版本 (已验证，推荐)
  # false: 使用原始实现
  flash_exit_delegation: true

# ============================================================
# Phase 7: RiskCheck 配置 (可配置热插拔)
# ============================================================
