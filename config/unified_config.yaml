    force_close_on_red: true
    loss_alert_threshold: -0.08
    pre_close_alert_time: '15:50'
dynamic_exit:
  default:
    atr_stop:
      enabled: false
      multiplier: 2.5
    breakeven_stop:
      enabled: false
      stop_profit: 0.01
      trigger_profit: 0.03
    intraday_stop:
      enabled: false
      stop_percent: 0.02
    partial_take_profit:
      enabled: false
      levels:
      - ratio: 0.5
        trigger: 0.025
      - ratio: 0.5
        trigger: 0.05
    stop_loss: -0.02
    take_profit: 0.05
    time_stop:
      enabled: false
      max_holding_days: 10
    trailing_stop:
      enabled: false
      trail_percent: 0.005
      trigger_profit: 0.01
