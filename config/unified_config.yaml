  #   病灶: 该循环原先只在每轮顶部 ping 一次, 而盘前/盘后单轮迭代实测 ~58min (数据采集链:
  #   定桶逐标的 ATR / 宏观日历影子 / 富途通道影子全量拉取) ≫ 阈值 → 连报 stale → heal 整服
  #   重启 (2026-08-22 04:30:44 CST 盘后轮 · 2026-09-03 21:31:38 CST=开盘后 90s, 36s 盲窗)。
  #   近半月 llm_strategy_loop stale 告警 24 条 (盘前窗 12 / 盘后窗 12) = 复发病灶非偶发。
  # 阈值 (原硬编码 600 → 配置化, **默认值不变**): heal 触发点 = 阈值 × 3 (watchdog
  #   _heal_multiplier), 放宽阈值会把真卡死的整服重启延迟同步放大 3×, 故不建议单独调大;
  #   误报由下面的"轮内护航"消除。改后需重启生效 (注册发生在启动期)。
  watchdog_llm_loop_stale_sec: 600
