  # ── P2.2 输入具名标的可交易性初筛 (2026-09-12, DEB-20260910 §17 / proud-slope-falcon) ──
  #   对 clue brief 材料里**已具名**的 ticker 批量取轻量快照, 先跑 P1 同口径资格判定,
  #   在 brief 末尾追加一段"可交易 / 仅背景(context_only) / 未定"三态清单。
  #   定位: 让低价·低波·权证优先股不再作为**直接交易候选**占用模型注意力 (P2 验收项①),
  #     但材料本身**一条不删** —— 不可交易公司的事件仍可用于产业链推导 (P2 验收项②)。
