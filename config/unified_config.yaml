ai:
  api_key: ${BAILIAN_API_KEY}
  cache:
    enabled: true
    max_size: 1000
    ttl: 3600
  daily_budget: 50
  endpoint: ${BAILIAN_ENDPOINT}
  model: ${BAILIAN_MODEL}
  monthly_budget: 1500
  provider: bailian
  rate_limit:
    requests_per_minute: 10
  timeout: 30
  _deprecated: Use llm section instead
alerts:
  dingtalk:
    enabled: true
    secret: ${DINGTALK_SECRET}
    webhook: ${DINGTALK_WEBHOOK_URL}
  feishu:
    enabled: true
    secret: ${FEISHU_SECRET}
    webhook: ${FEISHU_WEBHOOK_URL}
  rules:
  - action: halt_trading
    condition: daily_loss_pct > 0.03
    id: daily_loss
    level: P0
    notify: true
  - action: close_all
    condition: drawdown_pct > 0.12
    id: max_drawdown
    level: P0
    notify: true
  - action: pause_trading
    condition: reject_count > 8
    id: circuit_breaker
    level: P1
    notify: true
backtest:
  default:
    commission_rate: 0.0003
    end_date: '2025-12-31'
    initial_capital: 1000000
    slippage: 0.001
    start_date: '2025-01-01'
  presets_file: config/backtest_presets.json
base:
  currency: HKD
  debug_mode: false
  environment: production
  log_level: INFO
  market: HK
  project_name: FTSeek
  timezone: Asia/Hong_Kong
  trade_env: paper
  # 模拟盘优化配置 (2026-05-17): 最大化数据收集，门禁 shadow 模式
  simulation_mode:
    enabled: true
    gate_mode: shadow  # shadow=告警放行, block=硬拦截
    time_gate_shadow: true  # 14:30-15:30 告警不拦截
    exit_gray_ratio: 0.5  # 50% 仓位用新退出系统
    min_trade_value: 8000  # 最小交易金额 (低于此费用侵蚀严重)
  version: 3.0.0
circuit_breaker:
  pause_on_triggered: true
  daily_loss_pct: 0.03
  daily_loss_limit: -3000
entry_price_checker:
  enabled: true
  high_buy_block: 0.003
  high_buy_warn: 0.02
  high_buy_soft: 0.03
  low_sell_block: 0.005
  low_sell_warn: 0.02
  chase_threshold: 0.03
  panic_threshold: 0.03
data_sources:
  futu:
    host: ${OPEND_HOST:127.0.0.1}
    port: 11111
    subscribe_types:
    - QUOTE
    - K_1M
    - K_3M
    - K_5M
    - K_15M
    - K_30M
    - K_60M
    - K_DAY
  rsshub:
    enabled: true
    fetch_interval_sec: 180
    instances:
    - https://rsshub.rssforever.com
    - https://rsshub.ktachibana.party
    - https://rsshub.moeyy.cn
database:
  backup:
    backup_dir: data/backups
    enabled: true
    interval_hours: 24
    retention_days: 30
  path: data/ftseek.db
  pool:
    enabled: true            # 2026-05-19: 启用连接池，提升高并发性能
    max_connections: 10
    timeout: 30
  type: sqlite
description: FTSeek 港股交易系统 - 统一配置 SSOT (Single Source of Truth)
dynamic_exit:
  default:
    atr_stop:
      multiplier: 2.0
      preferred_kline: K_30M
    stop_loss: -0.045          # 2026-05-19: 与 dynamic_exit_params 对齐 (原-0.035)
    take_profit: 0.06            # 2026-05-19: 修复 R:R 门控误杀 (0.05/0.045=1.11<1.25, 改为 0.06/0.045=1.33>1.25)
    time_stop:
      max_holding_hours: 36
    trailing_stop:
      enabled: true
      trail_percent: 0.018
      trigger_profit: 0.025
  regimes:
    high_volatility:
      stop_loss_atr_mult: 2.5
      take_profit_atr_mult: 3.0
    low_volatility:
      stop_loss_atr_mult: 1.5
      take_profit_atr_mult: 2.0
    medium_volatility:
      stop_loss_atr_mult: 2.0
      take_profit_atr_mult: 2.5
  strong_trend_down:
    atr_stop:
      multiplier: 1.4
      preferred_kline: K_15M
    stop_loss: -0.04             # 2026-05-19: 与 dynamic_exit_params 对齐 (原-0.03)
    take_profit: 0.045
    time_stop:
      max_holding_hours: 24
    trailing_stop:
      enabled: true
      trail_percent: 0.015
      trigger_profit: 0.02
  strong_trend_up:
    atr_stop:
      multiplier: 2.8
      preferred_kline: K_60M
    stop_loss: -0.06
    take_profit: 0.08
    time_stop:
      max_holding_hours: 120
    trailing_stop:
      enabled: true
      trail_percent: 0.04
      trigger_profit: 0.06
  _deprecated: Moved to dynamic_exit_params section. Values merged during SSOT cleanup
    2026-05-04.
exit:
  hk:
    atr_multiplier: 3.0
    crash_guard_pct: 0.08
    stop_pct: 0.03
  _deprecated: Moved to dynamic_exit_params section
  us:
    atr_multiplier: 1.5
    stop_pct: 0.015
    time_stop_minutes: 30
features:
  auto_confirm: true
  config_hot_reload: true
  decision_logging: true
  four_step_confirmation: true
  session_management: true
  smart_push: true
  state_persistence: true
four_step:
  auto_confirm_timeout: 600
  manual_confirm_min_confidence: 0.75
  min_confidence: 0.6
  min_signal_score: 0.5
futu:
  allow_real_trading: false
  force_simulate: true
  host: 127.0.0.1
  login_account: ${FUTU_LOGIN_ACCOUNT}
  login_password: ${FUTU_LOGIN_PWD}
  margin_account_id: '8246818'
  opend_dir: /opt/ftseek/Futu_OpenD_10.3.6308_Centos7/Futu_OpenD_10.3.6308_Centos7
  port: 11111
  simulate_account_id: '18820895'
  trade_env: 1
  us_account_id: 0
holding_period:
  enabled: true
  max_holding_hours:
    class_a: null
    class_b: 168
    class_c: 48
    junk: 24
  review_intervals:
    class_a: 24
    class_b: 12
    class_c: 6
    junk: 4
llm:
  api_key: ${BAILIAN_API_KEY}
  endpoint: ${BAILIAN_ENDPOINT}
  max_tokens: 2000
  model: ${BAILIAN_MODEL}
  provider: bailian
  temperature: 0.1
  timeout_sec: 120
  
  # 2026-05-21 新增：Token 预算配置
  budget:
    daily_max_cny: 10.0         # 每日最大 LLM 成本 (人民币)
    warning_threshold: 0.8      # 80% 时告警
    enabled: true
  
  # 2026-05-21 新增：模型路由配置
  features:
    # 延迟敏感 (FLASH, 单模型, 失败仅日志)
    news_classifier:    qwen3.6-flash
    sentiment_analyst:  qwen3.6-flash
    
    # 质量敏感 (PLUS, 双模型, 关键决策)
    premarket_planner:  qwen3.6-plus
    attribution_engine: qwen3.6-plus
    consensus_veto:     qwen3.6-plus
    
    # 回退链
    fallback_chain:
      qwen3.6-plus:  [qwen-max, qwen-turbo]
      qwen3.6-flash: [qwen-turbo]
  
  # 2026-05-21 新增：缓存配置
  cache:
    enabled: true
    cache_dir: /tmp/ftseek_llm_cache
    cache_ttl_seconds: 300       # 5 分钟缓存
    cache_on_fail: false
logging:
  backup_count_daily: 30
  backup_count_size: 5
  console_output: true
  dir: logs
  enable_json_format: false
  enable_trace_id: true
  files:
    error: ftseek_error.log
    main: ftseek.log
    risk: risk.log
    trade: trades.log
    warning: ftseek_warning.log
  format: '%(asctime)s [%(name)s] [%(trace_id)s] %(levelname)s: %(message)s'
  level: INFO
  max_size_mb: 50
  propagate: true
loss_pause:
  consecutive_losses: 3
  enabled: true
  pause_minutes: 60
market_regime:
  adx_strong: 30.0    # 强趋势 ADX 阈值
  adx_weak: 20.0      # 弱趋势 ADX 阈值
  atr_high: 80.0      # 高波动 ATR 百分位阈值
  atr_low: 20.0       # 低波动 ATR 百分位阈值
  ma_period: 50       # 趋势判断均线周期
  atr_lookback: 100   # ATR 百分位计算周期
  regime_check_interval_sec: 300
markets:
