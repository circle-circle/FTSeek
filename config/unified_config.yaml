  # P0 新增 (2026-05-20): 亏损标的黑名单
  # 归因: LCID -$913 (14笔), TME -$913 (7笔), UBER -$233 (3笔) — 持续亏损
  # P0 扩展 (2026-05-30): 增加 QCOM (44笔 22.7%胜率) 与 NIO (低胜率)
