# SSOT for SignalQualityScorer._load_weights()
signal_quality:
  weights:
    trend_quality: 0.25        # 趋势质量 (MA排列+斜率+SPY共振)
    momentum: 0.20             # 动量 (RSI+MACD+slope)
    volume: 0.25               # 成交量 (volume_ratio+VWAP+量价一致)
    order_flow: 0.15           # 资金流 (order_flow+ticker+大单)
    market_env: 0.15           # 市场环境 (VIX+SPY/MA200+regime)
  confluence_bonus:
    "5": 0.15
    "4": 0.10
    "3": 0.05
    "2": 0.0
    "1": -0.05
    "0": -0.10
  contradiction_penalty: -0.10

strategy:
  # 模拟盘数据采集: 放宽冷却以收集更多信号
  signal_cooldown: 60
  # Task #2 (2026-05-31): consensus_threshold 改为 VIX 自适应 (在 app/decision/consensus.py 中实现)
  # 此处保留 fallback 默认值；运行时按 VIX 动态选择 0.55/0.60/0.70/0.75
  consensus_threshold: 0.4           # 模拟盘: 0.6→0.4, 放宽共识要求
  # VIX 自适应共识阈值 (模拟盘数据采集: 全部放宽)
  consensus_threshold_by_vix:
    extreme: 0.35      # VIX > 40
    high:    0.40      # VIX > 30
    elevated: 0.45     # VIX > 20
    normal:  0.50      # VIX <= 20
strategies:
  # ─── Phase A (2026-05-14): 多策略协调 ───
  # 灰度: enabled=true → coordinator 生效 (但 observe_only=true 不阻断现有流程)
  #       enforce 模式 (enabled=true && observe_only=false) 留给 Phase B 切换
  coordinator:
    enabled: true              # Phase A 灰度: 开启观察模式 收集数据
    observe_only: true         # 不阻断, 仅记录 BLOCKED_* 事件用于评估
    max_total_pct: 0.80    # Task fix: 0.90→0.80 与 risk_limits.max_total_position 对齐
    audit_arbitration: true    # 写 signal_arbitration 表
    reconcile_interval_sec: 300  # 每 5 分钟与 PositionRegistry 对账
    # R4 (2026-05-15): unified_dispatcher 灰度位 (代码尚未启用 — 仅声明)
    # 当 ExitDispatcher 4 policy 各自稳定 7+ 天后, 切 true 启用统一 ExitDecision 优先级仲裁
    # 启用前置条件: PositionExitMonitor 与 ExitDispatcher 决策一致率 > 95%
    unified_dispatcher_enabled: false
  # === ADR-002 (2026-05-31): 暂停 scalping, 聚焦主线 ===
  # 决策依据: scalping 150笔 18% WR 持续负收益, 主线 SHORT+trailing 42.9% WR +$13K 已验证
  # 资金重新分配: main 0.65→0.80, scalping 0.15→0.0
  # 代码保留, 后续可通过 enabled:true 恢复
  main:
    capital_pct: 0.80          # ADR-002: 0.65→0.80 (收回 scalping 15% 资金)
    priority: 5
  scalping:
    capital_pct: 0.0           # ADR-002: 0.15→0.0 (暂停, 资金归还主线)
    priority: 10               # 高于 main, 时效性更强
    direction_preference: SHORT  # P6: 数据驱动 - SHORT 胜率 37.0% vs LONG 20.9%
    enabled: false             # ADR-002 (2026-05-31): 暂停 scalping, 聚焦已验证的主线 SHORT+trailing edge
  # P10 优化 (2026-05-22): 连续亏损后动态降仓
  # 数据：1 连败后胜率 20%，4 连败后胜率 40%（反转）
  # 策略：连续 3 次亏损后降仓 50%，避免情绪化交易
  # 注意：已有 symbol_daily_loss_guard 机制 (max_consecutive_losses=2)，无需重复配置
  dynamic_position_sizing:
    enabled: true
    consecutive_loss_threshold: 3    # 连续 3 次亏损后触发降仓
    position_reduction: 0.5          # 降仓 50%
    reset_after_win: true            # 盈利后重置
    max_drawdown_pause: 0.05         # 单日最大回撤 5% 暂停新仓
  fast_lane:
    # Task #1 (2026-05-31): 子策略从 main 池切分，不独立累加
    capital_source: main          # 资金来源: main 池
    capital_pct_of_main: 0.25     # 占 main 池 25% (= 0.65 × 0.25 = 0.1625 全账户)
    capital_pct: 0.20             # 兼容字段：CapitalAllocator bucket_map 已映射到 main，不双计
  llm_plan:
    capital_pct: 0.0           # LLM plan 不直接持仓
    priority: 3

  # === RFC-054: Trend-First 趋势优先策略 ===
  # 通过"趋势方向+板块龙头"组合，修正均值回归在动量市场的失效
  trend_first:
    enabled: true
    observe_only: false             # Task #19: 开放模拟交易执行 (从 true → false)
    min_volume_ratio: 2.0           # Fix 12 (2026-05-31): 显式声明, 与 breakout_min_volume_ratio 对齐

    # 资金分配（从 Main 预算池切分，与 Technical 共享 0.65 总额）
    # Task #1 (2026-05-31): 显式 capital_pct_of_main, 不再独立累加 capital_pct
    capital_source: main            # 明确标注资金来源
    capital_pct_of_main: 0.35       # 占 main 池 35% (= 0.65 × 0.35 = 0.2275 全账户)

    # Layer 2: 选股参数
    min_sector_score: 40            # 板块热度门槛
    leader_bonus: 15                # 龙头加分
    overheat_threshold: 80          # 过热板块阈值
    overheat_penalty: 0.8           # 过热惩罚系数
    sector_max_age_hours: 2         # 板块数据最大有效期(小时)

    # Layer 3: 入场参数
    pullback_rsi_long: [35, 55]     # LONG回调入场RSI区间
    pullback_rsi_short: [45, 65]    # SHORT回调入场RSI区间
    require_ma_alignment: false     # 是否要求均线排列（false=仅跟踪，不强制过滤）
    breakout_min_volume_ratio: 2.0  # BREAKOUT最低放量倍数

    # Layer 4: ATR风控映射
    stop_loss_atr_mult: 1.5         # PULLBACK止损倍数
    breakout_stop_loss_atr_mult: 1.0  # BREAKOUT止损倍数（更紧）
    trail_activation_atr: 1.0       # 追踪激活阈值
    trail_atr_mult: 1.5             # 追踪止损倍数

    # 信号质量门槛
    min_score: 55                   # 最低评分（低于此不产出信号）

    # 执行约束（observe_only=false 时生效） —— Task #19
    max_daily_trades: 10             # 模拟盘: 5→10
    max_positions: 5                # 模拟盘: 3→5
    max_position_pct: 0.10          # 单仓最大占比 (0.15 → 0.10 保守调低)

    # 执行保护 —— Task #19
    opening_delay_minutes: 15       # 开盘后15分钟内不入场（数据需预热）
    no_entry_after_et: "15:30"      # 15:30后不再新开仓（保证至少30分钟持仓）

  # === ORB: Opening Range Breakout (开盘区间突破) ===
  # 数据驱动: 10:00-11:00 是盈利主力时段 (+$21K), trailing stop 是唯一赚钱退出方式
  # ORB 天然匹配: 09:45后入场 + trailing stop 退出, 只有2个核心参数
  #
  # 2026-06-01 双系统架构:
  #   System A (本配置) = 主线Pipeline ORB: 10分钟扫描, regime/MACD/RSI多重确认
  #     → owner_strategy="orb_pipeline", 退出由DEM管理
  #   System B (orb:顶级配置) = RFC-056独立引擎: 5秒轮询, 纯突破+量能确认
  #     → owner_strategy="orb_engine", 退出由ORBExitStack自管
  #   互斥: 同一ETF不会被两个系统同时开仓 (PositionStore.has检查)
  #   持仓上限: max_positions 为两系统合计上限
  orb:
    enabled: true
    observe_only: false             # 直接参与模拟交易

    # 开盘区间参数
    min_range_width_pct: 0.3        # 区间最小宽度% (太窄=假突破风险)
    max_range_width_pct: 2.5        # 区间最大宽度% (太宽=波动过大)
    breakout_buffer_pct: 0.1        # 突破缓冲区% (防边界抖动)
    max_chase_pct: 1.5              # 最大追高% (已远离区间不追)

    # 风控参数
    stop_loss_atr_mult: 1.5         # ATR止损倍数 (兜底, 与区间中点取较远者)
    min_risk_reward: 1.5            # 最小盈亏比

    # 量能确认 (可选, 0=不检查)
    min_volume_ratio: 1.3

    # 时间窗口
    entry_end_et: "11:00"           # ORB入场截止时间
    no_entry_after_et: "15:30"      # 收盘前截止

    # 执行约束 (双系统合计上限)
    max_daily_trades: 15            # 模拟盘: 5→15
    max_positions: 5                # 模拟盘: 3→5

  defaults:
    # 2026-06-07: 0.30→0.55, 数据证明 0.65-0.80 置信度区间胜率仅 13% (-$2,317)
    # 0.55 与 risk.signal_quality.min_confidence 对齐, 过滤弱信号
    min_confidence: 0.70
    min_strength: 60
    max_positions: 12                # 模拟盘: 5→12, 最大化数据采集
    direction_bias:
      LONG:
        min_confidence: 0.60  # 2026-06-10: 0.45→0.60, LONG 26.6% WR 净亏$2.9K, 收紧入场门槛
      SHORT:
        min_confidence: 0.35  # ADR-005: 0.45→0.35, SHORT正EV方向, 放宽让更多信号进入
    # DEPRECATED (2026-05-31): strategies.defaults.signal_cooldown_seconds 不再生效
    #   实际生效路径: strategy.signal_cooldown (本文件 SoT, 见上方 strategy 段)
    #   启动时 ConfigValidator.check_deprecated_fields 会再次告警, 修改此键不会生效。
    #   保留以兼容旧导出脚本, 一段稳定窗口后整体移除。
    signal_cooldown_seconds: 120
    signal_expire_seconds: 300
    degraded_confidence_offset: -0.1
    degraded_strength_offset: -10
  dynamic_pool:
    tiers:
      micro:
        max_symbols: 3
        min_confidence: 0.15
        min_score: 10
        max_price: 100
        min_price: 5
        max_volatility: 0.15
        min_avg_volume: 500000
        max_position_pct: 0.35
        max_concurrent: 2
        allow_short: false
        require_catalyst: false
      small:
        max_symbols: 5
        min_confidence: 0.15
        min_score: 10
        max_price: 200
        min_price: 5
        max_volatility: 0.12
        min_avg_volume: 1000000
        max_position_pct: 0.3
        max_concurrent: 3
        allow_short: false
        require_catalyst: false
      medium:
        max_symbols: 8
        min_confidence: 0.15
        min_score: 10
        max_price: 500
        min_price: 5
        max_volatility: 0.1
        min_avg_volume: 2000000
        max_position_pct: 0.25
        max_concurrent: 5
        allow_short: true
        require_catalyst: false
      large:
        max_symbols: 12
        min_confidence: 0.15
        min_score: 10
        max_price: 1000
        min_price: 5
        max_volatility: 0.08
        min_avg_volume: 5000000
        max_position_pct: 0.2
        max_concurrent: 8
        allow_short: true
        require_catalyst: false
      inst:
        max_symbols: 20
        min_confidence: 0.15          # 模拟盘: 0.5→0.15
        min_score: 10                 # 模拟盘: 50→10
        max_price: 2000
        min_price: 5
        max_volatility: 0.06
        min_avg_volume: 10000000
        max_position_pct: 0.15
        max_concurrent: 12
        allow_short: true
        require_catalyst: false
    risk_adjustments:
      moderate:
        max_symbols_mult: 0.6
        min_confidence_add: 0.1
        min_score_add: 5
        max_price_mult: 0.75
        max_volatility_mult: 0.8
        min_avg_volume_mult: 2.0
        max_position_mult: 0.65
        max_concurrent_mult: 0.6
        require_catalyst: true
      warning:
        max_symbols_mult: 0.3
        min_confidence_add: 0.25
        min_score_add: 15
        max_price_mult: 0.5
        max_volatility_mult: 0.5
        min_avg_volume_mult: 3.0
        max_position_mult: 0.35
        max_concurrent_mult: 0.25
        allow_short: false
        require_catalyst: true
      danger:
        max_symbols: 0
      blackout:
        max_symbols: 0
  technical:
    enabled: false  # 冻结 (2026-06-11): IC 为负，与 trend_first 重叠，消除噪声
    min_signals: 2
    indicators:
    - rsi
    - macd
    - bollinger
    - supertrend
    weights:
      rsi: 0.3
      macd: 0.25
      bollinger: 0.25
      supertrend: 0.2
    min_score: 10
  llm_vote:
    enabled: false  # 冻结 (2026-06-11): 信号噪声大，LLM 方向默认 LONG 偏见
    min_consensus: 0.3
    min_confidence: 0.5
