      force_close_at: 955
      no_new_entry_after: 950
    transition_smoothing_minutes: 2
  trend_filter:
    spy_threshold: 0.03
    vix_threshold: 35
  circuit_breaker:
    max_consecutive_losses: 2
    cooldown_minutes: 60
  polling_interval_seconds: 5
  # P0 Karpathy fix (2026-05-13): 每日强制交易标的 + 策略精准度验证
  forced_tickers:
  - code: US.SNDK
    min_trades_per_day: 3
    max_daily_loss_usd: 100
    validation: true
  pool:
    min_volume: 5000000
    min_price: 10
    max_price: 500
    min_atr_pct: 0.008
    max_atr_pct: 0.04
  capital_source: capital.fixed_amount
capital:
  mode: simulation
  fixed_amount: 1000000
  description: 'Capital mode for adaptive risk. "simulation": uses fixed_amount. "live":
    reads from broker.'
  tiers: *id001
diagnostics:
  enabled: true
  description: 非交易路径诊断 Overlay — 零侵入现有交易管线
  schedule:
    post_market:
      enabled: true
      time: '20:30'
      modules:
      - shadow_account
      - statistical_validator
    on_demand:
      enabled: true
      modules:
      - geopolitical_reasoner
  shadow_account:
    lookback_days: 30
  statistical_validator:
    n_simulations: 1000
    risk_free_rate: 0.05
  geopolitical_reasoner:
    mode: rules
    min_confidence: 0.65
pipeline:
  # ============================================================
  # 策略路由器 (StrategyRouter) — 新旧链路切换 (2026-05-23 辩论收敛)
  # ============================================================
  # master_switch 控制全局链路选择:
  #   legacy      → 完全使用旧系统 (signal_pipeline + risk_engine + exit_monitor)
  #   factor      → 完全使用新框架 (FactorAssembly + DynamicRisk + DynamicExit)
  #   hybrid      → 混合模式 (per-module override, 默认: signal=factor, exit=legacy)
  #   shadow_only → 仅 shadow 对比, 不真实下单 (推荐初始阶段)
  #
  # 切换方式: 修改 master_switch 后重启服务, 无需改代码
  # 安全降级: 新框架异常时自动 fallback 到 legacy
  # ============================================================
  master_switch: shadow_only    # 当前: shadow_only (安全验证阶段)
  overrides:
    signal: null                # null = follow master, or: legacy/factor
    risk: null
    exit: null
    sizing: null

  # 旧管线 stage 配置 (保留)
  use_modular_stages: true     # CRA 模块化管线 (SSOT, 代码中 use_new_stages 向后兼容)
  use_new_stages: true         # DEPRECATED alias — 请使用 use_modular_stages
  stages:
  - name: market_data
    enabled: true
    timeout_sec: 30.0
    abort_on_error: false
  - name: signal
    enabled: true
    timeout_sec: 30.0
    abort_on_error: false
  - name: risk
    enabled: true
    timeout_sec: 30.0
    abort_on_error: false

  # 市场上下文门禁 (从旧系统移植, 新旧链路共用)
  market_context:
    enabled: true
    vix_threshold: 25            # 参考值: pre_trade_check 使用 VIX≥25 硬编码门禁 (此处仅供文档参考)
    cache_ttl_minutes: 30       # 市场数据缓存时间
    capital_safety:
      enabled: true
      warning_drawdown: -0.05   # -5% 回撤 → 仓位减半
      alert_drawdown: -0.10     # -10% → 仅25%仓位
      danger_drawdown: -0.20    # -20% → 不开新仓
      circuit_breaker: -0.35    # -35% → 全部平仓

# ─── RFC-056 (2026-06-01): 独立 ORB 辅线 ────────────────────────
# Opening Range Breakout: 5秒轮询, ETF专属标的池, 独立退出栈
# 与主线零重叠: 标的是 SPY/QQQ/IWM/XLE/XLF 等 ETF
# 上线策略: observe → shadow → active (渐进)
# 详见: docs/decisions/RFC-056-orb-auxiliary-pipeline.md
#
# 双系统协作:
#   System B (本配置) = RFC-056独立引擎, 5秒轮询快速捕捉突破
#   System A (strategies.orb) = 主线Pipeline, 10分钟扫描多重确认
#   互斥: PositionStore.has() 确保同一ETF不被双开
#   持仓: max_positions 读取 strategies.orb.max_positions (双系统合计上限)
#   退出: 本系统自管 (ORBExitStack 4层退出), DEM跳过 orb_engine 仓位
# ────────────────────────────────────────────────────────────────
orb:
  enabled: true
  mode: observe                    # [P2 2026-06-13] 100+ attempts all rejected by pre_trade_gate, switch to observe
  universe:
    # ADR-006 (2026-06-07): ETF 归 ORB，个股归主线，零重叠
    # 宽基 (4): 最高流动性，开盘区间最清晰
    - US.SPY                       # S&P 500 (从主线移入)
    - US.QQQ                       # Nasdaq 100 (从主线移入)
    - US.IWM                       # Russell 2000 (高波动, ORB友好)
    - US.DIA                       # Dow Jones 30
    # 板块 (6): 板块轮动驱动，成交量充足
    - US.XLE                       # 能源板块
    - US.XLF                       # 金融板块
    - US.XLK                       # 科技板块
    - US.XLV                       # 医疗板块
    - US.XLY                       # 可选消费
    - US.XLI                       # 工业板块
    # 不加入: XLB/XLU/XLP/XLRE — 成交量低，ORB信号稀疏
  # 入场参数
  range_minutes: 15                # 开盘区间长度 (分钟)
  max_range_width_pct: 2.5         # 最大区间宽度% (太宽=过度波动)
  breakout_buffer_pct: 0.1         # 突破缓冲%
  entry_start_et: "09:45"          # 入场窗口开始
  # 止损止盈 (ATR-relative, 日内 — 比System A更紧, 适配5秒快速响应)
  stop_loss_atr_mult: 1.5          # SL = entry ± 1.5×ATR (2026-06-07: 1.0→1.5, 避免开盘噪声扫损)
  take_profit_atr_mult: 3.0        # TP = entry ± 3.0×ATR (2026-06-07: 2.0→3.0, R/R 2:1)
  trail_activation_atr: 2.5        # 2026-06-07: 1.0→2.5, 盈利2.5 ATR后才追踪 (让赢家跑到2+ATR再锁利)
  trail_multiplier: 1.5            # 2026-06-07: 1.2→1.5, peak - 1.5×ATR (更宽松追踪, 减少噪音扫出)
  # 风控 (持仓上限由 strategies.orb.max_positions 统一控制, 此处仅作fallback)
  max_positions: 5                 # 模拟盘: 3→5
  max_daily_trades: 15             # 模拟盘: 4→15, 最大化数据采集
  capital_pct: 0.20                # 模拟盘: 0.10→0.20, 更多资金分配
  position_risk_pct: 0.010         # P0 (2026-06-03): 统一 1% 固定风险
  # 退出
  eod_exit_time: "15:55"           # 盘末强制退出 (不隔夜)
  polling_interval_seconds: 5      # 轮询间隔 (秒)
  # 放宽入场条件 (模拟盘数据采集)
  min_range_width_pct: 0.2         # 模拟盘: 0.3→0.2, 允许更窄区间
  min_volume_ratio: 1.2            # 2026-06-08: 0.8→1.2, 无量突破=假突破 (研究验证)
  entry_end_et: "14:00"            # 模拟盘: 11:00→14:00, 延长入场窗口
  # Regime-aware direction bias (2026-06-03): 基于真实数据
  # ⚠ SHORT在下跌市胜过LONG 10:1 → 上涨市禁SHORT, 下跌市禁LONG
  regime_short_bias_quality: 0.85    # TREND_DOWN: LONG 突破需要 Q≥0.85
  regime_long_bias_quality: 0.85     # TREND_UP: SHORT 突破需要 Q≥0.85
  low_vol_short_bias_quality: 0.85   # LOW_VOL+下行: LONG 突破需要 Q≥0.85
  min_hold_seconds: 300              # 2026-06-07: 180→300 (5min), FLOOR_STOP 在此时间内跳过
  same_symbol_loss_cooldown: true    # 当日亏损退出的标的禁止重新入场
  # P0 (2026-06-08): 简化退出 — 2R止盈替代分层止盈+追踪止损
  # 数据: 8笔ORB交易, 分层/追踪从未触发(死代码), FLOOR_STOP贡献99.7%亏损
  # 退出栈: 2R止盈(2×sl_distance) > Breakdown(60s) > FloorStop > EOD(15:55)

# ─── 催化辩论引擎 (2026-05-27 RFC-Catalyst) ───
# 盘前/盘后新闻催化事件检测 + 多模型辩论
# 盘中不介入 (避免影响交易延迟)
catalyst:
  enabled: false              # [Phase A 2026-06-13] 辩论引擎产出0条action，暂停
  
  # 盘前扫描
  premarket:
    scan_news_hours: 12          # 扫描过去12小时新闻
    min_severity: HIGH           # 低于此级别不辩论
    debate_timeout_seconds: 180  # 辩论总超时
    consensus_threshold: 0.4     # 分歧度阈值 (低于此值放弃信号)
  
  # 盘后回看
  postmarket:
    enabled: true
    generate_lessons: false      # [Phase A 2026-06-13] lesson_count=0，暂停
  
  # 反向催化: 行情先行 → 新闻确认
  reverse_catalyst:
    enabled: true
    min_change_pct: 0.03         # 3%异动触发反向催化
    quick_debate_timeout: 60     # 快速辩论60秒
    quick_debate_rounds: 1       # 快速辩论仅1轮
  
  # 一手信息源
  sources:
    hkex:
      enabled: false             # [CLEANUP 2026-06-13] 1280 log lines, all zero results
      interval_seconds: 120      # 2分钟轮询 (港交所披露易)
    csrc:
      enabled: false             # [CLEANUP 2026-06-13] 654 log lines, all zero results
      interval_seconds: 300      # 5分钟轮询 (证监会官网)
    cls_interval_minutes: 2      # 财联社从5分钟缩短到2分钟
  
  # 标的关联映射 (行业/板块传导)
  sector_mapping:
    chinese_adr: ["FUTU", "BABA", "PDD", "BIDU", "JD", "NIO", "LI", "XPEV"]
    chinese_broker: ["FUTU", "TIGR", "HLBZ"]
    ai_chip: ["NVDA", "AMD", "AVGO", "MU", "ARM", "QCOM"]
    ev: ["TSLA", "RIVN", "LCID", "NIO", "XPEV", "LI"]
    big_tech: ["AAPL", "MSFT", "GOOGL", "AMZN", "META"]

# ─── 截面排名器 (Pre-Market Ranker) ───
# 每天盘前对 watchlist 做截面排名，只交易 Top N 标的
# 替代原来逐个评估的方式，选出相对最强的标的
pre_market_ranker:
  enabled: false              # P0 (2026-06-04): 禁用, 模拟盘数据采集期全标的进入信号生成
  top_n: 8                    # (禁用后无效)
  weights:
    momentum: 0.35            # 20日动量权重
    sector: 0.25              # 行业相对强度权重
    volume: 0.20              # 成交量配合度权重
    volatility: 0.20          # 波动率合理性权重
  sector_etf_lookback: 20     # 行业 ETF 回看天数
  cache_ttl_seconds: 3600     # 排名缓存时间 (1小时)
