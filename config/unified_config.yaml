  # Y3 (2026-05-15): STRUCTURE_EXIT 33 笔 -$3,106 是最大单一亏损源
  # 收紧: 连续 2 次 (从 3) → cooldown 48h (从 24)
  structure_exit:
    consecutive_losses: 3           # 审计建议: 3次/24h (2次过紧，频繁触发冷却)
    cooldown_hours: 24              # 审计建议: 24h足够覆盖单日连续亏损
    direction: same_only
  # Y3: scalping sl_hit 也收紧 (105 笔 18% WR -$1632)
  scalping_sl_hit:
    daily_limit: 2                  # 从 3 → 2
    cooldown: until_next_day
  # F1 (2026-05-16): whipsaw 反向冷却 — 平仓后 N 秒内禁止反向开仓
