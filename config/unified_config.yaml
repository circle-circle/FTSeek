  #     同一资格门 (P1.5)。本段只标注"输入里已具名的标的现在能不能交易"。
  #   扫描期口径刻意**不含**执行时微结构门 (报价新鲜度 90s / 点差 / 借券) —— scan 在
  #     ET 09:10 盘前跑, 距入场窗约 2h, 用 90 秒新鲜度筛会把输入标的几乎全判 stale
  #     ⇒ 初筛退化成"全清"。微结构门留在 inject/执行侧复核 (计划 P1.2 明写"执行前仍
  #     复核有效性, 不能拿盘前快照当实时行情")。
  #   全程 fail-open: 取不到行情/ATR、配置读不到、任何异常 ⇒ 不追加本段, 材料零改动。
  #   回滚: input_prescreen 置 false (或删本两键, 代码默认亦为 true/30)。
  #   ── [2026-09-15 上限 30→80, DEB-20260910 §23, 用户裁"按照建议执行"] ──
  #   21:10 premarket **主轮**实测证伪了"30 够用": 材料具名 68 个 ⇒ 38 个落
  #   overflow_skipped, 而模型 surfaced 7 个里**只有 1 个 (FPS)** 在受检集合内 (1/7);
  #   未受检的 6 个 (COIN/MSTR/ASML/TRMD/VERA/NOK) 全被名额挤出。19:40 da_feed 那轮
  #   的 5/5 是**材料薄的侥幸** (named=35), 不能外推到主轮。
  #   同时实测: **提及数降序不是好的名额分配器** —— 被同一条 8-K 同时写进 sec_8k +
  #   event_symbols + news_headline 的低流动性事件票提及数最高 (JAZZ/BAND/GTBP/PLSE/
  #   ASTH/LUXE/CTEV/OBK/FEAV/CLST 等), 把 NVDA/AAPL/META/MSFT 与当日真热点全推到尾部
  #   ⇒ 该排序键与"模型会提名谁"基本无关。故改法不是再换排序键, 而是**让上限不再是
  #   竞争**: 只读实测受检 30 个耗时 10.88s、受检 68 个(全覆盖) 27.17s ⇒ 仅 +16s,
  #   而 cron 给 scan+inject+push 整段 1800s; tradeable 只从 12 → 13 (不会灌爆模型),
  #   覆盖面 1/7 → 7/7。
  #   排序键**保留** (提及数降序→同数保首现): 具名数超上限的日子仍需要一条**确定**的
  #   截断规则, 且它至少比字典序好 (字典序会把今日热点整批丢进 overflow)。
  #   ⚠ 副作用已实测并披露: 68 只全覆盖时撞过一次 Futu DailyK 配额窗口 (60次/30s,
