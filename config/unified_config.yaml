# 2026-08-12 (DEB-20260812-futu-unused-channels 主张A/B): 富途未利用通道影子采集.
#   capital_flow 分钟资金流 + derivative_unusual 期权大单异动 → jsonl 落库攒样,
#   8/24 同窗裁决 (增量IC/大单流领先假说). TRADING 节流300s + AFTER_HOURS 每日1次.
#   零执行路径改动 (record-only). 回滚: shadow_collect_enabled=false + 重启.
futu_channels:
  shadow_collect_enabled: true
  shadow_collect_interval_sec: 300
  shadow_symbols_max: 20

# 2026-08-12 (financial-data-query 数据源评估): 美国宏观日历影子采集 (record-only).
#   regime识别目前只有SPY价格行为+VIX, 对宏观披露日零感知 → 本采集攒样.
#   数据源演进: 初版蚂蚁金融API → 同日用户裁决方案B切 FRED 单源 (无key无限流,
#   实测数据更新: FRED已有2026-07 CPI而蚂蚁API停在06; PMI系ISM专有FRED无, 砍掉).
#   盘前 06:00-09:29 ET 每日1次, 7个核心指标(CPI/核心CPI/核心PCE/PPI/非农/
#   失业率/联储利率)最新值+披露检测(最新期前移=新披露) → jsonl 落库, 不进决策.
#   回滚: shadow_collect_enabled=false + 重启.
macro_calendar:
  shadow_collect_enabled: true
