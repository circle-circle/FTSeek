dynamic_exit:
  default:
    # RFC-0001 Phase0 止血 (2026-05-21): 止损从 -3% 放宽到 -4.5%, 减少噪声扫单
    # 归因：115 笔 sl_hit 胜率 16.5% 亏-$2,023, 美股日内 2-3% 波动是常态
    stop_loss: -0.045
    # P7 优化 (2026-05-22): 止盈从 5% 降到 2.5%, 数据：TRAILING_STOP 85 笔平均盈利仅 0.03%
    # 归因：止盈目标过高导致利润回吐，tp_hit 仅 5 笔 (1.9%)
    take_profit: 0.025
    partial_take_profit:
      enabled: true
      levels:
      - trigger: 0.025
        ratio: 0.5
      - trigger: 0.05
        ratio: 0.5
    trailing_stop:
      enabled: true
      # P7 优化：trigger_profit 从 3% 降到 1%，更早开始追踪
      trigger_profit: 0.01
      # P7 优化：trail_percent 从 1.5% 降到 0.5%，更紧追踪保护利润
      trail_percent: 0.005
    atr_stop:
      enabled: true
      multiplier: 2.5
    time_stop:
      enabled: true
      max_holding_days: 10
