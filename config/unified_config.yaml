    log_passed: true
    log_rejected: true
    report_interval: 10
  quality_gate:
    dedup:
      db_path: ~/.hermes/ftseek/data/news_dedup_us_v2.db
      enabled: true
      similarity_threshold: 0.85
      ttl_hours: 48
    max_age_minutes: 120
