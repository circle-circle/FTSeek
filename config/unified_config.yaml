      force_pass_geo: true
      force_pass_immediate: true
      min_score: 0.1
  skip_market_hours: true
  immediate_scan:
    enabled: false
    cooldown_seconds: 300
    require_trading_hours: true
    min_urgency: IMMEDIATE
    allow_keyword_match: true
    title_blacklist:
    - sponsored
    - promoted
    - advertisement
    - earnings preview
    - analyst says
  sources:
    finnhub:
      enabled: false
      interval_seconds: 120
    rsshub_us:
      enabled: true
      interval_seconds: 180
    sec_edgar:
      enabled: false
      interval_seconds: 300
