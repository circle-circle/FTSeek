  #   两重收敛防"永不检出": ①超 budget_sec 即停止补心跳 → 交回 watchdog 判定 (无脑定时 ping
  #   会让真卡死变成静默死亡, 见 DEB-20260831-silent-death-hardening); ②轮次跨入 TRADING 立即
  #   停止补心跳 + critical 告警 (盘前轮次跨开盘 = 入场执行被阻塞, 此时要 watchdog 权威)。
