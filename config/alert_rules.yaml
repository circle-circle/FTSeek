# FTSeek 告警规则配置
# version: 1.0
# updated: 2026-04-05

version: '1.0'
updated: '2026-04-05T00:00:00'
description: FTSeek 监控告警规则配置

# 告警规则列表
rules:
  # OpenD 连接告警
  - name: opend_disconnected
    metric: opend_connection_status
    condition: "<"
    threshold: 0.5
    level: critical
    message: "🚨 OpenD 连接已断开！请立即检查 OpenD 服务状态！"
    cooldown_seconds: 300
    enabled: true
    contacts:
      - admin

  # CPU 使用率告警
  - name: high_cpu_usage
    metric: system_cpu_percent
    condition: ">"
    threshold: 90.0
    level: warning
    message: "⚠️ CPU 使用率过高 ({value}%)，建议检查系统负载"
    cooldown_seconds: 1800
    enabled: true

  # 内存使用率告警
  - name: high_memory_usage
    metric: system_memory_percent
    condition: ">"
    threshold: 85.0
    level: warning
    message: "⚠️ 内存使用率过高 ({value}%)，建议检查内存占用"
    cooldown_seconds: 1800
    enabled: true

  # 磁盘使用率告警
  - name: high_disk_usage
    metric: system_disk_percent
    condition: ">"
    threshold: 90.0
    level: warning
    message: "⚠️ 磁盘使用率过高 ({value}%)，建议清理日志文件"
    cooldown_seconds: 3600
    enabled: true

  # 交易成功率告警
  - name: low_trade_success_rate
    metric: trade_success_rate
    condition: "<"
    threshold: 90.0
    level: warning
    message: "⚠️ 交易成功率过低 ({value}%)，建议检查交易逻辑和网络连接"
    cooldown_seconds: 3600
    enabled: true

  # 信号置信度过低告警
  - name: low_signal_confidence
    metric: signal_confidence_avg
    condition: "<"
    threshold: 0.5
    level: info
    message: "ℹ️ 平均信号置信度较低 ({value})，市场可能处于震荡期"
    cooldown_seconds: 7200
    enabled: true

  # OpenD 频繁断线告警
  - name: frequent_opend_disconnect
    metric: opend_disconnect_count
    condition: ">"
    threshold: 5.0
    level: critical
    message: "🚨 OpenD 频繁断线 (累计{value}次)，请立即检查网络和 OpenD 服务！"
    cooldown_seconds: 1800
    enabled: true
    contacts:
      - admin
