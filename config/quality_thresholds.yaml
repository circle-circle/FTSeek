# FTSeek 信号质量阈值配置
# version: 1.0.0
# updated: 2026-04-05
# description: 信号质量评估阈值和权重配置

# ============================================================================
# 质量阈值配置
# ============================================================================
thresholds:
  # 高质量信号阈值 (优先推送)
  high_min: 0.75

  # 中等质量信号阈值 (正常推送)
  medium_min: 0.50

  # 低质量信号阈值 (建议过滤)
  low_max: 0.50

# ============================================================================
# 维度阈值 (最低要求)
# ============================================================================
dimension_thresholds:
  # 最低历史准确率 (策略过往表现)
  min_historical_accuracy: 0.45

  # 最低策略置信度
  min_confidence: 0.50

  # 最低因子对齐度 (各技术指标一致性)
  min_factor_alignment: 0.40

  # 最低市场适配度 (策略与当前市场匹配)
  min_regime_fit: 0.40

  # 最低情绪确认度 (新闻情绪支持)
  min_sentiment_confirm: 0.30

# ============================================================================
# 评分权重配置
# ============================================================================
weights:
  # 历史准确率权重 - 基于策略过往信号的实际表现
  historical_accuracy: 0.30

  # 策略置信度权重 - 策略自身对信号的确认程度
  strategy_confidence: 0.20

  # 多因子对齐度权重 - 各技术因子的一致性
  multi_factor_alignment: 0.25

  # 市场状态适配度权重 - 策略与当前市场行情的匹配度
  market_regime_fit: 0.15

  # 新闻情绪确认权重 - 新闻情绪对信号方向的支持度
  news_sentiment_confirm: 0.10

# ============================================================================
# 推送策略配置
# ============================================================================
push_strategy:
  # 高质量信号 (≥0.75): 立即推送，加粗显示
  high:
    action: "immediate"
    highlight: true
    cooldown_override: true  # 可突破冷却时间限制

  # 中等质量信号 (0.50-0.74): 正常推送
  medium:
    action: "normal"
    highlight: false
    cooldown_override: false

  # 低质量信号 (<0.50): 不推送或降权
  low:
    action: "suppress"       # suppress=过滤，delay=延迟推送
    highlight: false
    cooldown_override: false
    delay_minutes: 10        # 如选择 delay，延迟推送时间

# ============================================================================
# 历史数据统计配置
# ============================================================================
history:
  # 统计样本数量 (最近 N 个信号)
  sample_size: 100

  # 数据保留天数
  retention_days: 90

  # 缓存有效期 (分钟)
  cache_ttl_minutes: 5

# ============================================================================
# 市场状态适配矩阵 (可自定义覆盖)
# ============================================================================
# 格式：策略名：{市场状态：适配度}
# 适配度：0.0 (完全不适配) - 1.0 (完全适配)
custom_regime_fit:
  # 示例：如果对默认适配度不满意，可在此覆盖
  # supertrend:
  #   strong_trend_up: 0.95
  #   range_bound: 0.35
