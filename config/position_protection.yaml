# 极简持仓保护配置（独立于auto_trading）
# 人工确认模式：触发后飞书告警 + Dashboard确认

enabled: true

# 止损默认参数
stop_loss:
  long_pct: 0.05    # LONG仓位：-5%止损
  short_pct: 0.05   # SHORT仓位：+5%止损（价格上涨触发）

# 追踪止盈参数
trailing_stop:
  activation_pct: 0.08  # 浮盈8%后激活
  trailing_pct: 0.03    # 从高点回撤3%触发

# 检查间隔（秒）
check_interval: 300  # 5分钟

# 飞书告警
feishu_webhook: "${FEISHU_WEBHOOK_URL_US}"
