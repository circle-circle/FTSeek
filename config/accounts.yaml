# FTSeek 账户配置文件
# 用于管理不同市场和交易类型的账户映射

# ============================================================
# 港股账户配置
# ============================================================
hk_accounts:
  # 港股正股/ETF/窝轮账户
  stock:
    account_id: "18820895"
    account_type: "CASH"
    description: "港股正股/ETF/窝轮账户"
    enabled: true
    
  # 港股期权账户 - 已禁用 (2026-04-02: 模拟账号不支持卖空操作)
  option:
    account_id: "8246818"
    account_type: "MARGIN"
    description: "港股期权账户 (融资账户) - 已禁用"
    enabled: false

# ============================================================
# 美股账户配置
# ============================================================
us_accounts:
  # 美股正股账户
  stock:
    account_id: ""  # 待配置
    account_type: "CASH"
    description: "美股正股账户"
    enabled: false
    
  # 美股期权账户
  option:
    account_id: ""  # 待配置
    account_type: "MARGIN"
    description: "美股期权账户"
    enabled: false

# ============================================================
# 默认配置
# ============================================================
defaults:
  # 默认交易环境：1=模拟，0=真实
  trd_env: 1
  
  # 默认市场
  default_market: "HK"
  
  # 账户选择策略
  # auto: 根据代码自动选择
  # manual: 使用指定的账户 ID
  selection_strategy: "auto"

# ============================================================
# 账户映射规则
# ============================================================
mapping_rules:
  # 港股正股：HK. + 5 位数字
  hk_stock_pattern: "^HK\\.\\d{5}$"
  
  # 港股期权：HK. + 字母 + 6 位日期 + C/P + 行权价
  hk_option_pattern: "^HK\\.[A-Z]+\\d{6}[CP]\\d+$"
  
  # 美股正股：US. + 字母数字组合
  us_stock_pattern: "^US\\.[A-Z0-9.]+$"

# ============================================================
# 账户验证配置
# ============================================================
validation:
  # 是否启用账户验证
  enabled: true
  
  # 验证超时 (秒)
  timeout: 30
  
  # 验证失败重试次数
  retry_count: 3
