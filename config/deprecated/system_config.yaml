# FTSeek 系统配置

## 核心配置

### 交易环境
- 环境：模拟盘 (零资金风险)
- 市场：港股 + 美股

### 信号融合
- 技术指标权重：60%
- 新闻情绪权重：40%
- 信号有效期：15 分钟

### 频率限制
- 单股票每日：≤3 次
- 全局每日：≤20 次

### 风险控制
- 单股仓位：≤20%
- 单日交易：≤10 次
- 最大回撤：≤15%

## 数据存储

| 数据类型 | 保留期限 | 说明 |
|----------|----------|------|
| 信号记录 | 永久 | 所有生成信号 |
| 交易记录 | 永久 | 所有执行交易 |
| 新闻数据 | 90 天 | 原始新闻 + 情绪分析 |
| 系统日志 | 30 天 | 运行日志 |
| 绩效快照 | 永久 | 周/月统计 |

## 绩效目标

**核心目标**: 模拟盘连续两个月胜率 > 60%

### 追踪指标
- 信号胜率
- 执行胜率
- 盈亏比
- 最大回撤
- 夏普比率

### 报告频率
- 日报：每日 09:00
- 周报：每周一 09:00
- 月报：每月 1 日 09:00

## 钉钉推送

### 消息类型
1. 交易信号 (三按钮：确认/延期/忽略)
2. 执行结果
3. 频率限制警告
4. 绩效报告

### 推送时间
- 交易时段：实时推送
- 非交易时段：暂存至下一交易日

## 监控标的

配置文件：`config/watchlist.json`

支持动态添加/删除，修改后重启服务生效。

## 回测配置

预设周期：
- 3 个月 (季度)
- 6 个月 (半年)
- 1 年 (年度)
- 2 年 (长期)
- 自定义 (30-1000 天)

配置文件：`config/backtest_presets.json`
