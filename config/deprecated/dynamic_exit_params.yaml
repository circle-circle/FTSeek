# FTSeek 动态止盈止损配置
# 根据市场状态自动调整止盈止损参数
# 更新时间：2026-03-25 (新增多周期 15M/30M/60M/日线K线数据支持，全面调优ATR参数)
#
# 优化原则（基于多周期数据）：
#   - ATR 倍数：基于 60M K线ATR更稳定，提升信噪比；趋势市放宽，震荡市收紧
#   - 追踪止盈触发点：强趋势时提高触发阈值（让利润奔跑），弱趋势/震荡提前锁利
#   - 时间止损：结合 60M/日线趋势判断，趋势方向延长持仓，逆势快速止损
#   - 保本止损：综合 15M/30M 趋势确认，盈利较快时更早上移止损

# ==================== 强上涨趋势 ====================
strong_trend_up:
  # 特征：ADX > 30, 价格在 MA50 上方 2%, 恒指涨幅 > 1%
  # 多周期视角：日线/60M/30M 三周期同向上涨，趋势明确
  stop_loss: -0.06           # 止损 -6%（较以前-8%收紧，减少单笔亏损）
  take_profit: 0.08          # 止盈 +8%（趋势行情延伸，较5%提高）

  # 保本止损
  breakeven_stop:
    enabled: true
    trigger_profit: 0.03     # 盈利 3% 后启用（较以前4%提前，利用15M确认）
    stop_level: 0.005        # 止损上移到成本价+0.5%（轻微正收益保护）

  # 分批止盈（趋势行情阶梯锁利）
  partial_take_profit:
    enabled: true
    levels:
      - target: 0.04         # +4% 时平仓 15%（快速落袋小部分）
        ratio: 0.15
      - target: 0.08         # +8% 时平仓 25%
        ratio: 0.25
      - target: 0.15         # +15% 时平仓 35%
        ratio: 0.35
      - target: 0.25         # +25% 时平仓剩余 25%
        ratio: 0.25

  # 移动止盈（多周期优化：基于60M ATR计算更稳定）
  trailing_stop:
    enabled: true
    trigger_profit: 0.06     # 达到 +6% 后启用（从8%降低，更早锁利）
    trail_percent: 0.04      # 回撤 4% 触发（较5%收紧，减少回吐）
    use_atr_based: true      # 优先使用 ATR 动态计算回撤距离

  # ATR 止损（基于 60M K线 ATR，更稳定）
  atr_stop:
    enabled: true
    multiplier: 2.8          # ATR×2.8（趋势市宽松，从2.5升至2.8）
    min_stop: 0.04
    max_stop: 0.10
    preferred_kline: "K_60M" # 优先使用 60M K线 ATR

  # 时间止损（趋势行情可以适当延长）
  time_stop:
    enabled: true
    max_holding_hours: 120   # 延长至 120 小时 (5 天，趋势行情)
    extend_if_uptrend: true

  # 港股 T+0 日内止损
  intraday_stop:
    enabled: true
    stop_percent: 0.025      # 日内亏损 2.5% 触发（趋势行情略宽松）
    session_end_force: false # 收盘前不平仓（让隔夜）

# ==================== 弱上涨趋势 ====================
weak_trend_up:
  # 多周期视角：日线向上，但 60M 或 30M 方向中性/分歧
  stop_loss: -0.045          # 止损 -4.5%（从-6%收紧）
  take_profit: 0.06          # 止盈 +6%（从5%提高，弱趋势需更高回报补偿）

  # 保本止损
  breakeven_stop:
    enabled: true
    trigger_profit: 0.025    # 盈利 2.5% 后启用
    stop_level: 0.003        # 成本价+0.3%

  partial_take_profit:
    enabled: true
    levels:
      - target: 0.03         # +3% 平仓 20%
        ratio: 0.20
      - target: 0.06         # +6% 平仓 35%
        ratio: 0.35
      - target: 0.10         # +10% 平仓 30%
        ratio: 0.30
      - target: 0.15         # +15% 平仓剩余
        ratio: 0.15

  trailing_stop:
    enabled: true
    trigger_profit: 0.04     # 达到 +4% 后启用（从6%提前）
    trail_percent: 0.030     # 回撤 3% 触发（从4%收紧）
    use_atr_based: true

  atr_stop:
    enabled: true
    multiplier: 2.3          # ATR×2.3（中等宽松）
    min_stop: 0.035
    max_stop: 0.09
    preferred_kline: "K_60M"

  time_stop:
    enabled: true
    max_holding_hours: 72    # 72 小时
    extend_if_uptrend: true

  intraday_stop:
    enabled: true
    stop_percent: 0.02
    session_end_force: false

# ==================== 震荡市 ====================
range_bound:
  # 特征：ADX < 20, 布林带收窄
  # 多周期视角：各周期趋势方向混乱，快进快出
  stop_loss: -0.035          # 止损收紧至 -3.5%（从-5%收紧，震荡市严控回撤）
  take_profit: 0.05          # 止盈 +5%（快速落袋）

  # 保本止损（震荡市更早保本）
  breakeven_stop:
    enabled: true
    trigger_profit: 0.015    # 盈利 1.5% 后启用（从2%提前）
    stop_level: 0.002        # 成本价+0.2%

  partial_take_profit:
    enabled: true
    levels:
      - target: 0.025        # +2.5% 平仓 30%（更快落袋，震荡回撤快）
        ratio: 0.30
      - target: 0.05         # +5% 平仓 40%
        ratio: 0.40
      - target: 0.08         # +8% 平仓剩余
        ratio: 0.30

  trailing_stop:
    enabled: true
    trigger_profit: 0.025    # 达到 +2.5% 后启用（从4%大幅提前）
    trail_percent: 0.018     # 回撤 1.8% 触发（从2.5%收紧）
    use_atr_based: true

  atr_stop:
    enabled: true
    multiplier: 1.6          # ATR×1.6（收紧，从1.8降低）
    min_stop: 0.025
    max_stop: 0.07
    preferred_kline: "K_30M" # 震荡市用 30M K线 ATR 更敏感

  time_stop:
    enabled: true
    max_holding_hours: 36    # 缩短至 36 小时（从48小时收紧）
    extend_if_uptrend: false

  intraday_stop:
    enabled: true
    stop_percent: 0.012      # 日内亏损 1.2% 触发（从1.5%收紧，震荡市更敏感）
    session_end_force: true  # 收盘前平仓（避免隔夜风险）

# ==================== 弱下跌趋势 ====================
weak_trend_down:
  # 多周期视角：日线向下，60M 中性；做多须谨慎，快进快出
  stop_loss: -0.04           # 止损 -4%（从-5%收紧）
  take_profit: 0.05          # 止盈 +5%（快速落袋，逆势收益目标低）

  # 保本止损
  breakeven_stop:
    enabled: true
    trigger_profit: 0.02     # 盈利 2% 后启用
    stop_level: 0.002

  partial_take_profit:
    enabled: true
    levels:
      - target: 0.025        # +2.5% 平仓 35%（快速落袋）
        ratio: 0.35
      - target: 0.05         # +5% 平仓 40%
        ratio: 0.40
      - target: 0.08         # +8% 平仓剩余
        ratio: 0.25

  trailing_stop:
    enabled: true
    trigger_profit: 0.03     # 达到 +3% 后启用（从5%提前）
    trail_percent: 0.022     # 回撤 2.2% 触发（从3%收紧）
    use_atr_based: true

  atr_stop:
    enabled: true
    multiplier: 1.7          # ATR×1.7（收紧，从1.8降低）
    min_stop: 0.030
    max_stop: 0.075
    preferred_kline: "K_30M"

  time_stop:
    enabled: true
    max_holding_hours: 48    # 48 小时
    extend_if_uptrend: false

  intraday_stop:
    enabled: true
    stop_percent: 0.018      # 日内亏损 1.8% 触发
    session_end_force: true

# ==================== 强下跌趋势 ====================
strong_trend_down:
  # 特征：ADX > 30, 价格在 MA50 下方 2%, 恒指跌幅 > 1%
  # 多周期视角：日线/60M/30M 三周期同向下跌，做多风险极高
  stop_loss: -0.03           # 止损收紧至 -3%（从-4%收紧，强下跌严控）
  take_profit: 0.045         # 止盈 +4.5%（从5%略降，强下跌中顺势回弹空间有限）

  # 保本止损（强下跌中最早启用）
  breakeven_stop:
    enabled: true
    trigger_profit: 0.015    # 盈利 1.5% 后立即启用（从2%提前）
    stop_level: 0.003        # 成本价+0.3%（保留少量利润）

  partial_take_profit:
    enabled: true
    levels:
      - target: 0.02         # +2% 时平仓 40%（最快落袋）
        ratio: 0.40
      - target: 0.04         # +4% 时平仓 40%
        ratio: 0.40
      - target: 0.07         # +7% 时平仓剩余
        ratio: 0.20

  trailing_stop:
    enabled: true
    trigger_profit: 0.02     # 达到 +2% 后启用（从3%提前，强下跌中保守）
    trail_percent: 0.015     # 回撤 1.5% 触发（从2%收紧）
    use_atr_based: true

  atr_stop:
    enabled: true
    multiplier: 1.4          # ATR×1.4（最紧，从1.5降低）
    min_stop: 0.022
    max_stop: 0.055
    preferred_kline: "K_15M" # 强下跌用 15M K线 ATR，反应更快

  time_stop:
    enabled: true
    max_holding_hours: 24    # 最短 24 小时
    extend_if_uptrend: false

  intraday_stop:
    enabled: true
    stop_percent: 0.012      # 日内亏损 1.2% 触发（最严格）
    session_end_force: true  # 收盘前平仓

# ==================== 高波动市场 ====================
high_volatility:
  # 特征：ATR 百分位 > 80%，多周期ATR均偏高
  stop_loss: -0.07           # 止损 -7%（从-8%收紧，高波动止损放宽但有上限）
  take_profit: 0.09          # 止盈 +9%（从5%提高，高波动行情目标拉大）

  # 保本止损（高波动需更多空间）
  breakeven_stop:
    enabled: true
    trigger_profit: 0.04     # 盈利 4% 后启用（从5%提前）
    stop_level: 0.005        # 成本价+0.5%

  partial_take_profit:
    enabled: true
    levels:
      - target: 0.04         # +4% 平仓 15%
        ratio: 0.15
      - target: 0.09         # +9% 平仓 30%
        ratio: 0.30
      - target: 0.15         # +15% 平仓 35%
        ratio: 0.35
      - target: 0.25         # +25% 平仓剩余
        ratio: 0.20

  trailing_stop:
    enabled: true
    trigger_profit: 0.05     # 达到 +5% 后启用（从6%提前）
    trail_percent: 0.045     # 回撤 4.5% 触发（从5%略收紧）
    use_atr_based: true

  atr_stop:
    enabled: true
    multiplier: 3.2          # ATR×3.2（高波动最宽松，从3.0提高）
    min_stop: 0.06
    max_stop: 0.14
    preferred_kline: "K_60M" # 高波动用 60M 平滑噪音

  time_stop:
    enabled: true
    max_holding_hours: 96    # 96 小时（高波动快进快出，从72缩短）

  intraday_stop:
    enabled: true
    stop_percent: 0.035      # 日内亏损 3.5% 触发（从3%略放宽）
    session_end_force: false

# ==================== 低波动市场 ====================
low_volatility:
  # 特征：ATR 百分位 < 20%，多周期ATR均偏低
  stop_loss: -0.04           # 止损 -4%（从-5%收紧，低波动空间小）
  take_profit: 0.055         # 止盈 +5.5%（从5%略提高）

  # 保本止损（低波动空间小，更早保本）
  breakeven_stop:
    enabled: true
    trigger_profit: 0.018    # 盈利 1.8% 后启用（从2.5%提前）
    stop_level: 0.002

  partial_take_profit:
    enabled: true
    levels:
      - target: 0.025        # +2.5% 平仓 25%
        ratio: 0.25
      - target: 0.055        # +5.5% 平仓 40%
        ratio: 0.40
      - target: 0.09         # +9% 平仓剩余
        ratio: 0.35

  trailing_stop:
    enabled: true
    trigger_profit: 0.03     # 达到 +3% 后启用（从5%大幅提前）
    trail_percent: 0.020     # 回撤 2% 触发（从3%收紧，低波动收益快速消失）
    use_atr_based: true

  atr_stop:
    enabled: true
    multiplier: 1.9          # ATR×1.9（低波动收紧，从2.0降低）
    min_stop: 0.025
    max_stop: 0.08
    preferred_kline: "K_30M" # 低波动用 30M K线 ATR

  time_stop:
    enabled: true
    max_holding_hours: 60    # 60 小时（从72小时收紧）

  intraday_stop:
    enabled: true
    stop_percent: 0.015      # 日内亏损 1.5% 触发
    session_end_force: false

# ==================== 默认配置 ====================
default:
  stop_loss: -0.035          # 止损 3.5%（与代码 neutral 档对齐，从-3%放宽避免过早止损）
  take_profit: 0.05          # 止盈 5%（与代码 neutral 档对齐）

  # 保本止损
  breakeven_stop:
    enabled: true
    trigger_profit: 0.018    # 盈利 1.8% 后启用保本止损（从2%提前）
    stop_level: 0.002        # 止损上移到成本价+0.2%

  partial_take_profit:
    enabled: true
    levels:
      - target: 0.025        # +2.5% 时平仓 30%（快速落袋）
        ratio: 0.30
      - target: 0.06         # +6% 时平仓 40%
        ratio: 0.40
      - target: 0.10         # +10% 时平仓剩余
        ratio: 0.30

  # 移动止盈
  trailing_stop:
    enabled: true
    trigger_profit: 0.025    # 达到 +2.5% 后启用（从3%提前）
    trail_percent: 0.015     # 回撤 1.5% 触发
    use_atr_based: true

  atr_stop:
    enabled: true
    multiplier: 2.0          # ATR×2.0（默认）
    min_stop: 0.025
    max_stop: 0.06
    preferred_kline: "K_30M" # 默认使用 30M K线 ATR

  time_stop:
    enabled: true
    max_holding_hours: 48    # 48 小时（从24小时延长，给信号更多时间）
    extend_if_uptrend: true

  # 港股 T+0 日内止损
  intraday_stop:
    enabled: true
    stop_percent: 0.015      # 日内亏损 1.5% 触发
    session_end_force: false # 收盘前不强制平仓