# FTSeek 告警阈值配置

# 失败统计告警阈值
alert_thresholds:
  # 冷却跳过占比 >50% 告警
  cooldown_skip_ratio: 0.50
  
  # 置信度拒绝占比 >40% 告警
  confidence_reject_ratio: 0.40
  
  # 订单超限占比 >10% 告警
  order_limit_ratio: 0.10
  
  # 每日熔断触发>3 次告警
  circuit_breaker_triggers: 3
  
  # 回撤超标告警 (已在 circuit_breaker.py 配置)
  drawdown_limit: 0.15

# 告警推送配置
push_config:
  # 钉钉推送
  dingtalk_enabled: true
  
  # 推送时间窗口 (避免夜间打扰)
  quiet_hours:
    start: "23:00"
    end: "08:00"
  
  # 告警聚合 (相同告警 10 分钟内只推送一次)
  aggregation_window_minutes: 10

# 日志输出配置
logging:
  # 失败记录级别
  failure_level: WARNING
  
  # 统计输出频率 (分钟)
  stats_interval_minutes: 60
  
  # 详细日志 (包含具体股票代码)
  verbose: false
