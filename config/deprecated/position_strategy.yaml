# FTSeek 持仓管理策略配置
# 最后更新：2026-03-15 (做空优化 + 港股特性适配)

# ==================== 仓位管理 ====================
position:
  initial_ratio: 0.40        # 首次开仓比例 (40% - 更保守)
  max_position_ratio: 0.15   # 单股最大仓位 (20%)
  total_max_ratio: 0.60      # 总仓位上限 (80%)
  
  # 动态仓位管理 (根据信号强度)
  dynamic_sizing:
    enabled: true
    strong_signal:           # 置信度≥80%
      initial_ratio: 0.50
      min_confidence: 0.80
    recommended:             # 置信度 60-80%
      initial_ratio: 0.35
      min_confidence: 0.60
    neutral:                 # 置信度 40-60%
      initial_ratio: 0.20
      min_confidence: 0.40
  
  # 波动率调整
  vol_adjustment:
    enabled: true
    high_vol_atr: 0.05       # ATR>5% 判定为高波动
    high_vol_reduce: 0.7     # 高波动时仓位 ×0.7
    low_vol_atr: 0.02        # ATR<2% 判定为低波动
    low_vol_increase: 1.2    # 低波动时仓位 ×1.2

# ==================== 金字塔加仓 ====================
pyramid:
  enabled: true
  level1:
    price_increase: 0.05     # 价格上涨 5%
    ratio: 0.30              # 加仓 30%
    min_confidence: 0.70     # 最小置信度 70%
  level2:
    price_increase: 0.10     # 价格上涨 10%
    ratio: 0.20              # 加仓 20%
    min_confidence: 0.70

# ==================== 出仓策略 ====================
# 2026-03-17 优化：根据回测分析调整参数
exit:
  stop_loss: -0.06           # 止损 -6% (从 -5% 放宽，减少被洗盘)
  take_profit: 0.12          # 止盈 +12% (从 +15% 降低，提高达成率)
  take_profit_ratio: 0.50    # 止盈平仓比例 (50%)
  
  # 分批止盈 (优化版 - 根据信号强度)
  partial_take_profit:
    enabled: true
    levels:
      - target: 0.08         # +8% 时平仓 30% (从 +10% 降低)
        ratio: 0.30
      - target: 0.15         # +15% 时平仓 40% (从 +20% 降低，提高比例)
        ratio: 0.40
      - target: 0.25         # +25% 时平仓 30% (从 +30% 降低)
        ratio: 0.30
  
  # 移动止盈 (优化版)
  trailing_stop:
    enabled: true
    trigger_profit: 0.08     # 达到 +8% 后启用 (从 +10% 降低)
    trail_percent: 0.04      # 回撤 4% 触发 (从 5% 收紧)
  
  # ATR 动态止损 (新增 - 2026-03-17)
  atr_stop:
    enabled: true
    multiplier: 2.0          # ATR×2
    min_stop: 0.05           # 最小 5%
    max_stop: 0.10           # 最大 10%
  
  # 时间止损 (新增 - 2026-03-17)
  time_stop:
    enabled: true
    max_holding_hours: 72    # 最大持仓 72 小时
    min_profit_hours: 24     # 24 小时内不平仓 (除非止损)
    extend_if_uptrend: true  # 涨势强烈可延长

# ==================== 交易间隔 ====================
cooldown:
  hours: 4                   # 冷却时间 4 小时
  max_trades_per_day: 3      # 单股日交易上限
  min_confidence: 0.60       # 最小信号置信度
  add_position_confidence: 0.70  # 加仓最小置信度

# ==================== 港股特性适配 ====================
hk_market:
  enabled: true
  
  # T+0 交易适配
  t0_trading:
    enabled: true
    intraday_reversal: true  # 允许日内反向信号
    intraday_signal_expire: 3600  # 日内信号 1 小时过期
  
  # 无涨跌停适配
  no_price_limit:
    enabled: true
    extended_stop_loss: -0.08  # 做空止损放宽至 -8%
    extreme_vol_reduce: 0.5    # 极端波动时仓位 ×0.5
  
  # 流动性分层
  liquidity_tiers:
    tier1:  # 高流动性 (泡泡玛特/中芯国际/腾讯/阿里/美团/小米)
      codes:
        - "HK.09992"  # 泡泡玛特 (主力)
        - "HK.00981"  # 中芯国际 (主力)
        - "HK.00700"  # 腾讯控股
        - "HK.09988"  # 阿里巴巴
        - "HK.03690"  # 美团 -W
        - "HK.01810"  # 小米集团
      max_position: 0.25
      min_confidence: 0.55
    tier2:  # 中流动性 (京东/网易/百度等)
      codes:
        - "HK.09618"  # 京东
        - "HK.09999"  # 网易
        - "HK.09888"  # 百度
        - "HK.01024"  # 快手
      max_position: 0.15
      min_confidence: 0.60
    tier3:  # 低流动性 (其他)
      default: true
      max_position: 0.08
      min_confidence: 0.65
  
  # 汇率对冲 (港币/美元)
  currency_hedge:
    enabled: false
    usd_hk peg: 7.8
    hedge_threshold: 0.02  # 汇率波动>2% 时预警

# ==================== 做空策略优化 ====================
short_strategy:
  enabled: true
  
  # 降低做空触发阈值
  rsi_overbought: 65       # 从 70 降至 65 (更早发现超买)
  macd_histogram_threshold: 0.0008  # 降低死叉确认阈值
  supertrend_multiplier: 2.5  # 从 3.0 降至 2.5 (更敏感)
  
  # 做空信号增强
  short_bias_factor: 1.2   # 做空信号权重 ×1.2
  min_confidence: 0.55     # 略低于做多 (0.60)
  
  # 做空仓位管理 (2026-03-17 优化)
  short_position:
    max_ratio: 0.15        # 做空最大仓位 15% (低于做多 20%)
    initial_ratio: 0.30    # 首次做空 30%
    stop_loss: -0.08       # 做空止损 -8% (保持不变)
    take_profit: 0.18      # 做空止盈 +18% (从 +20% 降低，提高达成率)
  
  # 做空分批止盈 (新增 - 2026-03-17)
  partial_take_profit:
    enabled: true
    levels:
      - target: 0.10       # +10% 时平仓 30%
        ratio: 0.30
      - target: 0.18       # +18% 时平仓 40%
        ratio: 0.40
      - target: 0.28       # +28% 时平仓 30%
        ratio: 0.30
