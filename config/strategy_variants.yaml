        condition: "SSS.score <= -0.5"
      - name: GDIAN
        params: {tight_threshold: 25, w_slope: 0.35, w_adx: 0.35, w_pos: 0.30}
        weight: 0.3
        condition: "GDIAN.value <= 25"
      - name: MFFF
        params: {threshold: 1.5, w_macd: 0.4, w_vol: 0.3, w_flow: 0.3}
