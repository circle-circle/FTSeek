# Playbook Horizon Strategy 配置
# 用于个股阶段驱动的短线/长线决策

horizon_selector:
  # 2026-06-26 (MADP DEB-20260626-horizon_model): 当前样本不足，
  # HorizonReturnModel 仅作观测工具，实时决策关闭，所有指令默认 short。
  enabled: false
  # 使用历史收益模型所需的最小样本数
  min_samples_for_model: 5
  # 选择阈值: long_score > short_score * (1 + margin_threshold) 时才选 long
  margin_threshold: 0.1
  # 不确定时的默认 horizon
  default_horizon: "short"
  # 历史收益模型更新频率
  model_update:
    daily: true
    weekly_deep_update: true
  # 风险预算分配 (short vs long)
  risk_budget:
    short_pct: 0.5
    long_pct: 0.5
    rebalance_weekly: true
    min_pct: 0.1

# Phase 3 (2026-06-30): 按因子类型设定退出规则
# ── 7/7 统一: Pipeline退出引擎唯一配置源 ──
# ExitMonitor (exit_policy.yaml) 因 7/3 fix 不再管 PLAYBOOK_SIM/LIVE 仓位 (reconciler 拦截→PROTECTED)。
# Pipeline 自管全部 PLAYBOOK 退出: SL + breakeven + trailing + PRE_CLOSE_EXIT + TIME_EXIT + EOD兜底。
# 退出规则优先级: SL_FIXED_PCT > PRE_CLOSE_EXIT > TIME_EXIT (盘中) + EOD_FORCE_CLOSE/MAX_HOLD_T5 (盘后)
#
# trailing: 利润锁定/跟踪止损
# time_exit: 持仓时间止损 (仅亏损时触发, 或 always)
# max_hold_days: 最大持有交易日 (由 EOD 兜底的 MAX_HOLD_T5 执行, 盘中不检查)
factor_exit_rules:
  # 默认规则
  default:
    trailing_enabled: false
    breakeven_at_pct: 0.5
    trailing_step_pct: 2.0
    time_exit_hours: 2.0
    time_exit_only_if_loss: true
    max_hold_days: 1

  # 趋势/动量类: 让利润奔跑, 用 trailing stop 锁定利润
  insider_cluster_buy:
    trailing_enabled: true
    breakeven_at_pct: 0.5
    trailing_step_pct: 1.5
    time_exit_hours: 999       # 盈利仓不 time_exit
    time_exit_only_if_loss: true
    max_hold_days: 5
  macd_golden_cross:
    trailing_enabled: true
    breakeven_at_pct: 1.0
    trailing_step_pct: 2.0
    time_exit_hours: 6
    time_exit_only_if_loss: true
    max_hold_days: 3
  above_ma20:
    trailing_enabled: true
    breakeven_at_pct: 1.0
    trailing_step_pct: 2.0
    time_exit_hours: 6
    time_exit_only_if_loss: true
    max_hold_days: 3
  news_positive:
    trailing_enabled: true
    breakeven_at_pct: 0.5
    trailing_step_pct: 1.5
    time_exit_hours: 4
    time_exit_only_if_loss: true
    max_hold_days: 2

  # 波动/反转类: 快速证伪, 不恋战
  volume_expansion:
    trailing_enabled: false
    breakeven_at_pct: 0.5
    trailing_step_pct: 2.0
    time_exit_hours: 0.5       # 30 分钟内不盈利就砍
    time_exit_only_if_loss: true
    max_hold_days: 1
  rsi_oversold:
    trailing_enabled: false
    breakeven_at_pct: 0.5
    trailing_step_pct: 2.0
    time_exit_hours: 0.5
    time_exit_only_if_loss: true
    max_hold_days: 1
  pe_below_industry:
    trailing_enabled: false
    breakeven_at_pct: 0.5
    trailing_step_pct: 2.0
    time_exit_hours: 0.5
    time_exit_only_if_loss: true
    max_hold_days: 1

  # ── 7/7 补齐: 25个缺失条件的退出规则 ──

  # 趋势/动量类 (与 above_ma20/macd_golden_cross 同组, 让利润奔跑)
  above_ma50:
    trailing_enabled: true
    breakeven_at_pct: 1.0
    trailing_step_pct: 2.0
    time_exit_hours: 6
    time_exit_only_if_loss: true
    max_hold_days: 3
  ma_golden_cross:
    trailing_enabled: true
    breakeven_at_pct: 1.0
    trailing_step_pct: 2.0
    time_exit_hours: 6
    time_exit_only_if_loss: true
    max_hold_days: 3
  bollinger_upper:
    trailing_enabled: true
    breakeven_at_pct: 1.0
    trailing_step_pct: 2.0
    time_exit_hours: 4
    time_exit_only_if_loss: true
    max_hold_days: 2
  bollinger_squeeze:
    trailing_enabled: true
    breakeven_at_pct: 1.0
    trailing_step_pct: 2.0
    time_exit_hours: 6
    time_exit_only_if_loss: true
    max_hold_days: 3
  near_52w_high:
    trailing_enabled: true
    breakeven_at_pct: 1.0
    trailing_step_pct: 2.0
    time_exit_hours: 4
    time_exit_only_if_loss: true
    max_hold_days: 2

  # 基本面/内部人类 (中长期持有, trailing 锁利)
  insider_net_buy:
    trailing_enabled: true
    breakeven_at_pct: 0.5
    trailing_step_pct: 1.5
    time_exit_hours: 999
    time_exit_only_if_loss: true
    max_hold_days: 5
  revenue_growth_high:
