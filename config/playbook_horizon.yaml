# Playbook Horizon Strategy 配置
# 用于个股阶段驱动的短线/长线决策

horizon_selector:
  # 2026-07-08: 启用趋势强度驱动的 horizon 选择
  # 数据支持: T3 WR 55-60% > T1 39-40%, 6-12h持仓 avg+$131 70%WR
  # 强趋势标的 → long (波段, max_hold=3天, 宽SL)
  # 高波动/震荡 → short (日内, 快进快出)
  enabled: true
  # 使用历史收益模型所需的最小样本数
  min_samples_for_model: 5
  # 选择阈值: long_score > short_score * (1 + margin_threshold) 时才选 long
  margin_threshold: 0.1
  # 不确定时的默认 horizon
  default_horizon: "short"
  # 历史收益模型更新频率
  model_update:
    daily: true
    weekly_deep_update: true
  # 风险预算分配 (short vs long)
  risk_budget:
    short_pct: 0.5
    long_pct: 0.5
    rebalance_weekly: true
    min_pct: 0.1

# Phase 3 (2026-06-30): 按因子类型设定退出规则
# ── 7/7 统一: Pipeline退出引擎唯一配置源 ──
# ExitMonitor (exit_policy.yaml) 因 7/3 fix 不再管 PLAYBOOK_SIM/LIVE 仓位 (reconciler 拦截→PROTECTED)。
# Pipeline 自管全部 PLAYBOOK 退出: SL + breakeven + trailing + PRE_CLOSE_EXIT + TIME_EXIT + EOD兜底。
# 退出规则优先级: SL_FIXED_PCT > PRE_CLOSE_EXIT > TIME_EXIT (盘中) + EOD_FORCE_CLOSE/MAX_HOLD_T5 (盘后)
#
# trailing: 利润锁定/跟踪止损
# time_exit: 持仓时间止损 (仅亏损时触发, 或 always)
# max_hold_days: 最大持有交易日 (由 EOD 兜底的 MAX_HOLD_T5 执行, 盘中不检查)
factor_exit_rules:
  # 默认规则
  # 2026-07-08: time_exit 2.0→4.0 (2-4h死亡区间-$10,229 vs 4-8h黄金时段+$14,573)
  # 2026-07-09: breakeven 1.5→1.0, drawdown 0.8→0.5
  #   数据: MFE中位数1.5%, 85%利润被giveback. breakeven更早保本+drawdown更紧锁利
  #   效果: 浮盈1%→保本(亏不了) → 浮盈1.5%→回撤0.5%→锁1.0%(落袋)
  # 2026-07-16: breakeven 1.0→0.5, drawdown 0.5→0.4 (影子数据验证)
  #   7/15 影子退出: COIN be0.5_dd0.4=+3.51% vs actual=-0.01% (浪费3.52%浮盈)
  #   ORCL be0.3_dd0.3=+1.28% vs actual=-0.20%, MSFT be0.5_dd0.4=+2.08% vs actual=+1.91%
  #   3/4 笔在更紧参数下更优. be0.5_dd0.4 是 be0.3_dd0.3 (太紧,频繁误触) 和 be1.0_dd0.5 (太松) 的平衡点.
  # 2026-07-19: drawdown 0.4→0.8 (handoff 处方回归, DEB-round3 实证)
  #   根因: 7/16 基于 n=4 影子样本收紧, 与 handoff n=61 实证诊断("退出砍赢家, R:R 不足")方向相反.
  #   实测: SL_TRAIL_LOCK 15笔 avg_win=$27.59 (MFE 1.48% 仅捕获一半), EOD 赢家 avg=$96.74.
  #   0.4% 回撤锁在日内噪声底附近触发, 系统性截断赢家 → avg_win 上不去 → R:R 被压.
  #   0.8% = handoff 原始处方, 给赢家 0.8% 呼吸空间, 让趋势跑完再锁.
  #   breakeven_at_pct=0.5 不动 (仍早保本, 亏不了), 只放宽锁利回撤容忍.
  #   回滚: 改回 0.4. 判分: 下周五 exit_scorecard R:R + avg_win 对比.
  default:
    trailing_enabled: true
    breakeven_at_pct: 0.4           # 0.5→0.4 (2026-08-17 用户裁"直接落地be_0.4"): 触发线=费用线对齐, 真净保本. 回放n=265 pess+88/opt+161双序正, 零缺口带虚增(be_0.3有40笔物理不可成交被否). 生产fee-aware费用垫实弹avg0.147%≪0.4%→保本线恒在峰值下方可成交. 回滚: 改回0.5
    # ⚠️ 勘误 (2026-09-27, scripts/be04_live_acceptance_check.py; 纯注释, exit_config_version 哈希实测不变):
    #   上行"回放n=265 pess+88/opt+161双序正"**用现役官方引擎不可复现** — exit_replay_backtest.py
    #   跑同窗 (6/24~8/17, n=273) 得 Δ(be_0.4−be_0.5) = pess **−729** / opt **−595** (反号),
    #   且 be_0.4 是 0.3/0.4/0.5/0.8 四档里最差。但该复现读数**亦不可采信**:
    #   ① reason_match_pct=0.542 ≪ 0.80 冻结线 ⇒ 判据一律不作数; ② 引擎 8/17 后被改过
    #   (ef5a1cc5d [DEB-20260907] "官方引擎救活") ⇒ 非当时工具; ③ **参数时代混算** —
    #   引擎 live_baseline 用现行 config(be_0.4) 回放整窗, 而窗口主体(266/278笔)实盘是
    #   **be_0.5 时代**成交 ⇒ 引擎把当时本不该武装的笔也武装了: 聚合对账实测引擎 BE 桶
    #   103笔/净+519 vs 实盘 59笔/净−130 (笔数虚增 +74.6%), BE 占比 37.7% vs 20.3%;
    #   reason_match=0.542 的主因也是它 (scripts/replay_engine_be_fidelity.py 可复现)。
    #   ⚠️ 勘误之勘误: 本条初版曾写"③ 两回放器的 BE 出场都按穿越价结算 ⇒ 系统性低估 BE"
    #   — **对官方引擎是错的**: 它按生效 SL 线结算 (L388 exit_price=eff*(1∓slip), eff 复用
    #   生产 SSOT _compute_dynamic_effective_sl), 且 MU id=1561 校准单显示其偏差两侧反向
    #   (固定 fee 0.15%>fee-aware 0.109% 偏乐观 / 不模拟限价有利成交偏悲观)。穿越价缺陷
    #   只存在于我自写的简易回放器 (已删)。
    #   ⇒ **参数值维持 0.4 不动**; 但归因需修正: 实盘 SL_BREAKEVEN 桶从 7月净−130 转正到
    #   8/27起净+615 (WR 35.6%→87.1%), 拐点是 **8/20 方案A** (slip_cushion 0.2% + 限价挂净保本线)
    #   把越线率 62.5%(8/18-19纯be_0.4段)→13.6%, 二项检验 P(X≥5)=0.0018 拒绝"小样本噪声"
    #   ⇒ 转正的功劳主要是**方案A**, 不是 be 阈值下调; be_0.4 只让武装更早(笔数59→103+)。
    #   ⚠️ 不等于 be_0.4 该回滚: be_0.4+方案A 是**组合**产出; 单独回滚未经验证且保护面变窄。
    #   残留越线 21 笔全为 be_exit_class∈{SLIP 12, GAP 9} = 物理必然(滑点/跳空穿越), 零笔限价腿降级
    #   ⇒ 与 be 阈值无关, 调 be 治不了。
    drawdown_from_peak_pct: 0.8     # 0.4→0.8: handoff处方回归, 释放赢家呼吸空间
    trailing_step_pct: 2.0          # 兼容回退(无drawdown时用)
    time_exit_hours: 6.0           # 4.0→6.0: TIME_EXIT 7笔0%WR-$238, 2h-4h死亡区间, 延长让趋势仓不被砍
    time_exit_only_if_loss: true
    max_hold_days: 1

  # 趋势/动量类: 让利润奔跑, 用回撤止损锁定利润
  # 2026-07-09: drawdown 0.6-0.7→0.5-0.6, 与default(0.5)对齐, 更紧锁利
  # 2026-07-20 P0-1: 趋势类(trailing=true) drawdown 0.5→0.8 与 default 对齐.
  #   根因: 7/19 只放宽了 default, 但 _get_factor_exit_config 命中注册因子时用因子规则,
  #   default 仅兜底无因子/未注册单 → 绝大多数带因子 BUY 单仍被 0.5 锁在噪声底,
  #   7/19 处方(释放赢家呼吸空间)实际未生效, 周五判分会得出假阴性.
  #   快速证伪类(trailing=false)不动 — 它们走 profit_override, 语义不同.
  #   回滚: 全部改回 0.5. 判分: 与 default 同窗口, 下周五 exit_scorecard R:R + avg_win.
  insider_cluster_buy:
    trailing_enabled: true
    breakeven_at_pct: 0.4
    drawdown_from_peak_pct: 0.8     # 7/19处方对齐default: 释放赢家呼吸空间
    trailing_step_pct: 1.5
    time_exit_hours: 999       # 盈利仓不 time_exit
    time_exit_only_if_loss: true
    max_hold_days: 5
  macd_golden_cross:
    trailing_enabled: true
    breakeven_at_pct: 0.4           # 1.0→0.5→0.4 (8/17 be_0.4): 与default对齐
    drawdown_from_peak_pct: 0.8     # 7/19处方对齐default
    trailing_step_pct: 2.0
