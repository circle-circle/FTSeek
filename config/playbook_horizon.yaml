# Phase 4 (2026-06-30): 市场状态叠加 (VIX / regime / SPY 趋势)
market_state_overlay:
  enabled: true
  # VIX 阈值
  vix_thresholds:
    low: 20.0
    medium: 25.0
    high: 30.0
  # 仓位乘数 (与 regime_multiplier 相乘)
  vix_position_mult:
    low: 1.0
    medium: 0.8
    high: 0.5
    extreme: 0.0
  # 止损加宽 (percentage points)
  vix_sl_widen:
    low: 0.0
    medium: 0.3
    high: 0.8
    extreme: 1.5
  # 止盈倍率调整 (乘在 tp_multiplier 上)
  vix_tp_mult:
    low: 1.0
    medium: 0.9
    high: 0.7
    extreme: 0.5
  # regime 仓位调整
  regime_position_mult:
    RISK_ON: 1.0
    CAUTIOUS: 1.0
    RISK_OFF: 1.0
    NO_TRADE: 0.0
  # SPY 趋势方向过滤
  skip_long_if_spy_below_ma20: false
  skip_short_if_spy_above_ma20: false

# 短线参数
short_horizon:
  label: "SHORT_HORIZON"
  fixed_stop_loss_pct: 2.0
  buy_fixed_stop_loss_pct: 2.5  # fallback only (vol_buckets未命中时); 7/7全部走vol_buckets路径
  sell_fixed_stop_loss_pct: 2.0
  rr_ratio: 999  # 2026-06-30 DEB-20260630: 移除TP, 让EOD捕获利润(100%WR avg+$203). TP=3%从未触发且会截断SHORT EOD avg=5.66%
  max_hold_days: 1
  skip_pre_close_if_profit: false
  time_exit_hours: 2.0
  # Phase 2 (2026-06-30): 波动率分桶止损/止盈
  # 2026-07-08: sl_multiplier 0.8/0.7/0.6/0.5 → 1.2/1.5/1.5/1.2
  #   根因: SL=0.7×ATR 止在1个ATR以内=统计噪声, 7/7的BA(0.70×ATR)AMZN(0.70×)NVDA(0.70×)全被扫损
  #   规则: SL≥1.2×ATR 让正常波动不触发止损, 让趋势有时间发展
  # 2026-07-09: 数据驱动调整 — SL距离 vs 胜率回测:
  #   <2%: WR=47% SL触发率=41% 亏$1352 (太紧, 开盘噪声扫损)
  #   2-3%: WR=59% SL触发率=9% 赚$601 (最优区间)
  #   >5%: WR=14% (太松, 方向错亏太多)
  #   调整: low floor 1.5→2.0, high ceil 8.0→5.0, 收紧到2-5%最优区
  vol_buckets:
    low:
      atr_pct_max: 0.015
      sl_multiplier: 1.2
      sl_floor_pct: 2.0         # 1.5→2.0: 避免落入<2%的噪声扫损区
      sl_ceil_pct: 2.5
      tp_multiplier: 2.0
      short_widen_pct: 0.2
      max_hold_hours: 6
    medium:
      atr_pct_max: 0.035
      sl_multiplier: 1.5
      sl_floor_pct: 2.5
      sl_ceil_pct: 4.5
      tp_multiplier: 1.8
      short_widen_pct: 0.3
      max_hold_hours: 4
    high:
      atr_pct_max: 0.08
      sl_multiplier: 1.5
      sl_floor_pct: 3.5
      sl_ceil_pct: 5.0           # 8.0→5.0: >5%胜率仅14%, 收紧止损
      tp_multiplier: 1.5
      short_widen_pct: 0.5
      max_hold_hours: 2
    extreme:
      atr_pct_max: 999.0
      sl_multiplier: 1.2
      sl_floor_pct: 3.5
      sl_ceil_pct: 5.0           # 6.0→5.0: 同high桶, >5%胜率差
      tp_multiplier: 1.5
      short_widen_pct: 0.8
      max_hold_hours: 1
      position_mult: 0.5

# 长线参数
long_horizon:
  label: "LONG_HORIZON"
  # 2026-07-08: rr_ratio 999→2.0 (波段需要止盈目标, 不能完全靠EOD)
  # 数据: T3 WR最优(55-60%), T5回落(43-44%) → max_hold=3天
  rr_ratio: 2.0
  fixed_stop_loss_pct: 2.0
  # 2026-07-08: max_hold_days 5→3 (T3数据最优, T5胜率回落)
  max_hold_days: 3
  skip_pre_close_if_profit: true
  overnight_gap_stop_pct: 3.0
  time_exit_hours: 999
  # Phase 2 (2026-06-30): 波动率分桶止损/止盈 (长线默认用更宽的止损让利润奔跑)
  # 2026-07-08 DEB: sl_ceil+0.5% (3天持仓波动>日内, 给趋势发展空间)
  vol_buckets:
    low:
      atr_pct_max: 0.015
      sl_multiplier: 1.2
      sl_floor_pct: 1.5
      sl_ceil_pct: 3.0
      tp_multiplier: 2.5
      short_widen_pct: 0.2
      max_hold_hours: 24
    medium:
      atr_pct_max: 0.035
      sl_multiplier: 1.5
      sl_floor_pct: 2.5
      sl_ceil_pct: 5.0
      tp_multiplier: 2.0
      short_widen_pct: 0.3
      max_hold_hours: 16
    high:
      atr_pct_max: 999.0
      sl_multiplier: 1.5
      sl_floor_pct: 3.5
      sl_ceil_pct: 5.0           # 8.5→5.0: 同short_horizon, >5%胜率差
      tp_multiplier: 1.8
      short_widen_pct: 0.5
      max_hold_hours: 8
