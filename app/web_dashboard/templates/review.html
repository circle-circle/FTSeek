<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FTSeek-US 分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1117; color: #e6edf3; font-size: 14px;
        }

        /* ── TOP NAV ── */
        .top-nav {
            background: #161b22; border-bottom: 1px solid #30363d;
            padding: 0 16px; display: flex; align-items: center;
            position: sticky; top: 0; z-index: 50;
        }
        .top-nav .brand { color: #58a6ff; font-weight: 700; font-size: 14px; padding: 10px 12px 10px 0; border-right: 1px solid #30363d; margin-right: 8px; }
        .top-nav a { color: #8b949e; text-decoration: none; padding: 10px 14px; font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap; }
        .top-nav a:hover { color: #e6edf3; }
        .top-nav a.active { color: #58a6ff; border-bottom-color: #58a6ff; }
        .top-nav .spacer { flex: 1; }

        /* ── CONTAINER ── */
        .container { max-width: 1400px; margin: 0 auto; padding: 12px 16px; }

        /* ── CARD ── */
        .card {
            background: #161b22; border: 1px solid #30363d;
            border-radius: 10px; padding: 20px; margin-bottom: 16px;
        }
        .card h3 { color: #58a6ff; margin-bottom: 14px; font-size: 15px; font-weight: 600; }
        .card h3 .subtitle { font-weight: 400; font-size: 12px; color: #8b949e; margin-left: 8px; }

        /* ── COMMON TABLE ── */
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #30363d; }
        th { background: #0d1117; font-weight: 600; color: #8b949e; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; cursor: default; }
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { color: #58a6ff; }
        th.sortable .sort-arrow { font-size: 10px; margin-left: 4px; opacity: 0.4; }
        th.sortable.sorted .sort-arrow { opacity: 1; color: #58a6ff; }
        td { color: #e6edf3; font-size: 13px; }
        tr:hover td { background: #1a1d23; }

        .positive { color: #4ade80 !important; font-weight: 600; }
        .negative { color: #f87171 !important; font-weight: 600; }
        .muted { color: #8b949e; }
        .long { color: #4ade80; }
        .short { color: #f87171; }

        .pnl-green { color: #4ade80; font-weight: 700; }
        .pnl-red { color: #f87171; font-weight: 700; }

        /* ── CHARTS ── */
        .chart-wrap {
            position: relative; width: 100%; height: 380px; margin-bottom: 8px;
        }
        .chart-wrap canvas { width: 100% !important; height: 100% !important; }

        /* ── TWO COLUMN ── */
        .grid-2 {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;
        }
        .grid-2 .card { margin-bottom: 0; }

        /* ── DIR BARS ── */
        .dir-compare { display: flex; gap: 20px; margin-top: 8px; }
        .dir-compare .dir-col { flex: 1; background: #0d1117; border-radius: 8px; padding: 14px; text-align: center; }
        .dir-col .dir-label { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .dir-col .dir-stat { font-size: 13px; color: #8b949e; margin-bottom: 4px; }
        .dir-col .dir-val  { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
        .dir-col .dir-bar {
            height: 6px; border-radius: 3px; margin: 10px 0 4px;
            background: #30363d;
        }
        .dir-col .dir-bar-fill {
            height: 100%; border-radius: 3px; transition: width 0.5s ease;
        }
        .dir-bar-fill.long { background: #4ade80; }
        .dir-bar-fill.short { background: #f87171; }

        /* ── FILTERS ── */
        .filters {
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
            margin-bottom: 14px;
        }
        .filters label { color: #8b949e; font-size: 12px; margin-right: 2px; }
        .filters select, .filters input {
            padding: 7px 12px; border: 1px solid #30363d; border-radius: 6px;
            background: #0d1117; color: #e6edf3; font-size: 13px; cursor: pointer;
        }
        .filters select:focus, .filters input:focus { border-color: #58a6ff; outline: none; }
        .filters .btn {
            padding: 7px 16px; border: 1px solid #30363d; border-radius: 6px;
            background: #0d1117; color: #58a6ff; font-size: 13px; cursor: pointer;
            font-weight: 600;
        }
        .filters .btn:hover { border-color: #58a6ff; background: #1a2a3a; }
        .filters .btn.load-more {
            display: block; margin: 14px auto 0; padding: 10px 32px;
        }

        /* ── FACTOR GRID ── */
        .factor-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
        }
        .factor-cell {
            background: #0d1117; border: 1px solid #30363d;
            border-radius: 8px; padding: 16px; text-align: center;
        }
        .factor-cell .f-name { font-size: 13px; color: #8b949e; margin-bottom: 6px; }
        .factor-cell .f-val  { font-size: 22px; font-weight: 700; color: #484f58; }
        .factor-cell .f-sub  { font-size: 11px; color: #484f58; margin-top: 4px; }

        /* ── PLACEHOLDER ── */
        .placeholder-msg {
            text-align: center; color: #8b949e; padding: 12px;
            font-size: 13px; background: #0d1117; border-radius: 8px;
            margin-bottom: 16px;
        }

        /* ── LOADING ── */
        .loading-text { text-align: center; color: #8b949e; padding: 24px; font-size: 13px; }
        .error-text { color: #f87171; text-align: center; padding: 24px; }

        /* ── AUTO-REFRESH INDICATOR ── */
        .auto-refresh {
            font-size: 10px; color: #484f58; margin-left: 8px;
        }
        .auto-refresh .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
        .auto-refresh .dot.on { background: #4ade80; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .top-nav { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .top-nav .brand { display: none; }
            .top-nav a { padding: 8px 10px; font-size: 12px; }
            .container { padding: 8px; }
            .card { padding: 12px; border-radius: 8px; }
            th, td { padding: 8px 6px; font-size: 11px; }
            .filters { flex-direction: column; align-items: stretch; }
            .filters select, .filters input, .filters .btn { width: 100%; }
            .grid-2 { grid-template-columns: 1fr; }
            .factor-grid { grid-template-columns: repeat(2, 1fr); }
            .dir-compare { flex-direction: column; }
            .chart-wrap { height: 260px; }
            table { display: block; overflow-x: auto; white-space: nowrap; }
            .filters .btn.load-more { width: auto; }
        }
    </style>
</head>
<body>
    <!-- ── TOP NAV ── -->
    <div class="top-nav">
        <span class="brand">FTSeek-US</span>
        <a href="/">指挥中心</a>
        <a href="/trade">交易</a>
        <a href="/review" class="active">分析</a>
        <a href="/system">系统</a>
    </div>

    <div class="container">
        <!-- ════════════════════════════════════════════════════════ -->
        <!-- SECTION 1 — EQUITY CURVE -->
        <!-- ════════════════════════════════════════════════════════ -->
        <div class="card">
            <h3>
                📈 权益曲线
                <span class="subtitle">近30天</span>
                <span class="auto-refresh"><span class="dot on" id="refresh-dot"></span>自动刷新</span>
            </h3>
            <div class="chart-wrap">
                <canvas id="equityChart"></canvas>
            </div>
        </div>

        <!-- ════════════════════════════════════════════════════════ -->
        <!-- SECTION 2 — TWO COLUMNS -->
        <!-- ════════════════════════════════════════════════════════ -->
        <div class="grid-2">
            <!-- Left: Performance by Exit Type -->
            <div class="card">
                <h3>🚪 按退出类型表现</h3>
                <table>
                    <thead>
                        <tr>
                            <th>退出原因</th>
                            <th>交易数</th>
                            <th>总盈亏</th>
                            <th>胜率</th>
                        </tr>
                    </thead>
                    <tbody id="exit-type-table">
                        <tr><td colspan="4" class="loading-text">加载中...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Right: Performance by Direction -->
            <div class="card">
                <h3>📊 按方向表现对比</h3>
                <div id="dir-compare-area">
                    <p class="loading-text">加载中...</p>
                </div>
            </div>
        </div>

        <!-- ════════════════════════════════════════════════════════ -->
        <!-- SECTION 3 — TRADE HISTORY TABLE -->
        <!-- ════════════════════════════════════════════════════════ -->
        <div class="card">
            <h3>📋 交易历史</h3>
            <div class="filters">
                <label>时间范围</label>
                <select id="date-range">
                    <option value="7">最近7天</option>
                    <option value="30" selected>最近30天</option>
                    <option value="0">全部</option>
                </select>
                <label>方向</label>
                <select id="dir-filter">
                    <option value="">全部</option>
                    <option value="LONG">做多</option>
                    <option value="SHORT">做空</option>
                </select>
                <button class="btn" onclick="applyFilters()">🔍 筛选</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th class="sortable" data-sort="trade_date" onclick="toggleSort('trade_date')">日期 <span class="sort-arrow">▼</span></th>
                        <th>标的</th>
                        <th class="sortable" data-sort="direction" onclick="toggleSort('direction')">方向 <span class="sort-arrow">▼</span></th>
                        <th class="sortable" data-sort="entry_price" onclick="toggleSort('entry_price')">入场 <span class="sort-arrow">▼</span></th>
                        <th class="sortable" data-sort="exit_price" onclick="toggleSort('exit_price')">出场 <span class="sort-arrow">▼</span></th>
                        <th class="sortable" data-sort="pnl" onclick="toggleSort('pnl')">盈亏 <span class="sort-arrow">▼</span></th>
                        <th>退出原因</th>
                        <th class="sortable" data-sort="signal_strength" onclick="toggleSort('signal_strength')">信号强度 <span class="sort-arrow">▼</span></th>
                        <th class="sortable" data-sort="signal_confidence" onclick="toggleSort('signal_confidence')">置信度 <span class="sort-arrow">▼</span></th>
                    </tr>
                </thead>
                <tbody id="trade-history-table">
                    <tr><td colspan="9" class="loading-text">加载中...</td></tr>
                </tbody>
            </table>
            <button id="load-more-btn" class="btn load-more" onclick="loadMoreTrades()" style="display:none;">加载更多...</button>
        </div>

        <!-- ════════════════════════════════════════════════════════ -->
        <!-- SECTION 4 — FACTOR ATTRIBUTION -->
        <!-- ════════════════════════════════════════════════════════ -->
        <div class="card">
            <h3>🧬 因子归因</h3>
            <div class="placeholder-msg">
                因子归因数据将在新交易产生后可用
            </div>
            <div class="factor-grid">
                <div class="factor-cell">
                    <div class="f-name">F1 · 趋势</div>
                    <div class="f-val">—</div>
                    <div class="f-sub">暂无数据</div>
                </div>
                <div class="factor-cell">
                    <div class="f-name">F2 · 动量</div>
                    <div class="f-val">—</div>
                    <div class="f-sub">暂无数据</div>
                </div>
                <div class="factor-cell">
                    <div class="f-name">F3 · 波动率</div>
                    <div class="f-val">—</div>
                    <div class="f-sub">暂无数据</div>
                </div>
                <div class="factor-cell">
                    <div class="f-name">F4 · 量价</div>
                    <div class="f-val">—</div>
                    <div class="f-sub">暂无数据</div>
                </div>
                <div class="factor-cell">
                    <div class="f-name">F5 · 情绪</div>
                    <div class="f-val">—</div>
                    <div class="f-sub">暂无数据</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ══════════════════════════════════════════════════════════════
        // CONFIG
        // ══════════════════════════════════════════════════════════════
        const API_BASE = window.location.protocol + '//' + window.location.host;
        const PAGE_SIZE = 100;
        let allTrades = [];
        let displayOffset = 0;
        let currentSort = { field: 'trade_date', asc: false };
        let equityChart = null;

        // ══════════════════════════════════════════════════════════════
        // SECTION 1 — EQUITY CURVE
        // ══════════════════════════════════════════════════════════════
        async function loadEquityCurve() {
            try {
                const resp = await fetch(`${API_BASE}/api/risk/pnl-history?days=30`);
                const data = await resp.json();
                const history = data.equity_history || [];

                if (history.length === 0) {
                    const canvas = document.getElementById('equityChart');
                    const ctx = canvas.getContext('2d');
                    ctx.font = '14px sans-serif';
                    ctx.fillStyle = '#8b949e';
                    ctx.textAlign = 'center';
                    ctx.fillText('暂无权益数据', canvas.width / 2, canvas.height / 2);
                    return;
                }

                const labels = history.map(h => h.date);
                const totalAssets = history.map(h => h.total_assets);
                const dailyPnls = history.map(h => h.daily_pnl);
                // Color bars green/red based on pnl sign
                const barColors = dailyPnls.map(v => v >= 0 ? 'rgba(74, 222, 128, 0.7)' : 'rgba(248, 113, 113, 0.7)');
                const barBorders = dailyPnls.map(v => v >= 0 ? 'rgba(74, 222, 128, 1)' : 'rgba(248, 113, 113, 1)');

                const ctx = document.getElementById('equityChart').getContext('2d');

                if (equityChart) {
                    equityChart.destroy();
                }

                equityChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: '每日盈亏 ($)',
                                data: dailyPnls,
                                backgroundColor: barColors,
                                borderColor: barBorders,
                                borderWidth: 1,
                                order: 2,
                                yAxisID: 'y1',
                            },
                            {
                                label: '总资产 ($)',
                                data: totalAssets,
                                type: 'line',
                                borderColor: '#58a6ff',
                                backgroundColor: 'rgba(88, 166, 255, 0.08)',
                                borderWidth: 2.5,
                                pointRadius: 3,
                                pointBackgroundColor: '#58a6ff',
                                pointBorderColor: '#58a6ff',
                                tension: 0.35,
                                fill: true,
                                order: 1,
                                yAxisID: 'y',
                            },
                        ],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        plugins: {
                            legend: {
                                position: 'top',
                                labels: {
                                    color: '#8b949e',
                                    usePointStyle: true,
                                    padding: 20,
                                    font: { size: 12 },
                                },
                            },
                            tooltip: {
                                backgroundColor: '#161b22',
                                borderColor: '#30363d',
                                borderWidth: 1,
                                titleColor: '#e6edf3',
                                bodyColor: '#e6edf3',
                                callbacks: {
                                    label: function(ctx) {
                                        return ctx.dataset.label + ': $' + ctx.parsed.y.toLocaleString('en-US', { minimumFractionDigits: 2 });
                                    },
                                },
                            },
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(48, 54, 61, 0.4)' },
                                ticks: { color: '#8b949e', font: { size: 11 } },
                            },
                            y: {
                                type: 'linear',
                                position: 'left',
                                title: {
                                    display: true,
                                    text: '总资产 ($)',
                                    color: '#58a6ff',
                                },
                                grid: { color: 'rgba(48, 54, 61, 0.4)' },
                                ticks: {
                                    color: '#8b949e',
                                    font: { size: 11 },
                                    callback: function(v) { return '$' + v.toLocaleString('en-US'); },
                                },
                            },
                            y1: {
                                type: 'linear',
                                position: 'right',
                                title: {
                                    display: true,
                                    text: '每日盈亏 ($)',
                                    color: '#8b949e',
                                },
                                grid: { drawOnChartArea: false },
                                ticks: {
                                    color: '#8b949e',
                                    font: { size: 11 },
                                    callback: function(v) { return '$' + v.toLocaleString('en-US'); },
                                },
                            },
                        },
                    },
                });
            } catch (e) {
                console.error('加载权益曲线失败:', e);
                const canvas = document.getElementById('equityChart');
                const ctx = canvas.getContext('2d');
                ctx.font = '14px sans-serif';
                ctx.fillStyle = '#f87171';
                ctx.textAlign = 'center';
                ctx.fillText('加载失败', canvas.width / 2, canvas.height / 2);
            }
        }

        // ══════════════════════════════════════════════════════════════
        // SECTION 2 — EXIT TYPE & DIRECTION PERFORMANCE
        // ══════════════════════════════════════════════════════════════
        function buildExitTypeTable(trades) {
            const groups = {};
            for (const t of trades) {
                const reason = t.exit_reason || '未知';
                if (!groups[reason]) {
                    groups[reason] = { count: 0, wins: 0, total_pnl: 0 };
                }
                groups[reason].count++;
                groups[reason].total_pnl += (t.pnl || 0);
                if ((t.pnl || 0) > 0) groups[reason].wins++;
            }

            const entries = Object.entries(groups).sort((a, b) => b[1].total_pnl - a[1].total_pnl);

            if (entries.length === 0) {
                document.getElementById('exit-type-table').innerHTML =
                    '<tr><td colspan="4" class="loading-text">暂无数据</td></tr>';
                return;
            }

            document.getElementById('exit-type-table').innerHTML = entries.map(([reason, g]) => {
                const wr = g.count > 0 ? (g.wins / g.count * 100).toFixed(1) : '0.0';
                const pnlClass = g.total_pnl >= 0 ? 'pnl-green' : 'pnl-red';
                const pnlSign = g.total_pnl >= 0 ? '+' : '';
                return `
                    <tr>
                        <td><strong>${escHtml(reason)}</strong></td>
                        <td>${g.count}</td>
                        <td class="${pnlClass}">${pnlSign}$${g.total_pnl.toFixed(2)}</td>
                        <td>${wr}%</td>
                    </tr>`;
            }).join('');
        }

        function buildDirCompare(trades) {
            const groups = { LONG: { count: 0, wins: 0, total_pnl: 0 }, SHORT: { count: 0, wins: 0, total_pnl: 0 } };
            for (const t of trades) {
                const dir = t.direction || 'LONG';
                if (!groups[dir]) groups[dir] = { count: 0, wins: 0, total_pnl: 0 };
                groups[dir].count++;
                groups[dir].total_pnl += (t.pnl || 0);
                if ((t.pnl || 0) > 0) groups[dir].wins++;
            }

            const long = groups['LONG'] || { count: 0, wins: 0, total_pnl: 0 };
            const short = groups['SHORT'] || { count: 0, wins: 0, total_pnl: 0 };
            const maxCount = Math.max(long.count, short.count, 1);

            const longWR = long.count > 0 ? (long.wins / long.count * 100).toFixed(1) : '—';
            const shortWR = short.count > 0 ? (short.wins / short.count * 100).toFixed(1) : '—';

            document.getElementById('dir-compare-area').innerHTML = `
                <div class="dir-compare">
                    <div class="dir-col">
                        <div class="dir-label long">📈 做多 LONG</div>
                        <div class="dir-stat">交易数</div>
                        <div class="dir-val long">${long.count}</div>
                        <div class="dir-stat">胜率</div>
                        <div class="dir-val long">${longWR}%</div>
                        <div class="dir-stat">总盈亏</div>
                        <div class="dir-val ${long.total_pnl >= 0 ? 'positive' : 'negative'}">$${long.total_pnl.toFixed(2)}</div>
                        <div class="dir-bar"><div class="dir-bar-fill long" style="width:${(long.count / maxCount * 100).toFixed(0)}%"></div></div>
                    </div>
                    <div class="dir-col">
                        <div class="dir-label short">📉 做空 SHORT</div>
                        <div class="dir-stat">交易数</div>
                        <div class="dir-val short">${short.count}</div>
                        <div class="dir-stat">胜率</div>
                        <div class="dir-val short">${shortWR}%</div>
                        <div class="dir-stat">总盈亏</div>
                        <div class="dir-val ${short.total_pnl >= 0 ? 'positive' : 'negative'}">$${short.total_pnl.toFixed(2)}</div>
                        <div class="dir-bar"><div class="dir-bar-fill short" style="width:${(short.count / maxCount * 100).toFixed(0)}%"></div></div>
                    </div>
                </div>`;
        }

        // ══════════════════════════════════════════════════════════════
        // SECTION 3 — TRADE HISTORY TABLE
        // ══════════════════════════════════════════════════════════════
        async function loadAllTrades() {
            try {
                // Load a large batch to have data for both table + section 2 aggregations
                const resp = await fetch(`${API_BASE}/api/trades?limit=500`);
                const data = await resp.json();
                allTrades = (data.trades || []).map(t => ({
                    ...t,
                    signal_strength: t.signal_strength !== undefined ? t.signal_strength : null,
                    signal_confidence: t.signal_confidence !== undefined ? t.signal_confidence : null,
                }));
            } catch (e) {
                console.error('加载交易记录失败:', e);
                allTrades = [];
            }

            // Build section 2 (exit type + direction) from full dataset
            buildExitTypeTable(allTrades);
            buildDirCompare(allTrades);

            // Reset display
            displayOffset = 0;
            renderTradeTable();
        }

        function applyFilters() {
            displayOffset = 0;
            renderTradeTable();
        }

        function getFilteredTrades() {
            const dateRange = parseInt(document.getElementById('date-range').value);
            const dirFilter = document.getElementById('dir-filter').value;

            let filtered = [...allTrades];

            // Date range filter
            if (dateRange > 0) {
                const cutoff = new Date();
                cutoff.setDate(cutoff.getDate() - dateRange);
                const cutoffStr = cutoff.toISOString().slice(0, 10);
                filtered = filtered.filter(t => (t.trade_date || '') >= cutoffStr);
            }

            // Direction filter
            if (dirFilter) {
                filtered = filtered.filter(t => t.direction === dirFilter);
            }

            // Sort
            const sf = currentSort.field;
            filtered.sort((a, b) => {
                let va = a[sf], vb = b[sf];
                if (sf === 'trade_date') {
                    va = va || '';
                    vb = vb || '';
                } else if (sf === 'pnl' || sf === 'entry_price' || sf === 'exit_price' || sf === 'signal_confidence') {
                    va = parseFloat(va) || 0;
                    vb = parseFloat(vb) || 0;
                } else if (sf === 'signal_strength') {
                    va = parseInt(va) || 0;
                    vb = parseInt(vb) || 0;
                } else {
                    va = (va || '').toString();
                    vb = (vb || '').toString();
                }
                if (va < vb) return currentSort.asc ? -1 : 1;
                if (va > vb) return currentSort.asc ? 1 : -1;
                return 0;
            });

            return filtered;
        }

        function renderTradeTable() {
            const filtered = getFilteredTrades();
            const slice = filtered.slice(0, displayOffset + PAGE_SIZE);
            const hasMore = slice.length < filtered.length;

            if (slice.length === 0) {
                document.getElementById('trade-history-table').innerHTML =
                    '<tr><td colspan="9" class="loading-text">暂无交易记录</td></tr>';
                document.getElementById('load-more-btn').style.display = 'none';
                return;
            }

            document.getElementById('trade-history-table').innerHTML = slice.map(t => {
                const dirClass = (t.direction || '').toUpperCase() === 'SHORT' ? 'short' : 'long';
                const dirLabel = (t.direction || '').toUpperCase() === 'SHORT' ? '做空' : '做多';
                const pnlClass = (t.pnl || 0) >= 0 ? 'positive' : 'negative';
                const pnlSign = (t.pnl || 0) >= 0 ? '+' : '';
                const ss = t.signal_strength != null ? t.signal_strength : 'N/A';
                const sc = t.signal_confidence != null ? (t.signal_confidence * 100).toFixed(0) + '%' : 'N/A';

                return `
                    <tr>
                        <td>${escHtml(t.trade_date || '')}</td>
                        <td><strong>${escHtml(t.symbol || '')}</strong></td>
                        <td class="${dirClass}">${dirLabel}</td>
                        <td>$${fmtNum(t.entry_price)}</td>
                        <td>$${fmtNum(t.exit_price)}</td>
                        <td class="${pnlClass}">${pnlSign}$${fmtNum(Math.abs(t.pnl || 0))}</td>
                        <td><span class="muted">${escHtml(t.exit_reason || '—')}</span></td>
                        <td>${ss}</td>
                        <td>${sc}</td>
                    </tr>`;
            }).join('');

            document.getElementById('load-more-btn').style.display = hasMore ? 'block' : 'none';
            // Update sort arrows
            updateSortHeaders();
        }

        function loadMoreTrades() {
            displayOffset += PAGE_SIZE;
            const filtered = getFilteredTrades();
            const slice = filtered.slice(0, displayOffset + PAGE_SIZE);
            const hasMore = slice.length < filtered.length;

            // Re-render full visible set
            renderTradeTable();
            document.getElementById('load-more-btn').style.display = hasMore ? 'block' : 'none';
        }

        function toggleSort(field) {
            if (currentSort.field === field) {
                currentSort.asc = !currentSort.asc;
            } else {
                currentSort.field = field;
                currentSort.asc = false;
            }
            displayOffset = 0;
            renderTradeTable();
        }

        function updateSortHeaders() {
            document.querySelectorAll('th.sortable').forEach(th => {
                const f = th.getAttribute('data-sort');
                th.classList.remove('sorted');
                const arrow = th.querySelector('.sort-arrow');
                if (arrow) arrow.textContent = '▼';
                if (f === currentSort.field) {
                    th.classList.add('sorted');
                    if (arrow) arrow.textContent = currentSort.asc ? '▲' : '▼';
                }
            });
        }

        // ══════════════════════════════════════════════════════════════
        // HELPERS
        // ══════════════════════════════════════════════════════════════
        function fmtNum(v) {
            if (v === null || v === undefined || isNaN(v)) return '—';
            return parseFloat(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function escHtml(s) {
            if (!s) return '';
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(s));
            return div.innerHTML;
        }

        // ══════════════════════════════════════════════════════════════
        // INIT + AUTO-REFRESH
        // ══════════════════════════════════════════════════════════════
        async function initAll() {
            await Promise.all([
                loadEquityCurve(),
                loadAllTrades(),
            ]);
        }

        function startAutoRefresh() {
            // Refresh equity curve + trade data every 60 seconds
            setInterval(async () => {
                await Promise.all([
                    loadEquityCurve(),
                    loadAllTrades(),
                ]);
            }, 60000);
        }

        // Kick off
        initAll();
        startAutoRefresh();
    </script>
</body>
</html>
