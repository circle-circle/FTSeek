<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ title }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #e1e4e8; font-size: 14px; }

        /* ── NAV ── */
        .top-nav { background: #161b22; border-bottom: 1px solid #30363d; padding: 0 16px; display: flex; align-items: center; position: sticky; top: 0; z-index: 50; }
        .top-nav .brand { color: #58a6ff; font-weight: 700; font-size: 14px; padding: 10px 12px 10px 0; border-right: 1px solid #30363d; margin-right: 8px; }
        .top-nav a { color: #8b949e; text-decoration: none; padding: 10px 14px; font-size: 13px; border-bottom: 2px solid transparent; }
        .top-nav a:hover { color: #e1e4e8; }
        .top-nav a.active { color: #58a6ff; border-bottom-color: #58a6ff; }
        .top-nav .spacer { flex: 1; }
        .top-nav .mode-tag { font-size: 11px; padding: 3px 8px; border-radius: 4px; margin-left: 8px; }
        .top-nav .mode-tag.sim { background: #1a3a2a; color: #4ade80; }
        .top-nav .mode-tag.live { background: #3a1a1a; color: #f87171; }
        .top-nav .mode-tag.live_conservative { background: #3a1a1a; color: #fbbf24; }
        .market-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; margin-left: 6px; font-weight: 600; }
        .market-badge.closed { background: #2a0a0a; color: #f87171; }
        .market-badge.pre { background: #2a1f0a; color: #fbbf24; }
        .market-badge.open { background: #0a2a1a; color: #4ade80; }
        .market-badge.after { background: #1a1020; color: #fb923c; }
        .last-updated { font-size: 10px; color: #484f58; margin-left: 8px; }

        /* ── CONTAINER ── */
        .container { max-width: 1200px; margin: 0 auto; padding: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .card h2 { font-size: 15px; margin-bottom: 12px; color: #58a6ff; display: flex; align-items: center; justify-content: space-between; }

        /* ── METRICS ── */
        .metric { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; text-align: center; }
        .metric .label { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
        .metric .value { font-size: 18px; font-weight: 700; margin-top: 3px; }
        .metric .sub { font-size: 11px; color: #8b949e; margin-top: 2px; }
        .green { color: #4ade80; }
        .yellow { color: #fbbf24; }
        .orange { color: #fb923c; }
        .red { color: #f87171; }
        .long { color: #4ade80; }
        .short { color: #f87171; }
        .amber { color: #fbbf24; }

        /* ── STATUS BAR ── */
        .status-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .status-bar .metric { flex: 1; min-width: 140px; padding: 10px 12px; }
        .status-bar .metric .value { font-size: 16px; }
        .status-bar .metric .label { white-space: nowrap; }

        /* ── POSITIONS TABLE ── */
        .pos-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .pos-table th { text-align: left; padding: 8px 6px; color: #8b949e; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #30363d; white-space: nowrap; }
        .pos-table td { padding: 8px 6px; border-bottom: 1px solid #21262d; white-space: nowrap; }
        .pos-table tr:last-child td { border-bottom: none; }
        .pos-table .sym { font-weight: 700; }
        .pos-table .pnl-pos { color: #4ade80; }
        .pos-table .pnl-neg { color: #f87171; }
        .pos-table .sl-warn { color: #fbbf24; }
        .pos-table .sl-danger { color: #f87171; }
        .pos-table .sl-safe { color: #4ade80; }
        .btn-close { padding: 3px 8px; border: 1px solid #30363d; border-radius: 4px; background: #0d1117; color: #8b949e; cursor: pointer; font-size: 11px; }
        .btn-close:hover { border-color: #f87171; color: #f87171; }

        /* ── TRADE/STRATEGY ROWS ── */
        .trade-row { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #21262d; font-size: 13px; gap: 10px; }
        .trade-row:last-child { border-bottom: none; }
        .trade-row .sym { font-weight: 700; width: 75px; }
        .trade-row .reason { flex: 1; color: #8b949e; font-size: 12px; }
        .trade-row .pnl { width: 80px; text-align: right; font-weight: 600; }
        .strat-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #21262d; gap: 12px; font-size: 13px; }
        .strat-row:last-child { border-bottom: none; }
        .strat-row .name { flex: 1; font-weight: 600; min-width: 80px; }
        .strat-row .stat { text-align: right; min-width: 55px; }
        .strat-row .stat .v { font-weight: 700; font-size: 14px; }
        .strat-row .stat .l { color: #8b949e; font-size: 10px; }

        /* ── PROGRESS BAR ── */
        .pbar-wrap { flex: 1; min-width: 60px; margin: 0 4px; }
        .pbar { height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; }
        .pbar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
        .pbar-fill.g { background: #22c55e; }
        .pbar-fill.r { background: #ef4444; }

        /* ── SUMMARY ── */
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .summary-item { background: #0d1117; border-radius: 6px; padding: 8px; text-align: center; }
        .summary-item .l { font-size: 10px; color: #8b949e; }
        .summary-item .v { font-size: 15px; font-weight: 700; margin-top: 2px; }

        /* ── CHART ── */
        .chart-wrap { position: relative; height: 260px; }
        canvas { width: 100% !important; }

        /* ── BUTTONS ── */
        .btn { padding: 5px 10px; border: 1px solid #30363d; border-radius: 5px; background: #0d1117; color: #8b949e; cursor: pointer; font-size: 12px; }
        .btn:hover { border-color: #58a6ff; color: #58a6ff; }
        .loading { text-align: center; padding: 20px; color: #8b949e; }
        .empty-state { text-align: center; padding: 20px; color: #8b949e; font-size: 13px; }

        /* ── MOBILE ── */
        @media (max-width: 768px) {
            .top-nav { overflow-x: auto; }
            .top-nav .brand { display: none; }
            .top-nav a { padding: 8px 10px; font-size: 12px; }
            .grid-2 { grid-template-columns: 1fr; }
            .status-bar { flex-direction: column; }
            .summary-grid { grid-template-columns: repeat(3, 1fr); }
            .pos-table { font-size: 12px; }
            .pos-table th, .pos-table td { padding: 5px 3px; }
            .chart-wrap { height: 200px; }
            .strat-row .pbar-wrap { display: none; }
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <span class="brand">FTSeek-US</span>
        <a href="/" class="active">指挥中心</a>
        <a href="/trade">交易</a>
        <a href="/review">分析</a>
        <a href="/system">系统</a>
        <span class="spacer"></span>
        <span class="market-badge" id="marketBadge">🔴 休市</span>
        <span class="mode-tag {{ 'live' if is_live else 'sim' }}" id="modeTag">{{ '🔴 实盘' if is_live else '🟢 模拟' }}</span>
        <span class="last-updated" id="lastUpdated">上次刷新: --</span>
    </div>

    <div class="container">
        <!-- SECTION 1 - TOP STATUS BAR -->
        <div class="status-bar" id="statusBar">
            <div class="metric"><div class="label">📈 总资产</div><div class="value" id="sTotalAssets">--</div></div>
            <div class="metric"><div class="label">💵 现金</div><div class="value" id="sCash">--</div></div>
            <div class="metric"><div class="label">📊 市值</div><div class="value" id="sMarketVal">--</div></div>
            <div class="metric"><div class="label">⚡ 购买力</div><div class="value" id="sPower">--</div></div>
            <div class="metric"><div class="label">💰 日盈亏</div><div class="value" id="sPnl">--</div></div>
            <div class="metric"><div class="label">⚠️ 保证金</div><div class="value" id="sMargin">--</div></div>
            <div class="metric"><div class="label green">📈 多头MV</div><div class="value long" id="sLongMv">--</div></div>
            <div class="metric"><div class="label red">📉 空头MV</div><div class="value short" id="sShortMv">--</div></div>
            <div class="metric"><div class="label">⚖️ 净敞口</div><div class="value" id="sNetRatio">--</div></div>
        </div>

        <!-- SECTION 2 - POSITIONS TABLE -->
        <div class="card">
            <h2>📊 持仓列表 <span style="font-size:12px;color:#8b949e;font-weight:normal" id="posCount"></span></h2>
            <div style="overflow-x:auto;">
                <table class="pos-table">
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>Dir</th>
                            <th>Qty</th>
                            <th>成本</th>
                            <th>现价</th>
                            <th>PnL$</th>
                            <th>PnL%</th>
                            <th>SL距离</th>
                            <th>Owner</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="positionsTbody">
                        <tr><td colspan="10" class="loading">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- SECTION 3 - TWO COLUMNS -->
        <div class="grid-2">
            <!-- LEFT: Today's Trades -->
            <div class="card">
                <h2>📋 今日交易</h2>
                <div id="todayTradesSummary"></div>
                <div id="todayTradesList"><div class="loading">加载中...</div></div>
            </div>

            <!-- RIGHT: Strategy Performance (7-day) -->
            <div class="card">
                <h2>📈 策略表现 (7日)</h2>
                <div id="strategyPerf"><div class="loading">加载中...</div></div>
            </div>
        </div>

        <!-- SECTION 4 - EQUITY CURVE -->
        <div class="card">
            <h2>📈 资金曲线 (近30日) <button class="btn" onclick="loadAll()">🔄 刷新</button></h2>
            <div class="chart-wrap">
                <canvas id="equityChart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        Chart.defaults.color = '#8b949e';
        Chart.defaults.borderColor = '#21262d';
        let equityChart = null;

        function fmt(n, d) { d = d || 2; return n == null || isNaN(n) ? '--' : Number(n).toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d}); }
        function fmtK(n) { return Math.abs(n) >= 1000 ? (n / 1000).toFixed(1) + 'K' : n.toFixed(0); }

        // ── MARKET STATUS ──
        function updateMarketStatus() {
            const now = new Date();
            const et = new Date(now.toLocaleString('en-US', {timeZone: 'America/New_York'}));
            const h = et.getHours(), m = et.getMinutes(), t = h * 60 + m;
            const preOpen = 4 * 60, mktOpen = 9 * 60 + 30, mktClose = 16 * 60, afterClose = 20 * 60;
            let cls, icon, label;
            if (t >= preOpen && t < mktOpen) { cls = 'pre'; icon = '🟡'; label = '盘前'; }
            else if (t >= mktOpen && t < mktClose) { cls = 'open'; icon = '🟢'; label = '盘中'; }
            else if (t >= mktClose && t < afterClose) { cls = 'after'; icon = '🟠'; label = '盘后'; }
            else { cls = 'closed'; icon = '🔴'; label = '休市'; }
            const badge = document.getElementById('marketBadge');
            badge.className = 'market-badge ' + cls;
            badge.textContent = icon + ' ' + label;
        }

        function updateLastUpdated() {
            const ts = new Date().toLocaleTimeString('zh-CN', {hour12: false});
            document.getElementById('lastUpdated').textContent = '上次刷新: ' + ts;
        }

        function fmtPct(n) { return n == null || isNaN(n) ? '--' : (n >= 0 ? '+' : '') + n.toFixed(2) + '%'; }

        // ── MAIN LOAD ──
        async function loadAll() {
            try {
                const [riskRes, pnlRes, liveAccRes, stratRes, statsRes, tradesRes] = await Promise.all([
                    fetch('/api/risk/status'),
                    fetch('/api/risk/pnl-history?days=30'),
                    fetch('/api/live-account'),
                    fetch('/api/strategy/status'),
                    fetch('/api/stats'),
                    fetch('/api/trades?limit=200'),
                ]);
                const risk = await riskRes.json();
                const pnlHist = await pnlRes.json();
                const liveAcc = await liveAccRes.json();
                const strat = await stratRes.json();
                const stats = await statsRes.json();
                const trades = await tradesRes.json();

                renderStatusBar(risk);
                renderModeTag(risk);
                renderPositions(liveAcc, risk);
                renderTodayTrades(trades.trades || []);
                renderStrategyPerf(strat.weekly || []);
                renderEquityChart(pnlHist);
            } catch (e) {
                console.error('Load failed:', e);
            }
            updateLastUpdated();
        }

        // ── SECTION 1: STATUS BAR ──
        function renderStatusBar(risk) {
            const a = risk.account || {};
            const p = risk.pnl || {};
            const m = risk.margin || {};
            const e = risk.exposure || {};

            const totalAssets = a.total_assets || 0;
            const cash = a.cash || 0;
            const mktVal = a.market_val || 0;
            const power = a.power || 0;

            document.getElementById('sTotalAssets').textContent = '$' + fmtK(totalAssets);
            document.getElementById('sTotalAssets').className = 'value';
            document.getElementById('sCash').textContent = '$' + fmtK(cash);
            document.getElementById('sCash').className = 'value';
            document.getElementById('sMarketVal').textContent = '$' + fmtK(mktVal);
            document.getElementById('sMarketVal').className = 'value';
            document.getElementById('sPower').textContent = '$' + fmtK(power);
            document.getElementById('sPower').className = 'value';

            const dailyPnL = p.total || 0;
            const pnlEl = document.getElementById('sPnl');
            pnlEl.textContent = (dailyPnL >= 0 ? '+' : '') + '$' + fmt(dailyPnL);
            pnlEl.className = 'value ' + (dailyPnL >= 0 ? 'green' : 'red');

            const marginPct = m.usage_pct || 0;
            const mEl = document.getElementById('sMargin');
            mEl.textContent = marginPct.toFixed(1) + '%';
            mEl.className = 'value ' + (marginPct > 70 ? 'red' : marginPct > 50 ? 'yellow' : 'green');

            const longMv = e.long_mv || 0;
            const shortMv = e.short_mv || 0;
            const netRatio = e.net_ratio || 0;
            document.getElementById('sLongMv').textContent = '$' + fmtK(longMv);
            document.getElementById('sShortMv').textContent = '$' + fmtK(shortMv);

            const nrEl = document.getElementById('sNetRatio');
            nrEl.textContent = (netRatio >= 0 ? '+' : '') + netRatio.toFixed(1) + '%';
            nrEl.className = 'value ' + (netRatio > 20 ? 'long' : netRatio < -20 ? 'short' : 'yellow');
        }

        // ── MODE TAG ──
        function renderModeTag(risk) {
            const tag = document.getElementById('modeTag');
            const mode = risk.mode || '';
            const isLive = risk.is_live;

            tag.className = 'mode-tag';
            if (isLive && mode.includes('保守')) {
                tag.className += ' live_conservative';
                tag.textContent = '🟡 实盘保守';
            } else if (isLive) {
                tag.className += ' live';
                tag.textContent = '🔴 实盘';
            } else {
                tag.className += ' sim';
                tag.textContent = '🟢 模拟';
            }
        }

        // ── SECTION 2: POSITIONS TABLE ──
        function renderPositions(liveAcc, risk) {
            const livePositions = liveAcc.positions || [];
            const stopDists = risk.stop_distances || [];
            const tbody = document.getElementById('positionsTbody');
            const countEl = document.getElementById('posCount');

            if (!livePositions.length) {
                tbody.innerHTML = '<tr><td colspan="10" class="empty-state">暂无持仓</td></tr>';
                countEl.textContent = '';
                return;
            }

            countEl.textContent = livePositions.length + ' 个持仓';

            // Build stop distance lookup by symbol+direction
            const slMap = {};
            stopDists.forEach(s => {
                const key = (s.symbol || '') + '|' + (s.direction || '');
                slMap[key] = s;
            });

            tbody.innerHTML = livePositions.map(pos => {
                const sym = pos.code || pos.symbol || '--';
                const qty = Math.abs(pos.qty || pos.quantity || 0);
                const isLong = (pos.qty || pos.quantity || 0) > 0;
                const dir = isLong ? 'LONG' : 'SHORT';
                const cost = pos.cost_price || pos.entry_price || 0;
                const cur = pos.cur_price || pos.current_price || 0;
                const upnl = pos.unrealized_pl || pos.unrealized_pnl || 0;
                const owner = (pos.owner || 'auto');

                // PnL%
                let pnlPct = 0;
                if (cost > 0 && cur > 0) {
                    pnlPct = isLong ? ((cur - cost) / cost * 100) : ((cost - cur) / cost * 100);
                }

                const pnlCls = upnl >= 0 ? 'pnl-pos' : 'pnl-neg';

                // SL distance from risk data
                const slKey = sym + '|' + dir;
                const slData = slMap[slKey];
                let slDistHtml = '--';
                if (slData && slData.sl_distance_pct != null) {
                    const dist = slData.sl_distance_pct;
                    let slCls = 'sl-safe';
                    if (dist < 2) slCls = 'sl-danger';
                    else if (dist < 5) slCls = 'sl-warn';
                    const dangerTag = slData.danger ? ' ⚠' : '';
                    slDistHtml = '<span class="' + slCls + '">' + dist.toFixed(1) + '%' + dangerTag + '</span>';
                }

                // Owner icon
                const ownerIcon = (owner === 'manual' || owner === 'user') ? '👤' : '🤖';

                return '<tr>' +
                    '<td class="sym"><a href="/stock/' + sym + '" style="color:#58a6ff;text-decoration:none">' + sym.replace(/^US\./, '') + '</a></td>' +
                    '<td class="' + (isLong ? 'long' : 'short') + '">' + dir + '</td>' +
                    '<td>' + qty + '</td>' +
                    '<td>$' + fmt(cost) + '</td>' +
                    '<td>$' + fmt(cur) + '</td>' +
                    '<td class="' + pnlCls + '">' + (upnl >= 0 ? '+' : '') + '$' + fmt(upnl) + '</td>' +
                    '<td class="' + pnlCls + '">' + fmtPct(pnlPct) + '</td>' +
                    '<td>' + slDistHtml + '</td>' +
                    '<td style="font-size:16px">' + ownerIcon + '</td>' +
                    '<td><button class="btn-close" onclick="navigateTrade(\'' + sym + '\')" title="前往交易页操作">平仓</button></td>' +
                    '</tr>';
            }).join('');
        }

        // ── SECTION 3a: TODAY'S TRADES ──
        function renderTodayTrades(trades) {
            const listEl = document.getElementById('todayTradesList');
            const summaryEl = document.getElementById('todayTradesSummary');

            // Filter to today (ET)
            const now = new Date();
            const et = new Date(now.toLocaleString('en-US', {timeZone: 'America/New_York'}));
            const todayStr = et.toISOString().slice(0, 10);

            const todayTrades = trades.filter(t => (t.trade_date || '').startsWith(todayStr));

            if (!todayTrades.length) {
                summaryEl.innerHTML = '';
                listEl.innerHTML = '<div class="empty-state">今日暂无交易</div>';
                return;
            }

            const wins = todayTrades.filter(t => (t.pnl || 0) > 0).length;
            const totalPnL = todayTrades.reduce((s, t) => s + (t.pnl || 0), 0);
            const winRate = todayTrades.length > 0 ? (wins / todayTrades.length * 100) : 0;

            summaryEl.innerHTML = '<div class="summary-grid">' +
                '<div class="summary-item"><div class="l">总交易</div><div class="v">' + todayTrades.length + '</div></div>' +
                '<div class="summary-item"><div class="l">总盈亏</div><div class="v ' + (totalPnL >= 0 ? 'green' : 'red') + '">' + (totalPnL >= 0 ? '+' : '') + '$' + fmt(totalPnL) + '</div></div>' +
                '<div class="summary-item"><div class="l">胜率</div><div class="v">' + winRate.toFixed(1) + '%</div></div>' +
                '</div>';

            // Show up to 15 most recent trades
            const display = todayTrades.slice(-15).reverse();
            listEl.innerHTML = display.map(t => {
                const pnlCls = (t.pnl || 0) >= 0 ? 'green' : 'red';
                const sym = (t.symbol || '').replace(/^US\./, '');
                const dir = t.direction || '';
                const reason = t.exit_reason || '--';
                return '<div class="trade-row">' +
                    '<span class="sym ' + (dir === 'LONG' ? 'long' : 'short') + '">' + sym + '</span>' +
                    '<span class="reason">' + reason + '</span>' +
                    '<span class="pnl ' + pnlCls + '">' + ((t.pnl || 0) >= 0 ? '+' : '') + '$' + fmt(t.pnl) + '</span>' +
                    '</div>';
            }).join('');

            if (todayTrades.length > 15) {
                listEl.innerHTML += '<div style="text-align:center;color:#484f58;font-size:11px;padding:8px">... 还有 ' + (todayTrades.length - 15) + ' 笔</div>';
            }
        }

        // ── SECTION 3b: STRATEGY PERFORMANCE (7-DAY) ──
        function renderStrategyPerf(weekly) {
            const el = document.getElementById('strategyPerf');
            if (!weekly || !weekly.length) {
                el.innerHTML = '<div class="empty-state">近7日暂无数据</div>';
                return;
            }

            // Find max pnl for progress bar scaling
            const maxAbsPnL = Math.max(1, ...weekly.map(s => Math.abs(s.pnl || 0)));

            el.innerHTML = weekly.map(s => {
                const pnlCls = (s.pnl || 0) >= 0 ? 'green' : 'red';
                const barW = Math.min(100, Math.abs(s.pnl || 0) / maxAbsPnL * 100);
                const barCls = (s.pnl || 0) >= 0 ? 'g' : 'r';
                return '<div class="strat-row">' +
                    '<div class="name">' + (s.name || 'unknown') + '</div>' +
                    '<div class="pbar-wrap"><div class="pbar"><div class="pbar-fill ' + barCls + '" style="width:' + barW + '%"></div></div></div>' +
                    '<div class="stat"><div class="v">' + s.trades + '</div><div class="l">笔</div></div>' +
                    '<div class="stat"><div class="v">' + (s.win_rate || 0).toFixed(0) + '%</div><div class="l">胜率</div></div>' +
                    '<div class="stat"><div class="v ' + pnlCls + '">' + ((s.pnl || 0) >= 0 ? '+' : '') + '$' + fmtK(s.pnl) + '</div><div class="l">盈亏</div></div>' +
                    '</div>';
            }).join('');
        }

        // ── SECTION 4: EQUITY CURVE ──
        function renderEquityChart(data) {
            const history = data.equity_history || [];
            const ctx = document.getElementById('equityChart').getContext('2d');
            if (equityChart) equityChart.destroy();

            if (!history.length) {
                return;
            }

            equityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: history.map(h => h.date),
                    datasets: [{
                        label: '总资产',
                        data: history.map(h => h.total_assets),
                        borderColor: '#58a6ff',
                        backgroundColor: 'rgba(88,166,255,0.1)',
                        fill: true, tension: 0.3, pointRadius: 2, yAxisID: 'y',
                    }, {
                        label: '日盈亏',
                        data: history.map(h => h.daily_pnl),
                        type: 'bar',
                        backgroundColor: history.map(h => (h.daily_pnl || 0) >= 0 ? 'rgba(34,197,94,0.5)' : 'rgba(239,68,68,0.5)'),
                        borderRadius: 2, yAxisID: 'y1',
                    }],
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { intersect: false, mode: 'index' },
                    plugins: { legend: { display: true, labels: { boxWidth: 12, font: { size: 11 }, usePointStyle: true } } },
                    scales: {
                        x: { grid: { display: false } },
                        y: { position: 'left', grid: { color: '#21262d' }, title: { display: true, text: '总资产 (USD)', font: { size: 10 } } },
                        y1: { position: 'right', grid: { display: false }, title: { display: true, text: '日盈亏 (USD)', font: { size: 10 } } },
                    },
                },
            });
        }

        // ── NAVIGATION ──
        function navigateTrade(symbol) {
            window.location.href = '/trade?symbol=' + encodeURIComponent(symbol);
        }

        // ── INIT ──
        updateMarketStatus();
        loadAll();
        setInterval(loadAll, 30000);
        setInterval(updateMarketStatus, 30000);
    </script>
</body>
</html>
