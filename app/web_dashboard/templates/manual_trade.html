<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ title }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #e1e4e8; }

        /* Mode bar */
        .mode-bar { padding: 8px 20px; text-align: center; font-weight: 700; font-size: 14px; letter-spacing: 2px; }
        .mode-bar.simulate { background: #1a3a2a; color: #4ade80; border-bottom: 2px solid #22c55e; }
        .mode-bar.live { background: #3a1a1a; color: #f87171; border-bottom: 2px solid #ef4444; }

        .container { max-width: 900px; margin: 0 auto; padding: 20px; }

        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .card h2 { font-size: 18px; margin-bottom: 16px; color: #58a6ff; }

        /* Form */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full-width { grid-column: 1 / -1; }
        label { font-size: 13px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
        input, select, textarea {
            background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
            padding: 12px 14px; color: #e1e4e8; font-size: 15px; outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: #58a6ff; }
        textarea { resize: vertical; min-height: 60px; }

        /* Direction buttons */
        .direction-group { display: flex; gap: 8px; }
        .dir-btn { flex: 1; padding: 14px; border: 2px solid #30363d; border-radius: 8px;
                   background: #0d1117; color: #8b949e; font-size: 16px; font-weight: 700;
                   cursor: pointer; text-align: center; transition: all 0.2s; }
        .dir-btn:hover { border-color: #58a6ff; }
        .dir-btn.active.long { border-color: #22c55e; background: #0a2a1a; color: #4ade80; }
        .dir-btn.active.short { border-color: #ef4444; background: #2a0a0a; color: #f87171; }

        /* Quote display */
        .quote-box { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin: 12px 0; }
        .quote-price { font-size: 28px; font-weight: 700; }
        .quote-price.up { color: #4ade80; }
        .quote-price.down { color: #f87171; }
        .quote-detail { font-size: 13px; color: #8b949e; margin-top: 4px; }

        /* Buttons */
        .btn-group { display: flex; gap: 12px; margin-top: 20px; }
        .btn { padding: 14px 28px; border: none; border-radius: 8px; font-size: 16px;
               font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn:hover { transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-buy { background: #22c55e; color: #000; }
        .btn-sell { background: #ef4444; color: #fff; }
        .btn-ghost { background: transparent; border: 1px solid #30363d; color: #8b949e; }

        /* Confirmation modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                         background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #161b22; border: 1px solid #30363d; border-radius: 12px;
                 padding: 32px; max-width: 500px; width: 90%; }
        .modal h3 { color: #f87171; margin-bottom: 16px; }
        .modal .order-summary { background: #0d1117; border-radius: 8px; padding: 16px; margin: 16px 0; font-family: monospace; }
        .modal .order-summary div { padding: 4px 0; }

        /* Result */
        .result { padding: 16px; border-radius: 8px; margin-top: 16px; display: none; }
        .result.success { background: #0a2a1a; border: 1px solid #22c55e; color: #4ade80; }
        .result.error { background: #2a0a0a; border: 1px solid #ef4444; color: #f87171; }

        /* Nav */
        .top-nav { background: #161b22; border-bottom: 1px solid #30363d; padding: 0 16px; display: flex; align-items: center; gap: 0; position: sticky; top: 0; z-index: 50; }
        .top-nav .brand { color: #58a6ff; font-weight: 700; font-size: 14px; padding: 10px 12px 10px 0; border-right: 1px solid #30363d; margin-right: 8px; white-space: nowrap; }
        .top-nav a { color: #8b949e; text-decoration: none; padding: 10px 14px; font-size: 13px; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
        .top-nav a:hover { color: #e1e4e8; background: #1c2128; }
        .top-nav a.active { color: #58a6ff; border-bottom-color: #58a6ff; }
        .top-nav .back-btn { color: #8b949e; padding: 10px 12px; cursor: pointer; font-size: 16px; border-right: 1px solid #30363d; margin-right: 4px; }
        .top-nav .back-btn:hover { color: #e1e4e8; }
        .top-nav .spacer { flex: 1; }
        .top-nav .mode-tag { font-size: 11px; padding: 3px 8px; border-radius: 4px; margin-left: 8px; }
        .top-nav .mode-tag.sim { background: #1a3a2a; color: #4ade80; }
        .top-nav .mode-tag.live { background: #3a1a1a; color: #f87171; }

        /* Order value */
        .order-value { font-size: 14px; color: #8b949e; margin-top: 8px; }
        .order-value span { color: #e1e4e8; font-weight: 600; }

        /* Capacity grid */
        .capacity-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
        .cap-item { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 8px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
        .cap-item:hover { border-color: #58a6ff; }
        .cap-item .cap-label { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
        .cap-item .cap-value { font-size: 18px; font-weight: 700; margin-top: 2px; }
        .cap-item .cap-value.buy-color { color: #4ade80; }
        .cap-item .cap-value.sell-color { color: #f87171; }
        .cap-item .cap-value.short-color { color: #fb923c; }
        .cap-item .cap-sub { font-size: 10px; color: #484f58; margin-top: 1px; }
        @media (max-width: 768px) { .capacity-grid { grid-template-columns: repeat(2, 1fr); } }

        /* Audit table */
        .audit-table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
        .audit-table th { text-align: left; padding: 10px 8px; border-bottom: 1px solid #30363d; color: #8b949e; font-weight: 600; }
        .audit-table td { padding: 10px 8px; border-bottom: 1px solid #21262d; }
        .audit-table .status-submitted { color: #4ade80; }
        .audit-table .status-rejected { color: #f87171; }
        .audit-table .status-error { color: #fbbf24; }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 10px; }
            .card { padding: 16px; }
            .form-grid { grid-template-columns: 1fr; }
            .direction-group { flex-direction: column; }
            .dir-btn { padding: 12px; font-size: 14px; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; text-align: center; }
            .quote-price { font-size: 22px; }
            .audit-table { font-size: 11px; }
            .audit-table th, .audit-table td { padding: 6px 4px; }
            .nav { gap: 6px; }
            .nav a { padding: 5px 10px; font-size: 12px; }
            .top-nav { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .top-nav .brand { display: none; }
            .top-nav a { padding: 8px 10px; font-size: 12px; }
        }
        @media (max-width: 480px) {
            .mode-bar { font-size: 11px; padding: 6px 10px; }
            .card h2 { font-size: 15px; }
            input, select, textarea { font-size: 14px; padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <span class="back-btn" onclick="history.back()" title="返回">←</span>
        <span class="brand">FTSeek-US</span>
        <a href="/">仪表盘</a>
        <a href="/manual-trade" class="active">手动下单</a>
        <a href="/live-status">持仓状态</a>
        <a href="/mode-switch">模式切换</a>
        <a href="/risk">风控</a>
        <a href="/health">系统健康</a>
        <span class="spacer"></span>
        <span class="mode-tag {{ 'live' if is_live else 'sim' }}">{{ '🔴 实盘' if is_live else '🟢 模拟' }}</span>
    </div>

    <div class="container">

        <div class="card">
            <h2>📝 手动下单</h2>
            <form id="orderForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>标的代码</label>
                        <input type="text" id="symbol" placeholder="US.TSLA" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>订单类型</label>
                        <select id="orderType">
                            <option value="MARKET">市价单 MARKET</option>
                            <option value="LIMIT">限价单 LIMIT</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>方向</label>
                        <div class="direction-group">
                            <div class="dir-btn long active" data-dir="LONG" onclick="setDirection('LONG')">📈 做多 LONG</div>
                            <div class="dir-btn short" data-dir="SHORT" onclick="setDirection('SHORT')">📉 做空 SHORT</div>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label>操作</label>
                        <div class="direction-group">
                            <div class="dir-btn active" data-op="OPEN" onclick="setOperation('OPEN')" style="border-color:#58a6ff;background:#0a1a2a;color:#58a6ff" id="btnOpen">🔓 开仓 OPEN</div>
                            <div class="dir-btn" data-op="CLOSE" onclick="setOperation('CLOSE')" id="btnClose">🔒 平仓 CLOSE</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>数量 (股)</label>
                        <input type="number" id="quantity" min="1" max="10000" value="10" required>
                    </div>
                    <div class="form-group" id="priceGroup" style="display:none">
                        <label>限价 ($)</label>
                        <input type="number" id="price" step="0.01" placeholder="0.00">
                    </div>

                    <div class="form-group full-width">
                        <label>下单理由 (可选)</label>
                        <textarea id="reason" placeholder="可选：说明这笔交易的逻辑..."></textarea>
                    </div>
                </div>

                <div class="quote-box" id="quoteBox" style="display:none">
                    <div class="quote-price" id="quotePrice">--</div>
                    <div class="quote-detail" id="quoteDetail"></div>
                    <div class="capacity-grid" id="capacityGrid" style="display:none"></div>
                </div>

                <div class="order-value" id="orderValue"></div>

                <div class="btn-group">
                    <button type="button" class="btn btn-buy" id="btnSubmit" onclick="submitOrder()">提交订单</button>
                    <button type="button" class="btn btn-ghost" onclick="fetchQuote()">刷新报价</button>
                </div>
            </form>

            <div class="result" id="result"></div>
        </div>

        <div class="card">
            <h2>📋 操作记录</h2>
            <table class="audit-table">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>标的</th>
                        <th>方向</th>
                        <th>数量</th>
                        <th>类型</th>
                        <th>状态</th>
                        <th>理由</th>
                    </tr>
                </thead>
                <tbody id="auditBody">
                    <tr><td colspan="7" style="text-align:center;color:#8b949e">加载中...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>📡 今日订单状态 <button class="btn btn-ghost" onclick="loadOrders()" style="float:right;font-size:12px;padding:4px 10px">刷新</button></h2>
            <table class="audit-table">
                <thead>
                    <tr>
                        <th>订单ID</th>
                        <th>标的</th>
                        <th>方向</th>
                        <th>数量</th>
                        <th>价格</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="ordersBody">
                    <tr><td colspan="7" style="text-align:center;color:#8b949e">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Confirmation modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h3>⚠️ 确认下单</h3>
            <div class="order-summary" id="orderSummary"></div>
            {% if is_live %}
            <div class="form-group" style="margin:16px 0">
                <label>输入 CONFIRM 确认实盘下单</label>
                <input type="text" id="confirmInput" placeholder="输入 CONFIRM">
            </div>
            {% endif %}
            <div class="btn-group">
                <button class="btn btn-buy" id="confirmBtn" onclick="executeOrder()">确认下单</button>
                <button class="btn btn-ghost" onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>

    <script>
        let currentDirection = 'LONG';
        let currentOperation = 'OPEN';
        let pendingOrder = null;
        let currentQuote = null;

        function setDirection(dir) {
            currentDirection = dir;
            document.querySelectorAll('.dir-btn[data-dir]').forEach(b => b.classList.remove('active'));
            document.querySelector(`.dir-btn[data-dir="${dir}"]`).classList.add('active');
            updateSubmitButton();
        }

        function setOperation(op) {
            currentOperation = op;
            document.getElementById('btnOpen').classList.toggle('active', op === 'OPEN');
            document.getElementById('btnClose').classList.toggle('active', op === 'CLOSE');
            document.getElementById('btnOpen').style.cssText = op === 'OPEN'
                ? 'border-color:#58a6ff;background:#0a1a2a;color:#58a6ff'
                : 'border-color:#30363d;background:#0d1117;color:#8b949e';
            document.getElementById('btnClose').style.cssText = op === 'CLOSE'
                ? 'border-color:#f59e0b;background:#2a1a0a;color:#fbbf24'
                : 'border-color:#30363d;background:#0d1117;color:#8b949e';
            updateSubmitButton();
        }

        function getAction() {
            // 自动根据方向+操作决定 BUY/SELL
            // 开多=BUY, 平多=SELL, 开空=SELL, 平空=BUY
            if (currentDirection === 'LONG' && currentOperation === 'OPEN') return 'BUY';
            if (currentDirection === 'LONG' && currentOperation === 'CLOSE') return 'SELL';
            if (currentDirection === 'SHORT' && currentOperation === 'OPEN') return 'SELL';
            if (currentDirection === 'SHORT' && currentOperation === 'CLOSE') return 'BUY';
            return 'BUY';
        }

        function updateSubmitButton() {
            const btn = document.getElementById('btnSubmit');
            const action = getAction();
            const dirLabel = currentDirection === 'LONG' ? '做多' : '做空';
            const opLabel = currentOperation === 'OPEN' ? '开仓' : '平仓';

            btn.textContent = `${opLabel} ${dirLabel}`;

            if (currentOperation === 'OPEN') {
                if (currentDirection === 'LONG') {
                    btn.className = 'btn btn-buy';
                } else {
                    btn.className = 'btn btn-sell';
                }
            } else {
                btn.className = 'btn';
                btn.style.cssText = 'background:#f59e0b;color:#000;';
            }
        }

        document.getElementById('orderType').addEventListener('change', function() {
            document.getElementById('priceGroup').style.display = this.value === 'LIMIT' ? 'flex' : 'none';
        });

        document.getElementById('symbol').addEventListener('blur', fetchQuote);
        document.getElementById('quantity').addEventListener('input', updateOrderValue);

        // 自动刷新报价 (5秒一次，仅在有标的时)
        let quoteTimer = null;
        document.getElementById('symbol').addEventListener('input', function() {
            if (quoteTimer) clearInterval(quoteTimer);
            const sym = this.value.trim();
            if (sym.length >= 4) {
                fetchQuote();
                quoteTimer = setInterval(fetchQuote, 10000);  // 10秒刷新
            }
        });

        async function fetchQuote() {
            const symbol = document.getElementById('symbol').value.trim().toUpperCase();
            if (!symbol) return;

            // Show loading state
            const priceEl = document.getElementById('quotePrice');
            const detailEl = document.getElementById('quoteDetail');
            document.getElementById('quoteBox').style.display = 'block';
            priceEl.textContent = '...';
            priceEl.className = 'quote-price';
            detailEl.textContent = '获取报价中...';

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 8000);

                const res = await fetch(`/api/quote/${symbol}`, { signal: controller.signal });
                clearTimeout(timeout);
                const data = await res.json();
                if (data.cur_price) {
                    currentQuote = data;
                    document.getElementById('quoteBox').style.display = 'block';
                    document.getElementById('quotePrice').textContent = `$${data.cur_price.toFixed(2)}`;
                    document.getElementById('quotePrice').className = 'quote-price ' + (data.cur_price > 0 ? 'up' : '');
                    const updateTime = data.update_time ? data.update_time.substring(11, 19) : '--';
                    const prevClose = data.prev_close ? ` | 昨收: $${data.prev_close.toFixed(2)}` : '';
                    const now = new Date();
                    const marketOpen = now.getHours() >= 21 && now.getHours() < 28; // rough ET check
                    const hasRealtime = data.update_time && data.cur_price > 0;
                    document.getElementById('quoteDetail').innerHTML =
                        `高: $${data.high_price?.toFixed(2) || '--'} | 低: $${data.low_price?.toFixed(2) || '--'} | 量: ${data.volume?.toLocaleString() || '--'}${prevClose}` +
                        `<br><span style="color:#484f58">更新: ${updateTime}</span>` +
                        (hasRealtime ? ' <span style="color:#4ade80">● 有数据</span>' : ' <span style="color:#f59e0b">⏸ 无数据</span>');
                    updateOrderValue();
                    fetchCapacity(symbol);
                } else if (data.error) {
                    priceEl.textContent = '--';
                    detailEl.textContent = `报价获取失败: ${data.error}`;
                }
            } catch (e) {
                priceEl.textContent = '--';
                detailEl.textContent = e.name === 'AbortError' ? '报价超时 (8s)' : `网络异常: ${e.message}`;
            }
        }

        function updateOrderValue() {
            const qty = parseInt(document.getElementById('quantity').value) || 0;
            if (currentQuote && currentQuote.cur_price) {
                const value = qty * currentQuote.cur_price;
                document.getElementById('orderValue').innerHTML =
                    `预估金额: <span>$${value.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>`;
            }
        }

        async function fetchCapacity(symbol) {
            try {
                const res = await fetch(`/api/order-capacity/${symbol}`);
                const d = await res.json();
                if (d.error) {
                    document.getElementById('capacityGrid').style.display = 'none';
                    return;
                }
                const g = document.getElementById('capacityGrid');
                g.style.display = 'grid';
                const held = d.held_qty || 0;
                const heldLabel = held > 0 ? `持 ${held} 多` : held < 0 ? `持 ${Math.abs(held)} 空` : '无持仓';
                g.innerHTML = `
                    <div class="cap-item" onclick="setQty(${d.cash_can_buy})" title="点击填入">
                        <div class="cap-label">现金可买</div>
                        <div class="cap-value buy-color">${d.cash_can_buy.toLocaleString()} 股</div>
                        <div class="cap-sub">现金 $${d.cash >= 1000 ? (d.cash/1000).toFixed(1)+'K' : d.cash.toFixed(0)}</div>
                    </div>
                    <div class="cap-item" onclick="setQty(${d.max_can_buy})" title="点击填入">
                        <div class="cap-label">最大可买</div>
                        <div class="cap-value buy-color">${d.max_can_buy.toLocaleString()} 股</div>
                        <div class="cap-sub">购买力 $${d.power >= 1000 ? (d.power/1000).toFixed(1)+'K' : d.power.toFixed(0)}</div>
                    </div>
                    <div class="cap-item" onclick="setQty(${d.can_sell})" title="点击填入">
                        <div class="cap-label">持仓可卖</div>
                        <div class="cap-value sell-color">${d.can_sell.toLocaleString()} 股</div>
                        <div class="cap-sub">${heldLabel}</div>
                    </div>
                    <div class="cap-item" onclick="setQty(${d.can_short})" title="点击填入">
                        <div class="cap-label">可做空</div>
                        <div class="cap-value short-color">${d.can_short.toLocaleString()} 股</div>
                        <div class="cap-sub">做空力 $${d.max_short_power >= 1000 ? (d.max_short_power/1000).toFixed(1)+'K' : d.max_short_power.toFixed(0)}</div>
                    </div>
                `;
            } catch (e) {
                document.getElementById('capacityGrid').style.display = 'none';
            }
        }

        function setQty(n) {
            if (n <= 0) return;
            document.getElementById('quantity').value = n;
            updateOrderValue();
        }

        async function submitOrder() {
            const symbol = document.getElementById('symbol').value.trim().toUpperCase();
            const quantity = parseInt(document.getElementById('quantity').value);
            const orderType = document.getElementById('orderType').value;
            const price = document.getElementById('price').value;
            const reason = document.getElementById('reason').value.trim();
            const action = getAction();

            if (!symbol || !quantity) {
                showResult('error', '请填写标的和数量');
                return;
            }

            pendingOrder = {
                symbol, direction: currentDirection, action,
                quantity, order_type: orderType, price: price || null, reason,
                operation: currentOperation,
            };

            const dirLabel = currentDirection === 'LONG' ? '做多 LONG' : '做空 SHORT';
            const opLabel = currentOperation === 'OPEN' ? '开仓' : '平仓';

            const summary = document.getElementById('orderSummary');
            summary.innerHTML = `
                <div><b>标的:</b> ${symbol}</div>
                <div><b>操作:</b> ${opLabel} ${dirLabel} → 系统执行 ${action}</div>
                <div><b>数量:</b> ${quantity} 股</div>
                <div><b>类型:</b> ${orderType} ${price ? '@ $' + price : ''}</div>
                <div><b>金额:</b> ${currentQuote ? '$' + (quantity * currentQuote.cur_price).toLocaleString() : '未知'}</div>
                ${reason ? '<div><b>理由:</b> ' + reason + '</div>' : ''}
                <div><b>模式:</b> {{ mode }}</div>
            `;

            document.getElementById('confirmModal').classList.add('active');
            {% if is_live %}
            document.getElementById('confirmInput').value = '';
            document.getElementById('confirmBtn').disabled = true;
            document.getElementById('confirmInput').addEventListener('input', function() {
                document.getElementById('confirmBtn').disabled = this.value !== 'CONFIRM';
            });
            {% endif %}
        }

        function closeModal() {
            document.getElementById('confirmModal').classList.remove('active');
            // 注意: 不要在这里清空 pendingOrder，executeOrder 还需要用
        }

        async function executeOrder() {
            if (!pendingOrder) {
                showResult('error', '订单数据为空，请重新填写');
                return;
            }

            if (!pendingOrder.symbol) {
                showResult('error', '标的代码不能为空');
                closeModal();
                return;
            }

            if (!pendingOrder.quantity || pendingOrder.quantity <= 0) {
                showResult('error', '数量必须大于 0');
                closeModal();
                return;
            }

            {% if is_live %}
            if (document.getElementById('confirmInput').value !== 'CONFIRM') {
                showResult('error', '请输入 CONFIRM 确认实盘下单');
                return;
            }
            {% endif %}

            closeModal();
            showResult('success', '提交中...');

            try {
                const payload = JSON.stringify(pendingOrder);
                console.log('Sending order:', payload);

                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: payload,
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    showResult('error', `❌ HTTP ${res.status}: ${errData.error || '请求失败'}`);
                    return;
                }

                const data = await res.json();

                if (data.success) {
                    showResult('success', `✅ 订单提交成功! Order ID: ${data.order?.order_id || '--'}`);
                    loadAudit();
                    // 清空表单
                    document.getElementById('reason').value = '';
                } else {
                    const errors = data.errors ? data.errors.join(', ') : data.error || data.order?.error_msg || '未知错误';
                    showResult('error', `❌ 下单失败: ${errors}`);
                }
            } catch (e) {
                showResult('error', `❌ 网络异常: ${e.message}`);
            } finally {
                pendingOrder = null;  // 提交完成后清空
            }
        }

        function showResult(type, msg) {
            const el = document.getElementById('result');
            el.className = `result ${type}`;
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 8000);
        }

        async function loadAudit() {
            try {
                const res = await fetch('/api/orders/audit');
                const data = await res.json();
                const tbody = document.getElementById('auditBody');
                if (!data.orders || data.orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#8b949e">暂无操作记录</td></tr>';
                    return;
                }
                tbody.innerHTML = data.orders.map(o => `
                    <tr>
                        <td>${(o.timestamp || '').substring(5, 19)}</td>
                        <td><b>${o.symbol}</b></td>
                        <td>${o.action || '--'}</td>
                        <td>${o.quantity}</td>
                        <td>${o.order_type}</td>
                        <td class="status-${o.status}">${o.status}${o.error_msg ? ' (' + o.error_msg.substring(0, 30) + ')' : ''}</td>
                        <td>${(o.reason || '').substring(0, 40)}</td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Audit load failed:', e);
            }
        }

        loadAudit();
        loadOrders();
        setInterval(loadOrders, 15000);

        async function loadOrders() {
            try {
                const res = await fetch('/api/orders/today');
                const data = await res.json();
                const tbody = document.getElementById('ordersBody');
                if (!data.orders || data.orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#8b949e">今日无订单</td></tr>';
                    return;
                }
                tbody.innerHTML = data.orders.map(o => {
                    const statusColor = o.order_status.includes('FILLED') ? '#4ade80' : o.order_status.includes('CANCEL') ? '#f87171' : '#fbbf24';
                    const canCancel = !o.order_status.includes('FILLED') && !o.order_status.includes('CANCEL') && !o.order_status.includes('FAILED');
                    return `<tr>
                        <td style="font-family:monospace;font-size:11px">${(o.order_id||'').substring(0,12)}...</td>
                        <td><b>${o.code}</b></td>
                        <td>${o.trd_side === 'BUY' ? '<span style="color:#4ade80">BUY</span>' : '<span style="color:#f87171">SELL</span>'}</td>
                        <td>${o.qty}</td>
                        <td>${o.price > 0 ? '$' + o.price.toFixed(2) : 'MARKET'}</td>
                        <td style="color:${statusColor};font-weight:600">${o.order_status}</td>
                        <td>${canCancel ? `<button class="btn btn-close" style="font-size:11px;padding:3px 8px" onclick="cancelOrder('${o.order_id}')">撤单</button>` : '-'}</td>
                    </tr>`;
                }).join('');
            } catch (e) {
                console.error('Order load failed:', e);
            }
        }

        async function cancelOrder(orderId) {
            if (!confirm(`确认撤销订单 ${orderId}?`)) return;
            try {
                const res = await fetch('/api/orders/cancel', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ order_id: orderId }),
                });
                const data = await res.json();
                if (data.success) {
                    showResult('success', `✅ 订单 ${orderId} 已撤销`);
                    loadOrders();
                } else {
                    showResult('error', `❌ 撤单失败: ${data.error}`);
                }
            } catch (e) {
                showResult('error', `❌ 请求异常: ${e.message}`);
            }
        }
    </script>
</body>
</html>
