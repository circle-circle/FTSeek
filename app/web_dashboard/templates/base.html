<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>{% block title %}FTSeek-US{% endblock %}</title>
    {% block head %}{% endblock %}
    <style>
        /* ── RESET ── */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1117; color: #e1e4e8; font-size: 14px;
            -webkit-text-size-adjust: 100%;
        }

        /* ── NAV ── */
        .top-nav {
            background: #161b22; border-bottom: 1px solid #30363d;
            padding: 0 16px; display: flex; align-items: center;
            position: sticky; top: 0; z-index: 50;
        }
        .top-nav .brand {
            color: #58a6ff; font-weight: 700; font-size: 14px;
            padding: 10px 12px 10px 0; border-right: 1px solid #30363d; margin-right: 8px;
            white-space: nowrap;
        }
        .top-nav .hamburger {
            display: none; background: none; border: 1px solid #30363d; border-radius: 4px;
            color: #8b949e; font-size: 18px; padding: 6px 10px; cursor: pointer;
            margin-right: 8px; line-height: 1;
        }
        .top-nav .hamburger:hover { color: #e1e4e8; border-color: #58a6ff; }
        .nav-links { display: flex; align-items: center; }
        .nav-links a {
            color: #8b949e; text-decoration: none; padding: 10px 14px;
            font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap;
        }
        .nav-links a:hover { color: #e1e4e8; }
        .nav-links a.active { color: #58a6ff; border-bottom-color: #58a6ff; }
        .top-nav .spacer { flex: 1; }

        /* ── MODE TAG ── */
        .mode-tag {
            font-size: 11px; padding: 3px 8px; border-radius: 4px; margin-left: 8px; white-space: nowrap;
        }
        .mode-tag.sim { background: #1a3a2a; color: #4ade80; }
        .mode-tag.live { background: #3a1a1a; color: #f87171; }
        .mode-tag.live_conservative { background: #3a1a1a; color: #fbbf24; }

        /* ── MARKET BADGE ── */
        .market-badge {
            font-size: 11px; padding: 3px 8px; border-radius: 4px; margin-left: 6px;
            font-weight: 600; white-space: nowrap;
        }
        .market-badge.closed { background: #2a0a0a; color: #f87171; }
        .market-badge.pre { background: #2a1f0a; color: #fbbf24; }
        .market-badge.open { background: #0a2a1a; color: #4ade80; }
        .market-badge.after { background: #1a1020; color: #fb923c; }

        /* ── CONTAINER ── */
        .container { max-width: 1200px; margin: 0 auto; padding: 12px; }

        /* ── GRID ── */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

        /* ── CARD ── */
        .card {
            background: #161b22; border: 1px solid #30363d;
            border-radius: 10px; padding: 16px; margin-bottom: 16px;
        }
        .card h2 {
            font-size: 15px; margin-bottom: 12px; color: #58a6ff;
            display: flex; align-items: center; justify-content: space-between;
        }
        .card h3 { color: #58a6ff; margin-bottom: 14px; font-size: 15px; font-weight: 600; }

        /* ── METRIC ── */
        .metric {
            background: #0d1117; border: 1px solid #30363d;
            border-radius: 8px; padding: 12px; text-align: center;
        }
        .metric .label {
            font-size: 11px; color: #8b949e;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .metric .value { font-size: 18px; font-weight: 700; margin-top: 3px; }
        .metric .sub { font-size: 11px; color: #8b949e; margin-top: 2px; }

        /* ── COLORS ── */
        .green { color: #4ade80; }
        .yellow { color: #fbbf24; }
        .orange { color: #fb923c; }
        .red { color: #f87171; }
        .long { color: #4ade80; }
        .short { color: #f87171; }
        .amber { color: #fbbf24; }
        .blue { color: #60a5fa; }

        /* ── BUTTONS ── */
        .btn {
            padding: 10px 16px; border: 1px solid #30363d; border-radius: 6px;
            background: #0d1117; color: #8b949e; cursor: pointer;
            font-size: 13px; font-weight: 600; text-decoration: none;
            display: inline-block; min-height: 44px; line-height: 1.2;
        }
        .btn:hover { border-color: #58a6ff; color: #58a6ff; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-sm { padding: 6px 12px; font-size: 12px; min-height: 32px; }
        .btn-buy { background: #22c55e; color: #000; border-color: #22c55e; }
        .btn-sell { background: #ef4444; color: #fff; border-color: #ef4444; }
        .btn-ghost { background: transparent; border: 1px solid #30363d; color: #8b949e; }

        /* ── MISC ── */
        .loading { text-align: center; padding: 20px; color: #8b949e; }
        .empty-state { text-align: center; padding: 20px; color: #8b949e; font-size: 13px; }
        .last-updated { font-size: 11px; color: #484f58; margin-left: 8px; white-space: nowrap; }

        /* ── MOBILE ── */
        @media (max-width: 768px) {
            .top-nav { flex-wrap: wrap; padding: 0 12px; }
            .top-nav .brand { display: none; }
            .top-nav .hamburger { display: block; }
            .nav-links {
                display: none; flex-direction: column; width: 100%;
                order: 10; padding: 0; margin: 0;
            }
            .nav-links.open { display: flex; }
            .nav-links a {
                padding: 12px 0; border-bottom: 1px solid #21262d;
                font-size: 14px; width: 100%;
            }
            .nav-links a.active { border-bottom-color: #21262d; background: none; }
            .top-nav.nav-open { padding-bottom: 0; }
            .top-nav .spacer { display: none; }
            .top-nav .mode-tag { margin-left: auto; }
            .top-nav .last-updated { display: none; }

            .grid-2 { grid-template-columns: 1fr; }
            .grid-3 { grid-template-columns: 1fr; }
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .container { padding: 8px; }
            .card { padding: 12px; border-radius: 8px; }
        }

        @media (max-width: 480px) {
            body { font-size: 13px; }
            .grid-4 { grid-template-columns: 1fr 1fr; gap: 6px; }
            .metric .value { font-size: 16px; }
            .metric .label { font-size: 10px; }
            .card h2 { font-size: 14px; }
        }

        /* ── PAGE-SPECIFIC CSS ── */
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="top-nav" id="topNav">
        <button class="hamburger" onclick="toggleNav()" aria-label="菜单">☰</button>
        <span class="brand">FTSeek-US</span>
        <div class="nav-links" id="navLinks">
            <a href="/" {% block nav_home_class %}{% endblock %}>指挥中心</a>
            <a href="/trade" {% block nav_trade_class %}{% endblock %}>交易</a>
            <a href="/review" {% block nav_review_class %}{% endblock %}>分析</a>
            <a href="/system" {% block nav_system_class %}{% endblock %}>系统</a>
        </div>
        <span class="spacer"></span>
        {% block nav_extra %}{% endblock %}
    </div>

    {% block content %}{% endblock %}

    <script>
        function toggleNav() {
            var links = document.getElementById('navLinks');
            var nav = document.getElementById('topNav');
            links.classList.toggle('open');
            nav.classList.toggle('nav-open');
        }
        // Close nav when clicking a link
        document.querySelectorAll('.nav-links a').forEach(function(a) {
            a.addEventListener('click', function() {
                document.getElementById('navLinks').classList.remove('open');
                document.getElementById('topNav').classList.remove('nav-open');
            });
        });
        // Close nav when clicking outside
        document.addEventListener('click', function(e) {
            var nav = document.getElementById('topNav');
            if (nav && nav.classList.contains('nav-open') && !nav.contains(e.target)) {
                document.getElementById('navLinks').classList.remove('open');
                nav.classList.remove('nav-open');
            }
        });
        {% block scripts %}{% endblock %}
    </script>
</body>
</html>
