<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>{% block title %}FTSeek-US{% endblock %}</title>
    <link rel="icon" href="data:,">
    {% block head %}{% endblock %}
    <style>
        /* ── RESET ── */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1117; color: #e1e4e8; font-size: 14px;
            -webkit-text-size-adjust: 100%;
        }

        /* ══════════════════════════════════════════════════
           NAVIGATION — 3-device adaptive
           Desktop ≥1024: Left sidebar
           Tablet 768-1023: Top tabs with icons
           Mobile <768: Bottom tab bar (trade centered+raised)
           ══════════════════════════════════════════════════ */

        /* ── DESKTOP SIDEBAR (default for ≥1024) ── */
        .sidebar {
            display: none; /* hidden by default, shown at ≥1024 */
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 200px; background: #161b22; border-right: 1px solid #30363d;
            z-index: 50; padding: 16px 0; flex-direction: column;
        }
        .sidebar .brand {
            color: #58a6ff; font-weight: 700; font-size: 16px;
            padding: 8px 16px 20px; border-bottom: 1px solid #30363d; margin-bottom: 8px;
        }
        .sidebar .nav-links { display: flex; flex-direction: column; }
        .sidebar .nav-links a {
            color: #8b949e; text-decoration: none; padding: 12px 16px;
            font-size: 14px; border-left: 3px solid transparent;
            display: flex; align-items: center; gap: 10px;
        }
        .sidebar .nav-links a:hover { color: #e1e4e8; background: #0d1117; }
        .sidebar .nav-links a.active {
            color: #58a6ff; border-left-color: #58a6ff; background: #0d1117;
        }
        .sidebar .nav-links a .nav-icon { font-size: 16px; width: 20px; text-align: center; }
        .sidebar .sidebar-footer {
            margin-top: auto; padding: 12px 16px; border-top: 1px solid #30363d;
            font-size: 12px;
        }

        /* ── TOP NAV (tablet 768-1023) ── */
        .top-nav {
            display: none; /* shown at 768-1023 */
            background: #161b22; border-bottom: 1px solid #30363d;
            padding: 0 12px; align-items: center;
            position: sticky; top: 0; z-index: 50;
        }
        .top-nav .brand {
            color: #58a6ff; font-weight: 700; font-size: 14px;
            padding: 10px 12px 10px 0; border-right: 1px solid #30363d; margin-right: 8px;
            white-space: nowrap;
        }
        .top-nav .nav-links { display: flex; align-items: center; }
        .top-nav .nav-links a {
            color: #8b949e; text-decoration: none; padding: 10px 12px;
            font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap;
            display: flex; align-items: center; gap: 4px;
        }
        .top-nav .nav-links a:hover { color: #e1e4e8; }
        .top-nav .nav-links a.active { color: #58a6ff; border-bottom-color: #58a6ff; }
        .top-nav .nav-links a .nav-icon { font-size: 14px; }
        .top-nav .spacer { flex: 1; }

        /* ── MOBILE BOTTOM TAB BAR (<768) ── */
        .mobile-header {
            display: none; /* shown at <768 */
            background: #161b22; border-bottom: 1px solid #30363d;
            padding: 8px 12px; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50;
        }
        .mobile-header .brand { color: #58a6ff; font-weight: 700; font-size: 15px; }

        .bottom-tab-bar {
            display: none; /* shown at <768 */
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #161b22; border-top: 1px solid #30363d;
            z-index: 50; padding: 4px 0 env(safe-area-inset-bottom, 4px);
        }
        .bottom-tab-bar .tab-row {
            display: flex; align-items: flex-end; justify-content: space-around;
            height: 56px;
        }
        .bottom-tab-bar a {
            color: #8b949e; text-decoration: none; font-size: 10px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 6px 8px; flex: 1;
            gap: 2px; min-width: 0;
        }
        .bottom-tab-bar a .tab-icon { font-size: 20px; line-height: 1; }
        .bottom-tab-bar a.active { color: #58a6ff; }
        /* Trade button — centered and raised */
        .bottom-tab-bar .tab-trade {
            position: relative; top: -14px;
            background: #22c55e; color: #000; border-radius: 50%;
            width: 52px; height: 52px; font-size: 11px; font-weight: 700;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; box-shadow: 0 4px 12px rgba(34,197,94,0.4);
            flex: 0 0 52px; padding: 0;
        }
        .bottom-tab-bar .tab-trade .tab-icon { font-size: 22px; }
        .bottom-tab-bar .tab-trade.active { background: #16a34a; color: #fff; }

        /* ── MODE TAG ── */
        .mode-tag {
            font-size: 11px; padding: 3px 8px; border-radius: 4px; margin-left: 8px; white-space: nowrap;
        }
        .mode-tag.sim { background: #1a3a2a; color: #4ade80; }
        .mode-tag.live { background: #3a1a1a; color: #f87171; }
        .mode-tag.live_conservative { background: #3a1a1a; color: #fbbf24; }

        /* ── MARKET BADGE ── */
        .market-badge {
            font-size: 11px; padding: 3px 8px; border-radius: 4px; margin-left: 6px;
            font-weight: 600; white-space: nowrap;
        }
        .market-badge.closed { background: #2a0a0a; color: #f87171; }
        .market-badge.pre { background: #2a1f0a; color: #fbbf24; }
        .market-badge.open { background: #0a2a1a; color: #4ade80; }
        .market-badge.after { background: #1a1020; color: #fb923c; }

        /* ── CONTAINER ── */
        .container { max-width: 1200px; margin: 0 auto; padding: 12px; }

        /* ── GRID ── */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

        /* ── CARD ── */
        .card {
            background: #161b22; border: 1px solid #30363d;
            border-radius: 10px; padding: 16px; margin-bottom: 16px;
        }
        .card h2 {
            font-size: 15px; margin-bottom: 12px; color: #58a6ff;
            display: flex; align-items: center; justify-content: space-between;
        }
        .card h3 { color: #58a6ff; margin-bottom: 14px; font-size: 15px; font-weight: 600; }

        /* ── METRIC ── */
        .metric {
            background: #0d1117; border: 1px solid #30363d;
            border-radius: 8px; padding: 12px; text-align: center;
        }
        .metric .label {
            font-size: 11px; color: #8b949e;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .metric .value { font-size: 18px; font-weight: 700; margin-top: 3px; }
        .metric .sub { font-size: 11px; color: #8b949e; margin-top: 2px; }

        /* ── COLORS ── */
        .green { color: #4ade80; }
        .yellow { color: #fbbf24; }
        .orange { color: #fb923c; }
        .red { color: #f87171; }
        .long { color: #4ade80; }
        .short { color: #f87171; }
        .amber { color: #fbbf24; }
        .blue { color: #60a5fa; }

        /* ── BUTTONS ── */
        .btn {
            padding: 10px 16px; border: 1px solid #30363d; border-radius: 6px;
            background: #0d1117; color: #8b949e; cursor: pointer;
            font-size: 13px; font-weight: 600; text-decoration: none;
            display: inline-block; min-height: 44px; line-height: 1.2;
        }
        .btn:hover { border-color: #58a6ff; color: #58a6ff; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-sm { padding: 6px 12px; font-size: 12px; min-height: 32px; }
        .btn-buy { background: #22c55e; color: #000; border-color: #22c55e; }
        .btn-sell { background: #ef4444; color: #fff; border-color: #ef4444; }
        .btn-ghost { background: transparent; border: 1px solid #30363d; color: #8b949e; }

        /* ── MISC ── */
        .loading { text-align: center; padding: 20px; color: #8b949e; }
        .empty-state { text-align: center; padding: 20px; color: #8b949e; font-size: 13px; }
        .last-updated { font-size: 11px; color: #484f58; margin-left: 8px; white-space: nowrap; }

        /* ══════════════════════════════════════════════
           RESPONSIVE BREAKPOINTS
           ══════════════════════════════════════════════ */

        /* ── DESKTOP ≥1024: sidebar visible ── */
        @media (min-width: 1024px) {
            .sidebar { display: flex; }
            .top-nav { display: none; }
            .mobile-header { display: none; }
            .bottom-tab-bar { display: none; }
            body { padding-left: 200px; }
        }

        /* ── TABLET 768–1023: top tabs ── */
        @media (min-width: 768px) and (max-width: 1023px) {
            .sidebar { display: none; }
            .top-nav { display: flex; }
            .mobile-header { display: none; }
            .bottom-tab-bar { display: none; }
        }

        /* ── MOBILE <768: bottom tab bar ── */
        @media (max-width: 767px) {
            .sidebar { display: none; }
            .top-nav { display: none; }
            .mobile-header { display: flex; }
            .bottom-tab-bar { display: block; }
            body { padding-bottom: 64px; } /* space for bottom bar */

            .grid-2 { grid-template-columns: 1fr; }
            .grid-3 { grid-template-columns: 1fr; }
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .container { padding: 8px; }
            .card { padding: 12px; border-radius: 8px; }
        }

        @media (max-width: 480px) {
            body { font-size: 13px; }
            .grid-4 { grid-template-columns: 1fr 1fr; gap: 6px; }
            .metric .value { font-size: 16px; }
            .metric .label { font-size: 10px; }
            .card h2 { font-size: 14px; }
        }

        /* ── PAGE-SPECIFIC CSS ── */
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <!-- ══ DESKTOP SIDEBAR ══ -->
    <nav class="sidebar">
        <div class="brand">FTSeek-US</div>
        <div class="nav-links">
            <a href="/" {% block nav_home_class %}{% endblock %}><span class="nav-icon">🏠</span> 指挥中心</a>
            <a href="/trade" {% block nav_trade_class %}{% endblock %}><span class="nav-icon">💹</span> 交易</a>
            <a href="/watchlist" {% block nav_watchlist_class %}{% endblock %}><span class="nav-icon">📋</span> 股票池</a>
            <a href="/system" {% block nav_system_class %}{% endblock %}><span class="nav-icon">⚙️</span> 系统</a>
        </div>
        <div class="sidebar-footer">
            {% block nav_extra %}{% endblock %}
        </div>
    </nav>

    <!-- ══ TABLET TOP NAV ══ -->
    <nav class="top-nav">
        <span class="brand">FTSeek</span>
        <div class="nav-links">
            <a href="/" {% block nav_home_class2 %}{% endblock %}><span class="nav-icon">🏠</span> 指挥</a>
            <a href="/trade" {% block nav_trade_class2 %}{% endblock %}><span class="nav-icon">💹</span> 交易</a>
            <a href="/watchlist" {% block nav_watchlist_class2 %}{% endblock %}><span class="nav-icon">📋</span> 股票池</a>
            <a href="/system" {% block nav_system_class2 %}{% endblock %}><span class="nav-icon">⚙️</span> 系统</a>
        </div>
        <span class="spacer"></span>
        {% block nav_extra_tablet %}{% endblock %}
    </nav>

    <!-- ══ MOBILE HEADER ══ -->
    <header class="mobile-header">
        <span class="brand">FTSeek-US</span>
        {% block nav_extra_mobile %}{% endblock %}
    </header>

    <!-- ══ MOBILE BOTTOM TAB BAR ══ -->
    <nav class="bottom-tab-bar">
        <div class="tab-row">
            <a href="/" {% block nav_home_class3 %}{% endblock %}><span class="tab-icon">🏠</span>指挥</a>
            <a href="/watchlist" {% block nav_watchlist_class3 %}{% endblock %}><span class="tab-icon">📋</span>股票池</a>
            <a href="/trade" class="tab-trade" {% block nav_trade_class3 %}{% endblock %}><span class="tab-icon">💹</span>交易</a>
            <a href="/system" {% block nav_system_class3 %}{% endblock %}><span class="tab-icon">⚙️</span>系统</a>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script>
        // ── M3: 全局 401 处理 — session 过期自动跳转登录 ──
        (function() {
            var _origFetch = window.fetch;
            window.fetch = function() {
                return _origFetch.apply(this, arguments).then(function(resp) {
                    if (resp.status === 401 && !location.pathname.startsWith('/login')) {
                        location.href = '/login';
                        return new Promise(function(){}); // 挂起后续调用
                    }
                    return resp;
                });
            };
        })();

        // ═══════════════════════════════════════════════════════
        //  WebSocket 全局连接管理器 (渐进增强, 断线回退 polling)
        // ═══════════════════════════════════════════════════════
        window.WSManager = (function() {
            var ws = null;
            var reconnectDelay = 1000;
            var maxReconnectDelay = 60000;
            var handlers = {};
            var connected = false;
            var enabled = true;

            function connect() {
                if (!enabled || ws) return;
                try {
                    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
                    ws = new WebSocket(proto + '//' + location.host + '/ws/events');

                    ws.onopen = function() {
                        connected = true;
                        reconnectDelay = 1000;
                        updateIndicator('connected');
                        // 订阅所有事件
                        ws.send(JSON.stringify({type: 'subscribe', events: ['*']}));
                    };

                    ws.onmessage = function(evt) {
                        try {
                            var msg = JSON.parse(evt.data);
                            var type = msg.type;
                            if (handlers[type]) {
                                handlers[type].forEach(function(fn) { fn(msg.data, msg); });
                            }
                            if (handlers['*']) {
                                handlers['*'].forEach(function(fn) { fn(msg.data, msg); });
                            }
                        } catch(e) {}
                    };

                    ws.onclose = function() {
                        ws = null;
                        connected = false;
                        updateIndicator('polling');
                        // 指数退避重连
                        setTimeout(function() {
                            reconnectDelay = Math.min(reconnectDelay * 2, maxReconnectDelay);
                            connect();
                        }, reconnectDelay);
                    };

                    ws.onerror = function() {
                        if (ws) ws.close();
                    };
                } catch(e) {
                    updateIndicator('polling');
                }
            }

            function updateIndicator(status) {
                var dots = document.querySelectorAll('.ws-dot');
                dots.forEach(function(dot) {
                    dot.className = 'ws-dot ' + status;
                });
                var labels = document.querySelectorAll('.ws-label');
                labels.forEach(function(l) {
                    l.textContent = status === 'connected' ? '实时' : '轮询';
                });
            }

            function on(eventType, handler) {
                if (!handlers[eventType]) handlers[eventType] = [];
                handlers[eventType].push(handler);
            }

            function off(eventType, handler) {
                if (handlers[eventType]) {
                    handlers[eventType] = handlers[eventType].filter(function(h) { return h !== handler; });
                }
            }

            function isConnected() { return connected; }

            // 自动连接
            setTimeout(connect, 2000);

            return { on: on, off: off, isConnected: isConnected };
        })();

        {% block scripts %}{% endblock %}
    </script>
</body>
</html>
