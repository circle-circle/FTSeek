<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ title }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #e1e4e8; font-size: 14px; }

        .mode-bar { padding: 0; }
        .top-nav { background: #161b22; border-bottom: 1px solid #30363d; padding: 0 16px; display: flex; align-items: center; gap: 0; position: sticky; top: 0; z-index: 50; }
        .top-nav .brand { color: #58a6ff; font-weight: 700; font-size: 14px; padding: 10px 12px 10px 0; border-right: 1px solid #30363d; margin-right: 8px; white-space: nowrap; }
        .top-nav a { color: #8b949e; text-decoration: none; padding: 10px 14px; font-size: 13px; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
        .top-nav a:hover { color: #e1e4e8; background: #1c2128; }
        .top-nav a.active { color: #58a6ff; border-bottom-color: #58a6ff; }
        .top-nav .back-btn { color: #8b949e; padding: 10px 12px; cursor: pointer; font-size: 16px; border-right: 1px solid #30363d; margin-right: 4px; }
        .top-nav .back-btn:hover { color: #e1e4e8; }
        .top-nav .spacer { flex: 1; }
        .top-nav .mode-tag { font-size: 11px; padding: 3px 8px; border-radius: 4px; margin-left: 8px; }
        .top-nav .mode-tag.sim { background: #1a3a2a; color: #4ade80; }
        .top-nav .mode-tag.live { background: #3a1a1a; color: #f87171; }

        .container { max-width: 1200px; margin: 0 auto; padding: 12px; }

        .nav { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .nav a { color: #58a6ff; text-decoration: none; padding: 6px 14px; border-radius: 6px; background: #161b22; border: 1px solid #30363d; font-size: 13px; white-space: nowrap; }
        .nav a:hover { border-color: #58a6ff; }
        .nav a.active { background: #1a2a3a; border-color: #58a6ff; }

        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .card h2 { font-size: 16px; margin-bottom: 12px; color: #58a6ff; display: flex; align-items: center; justify-content: space-between; }

        /* Metrics grid - responsive */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        .metric { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; text-align: center; }
        .metric .label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
        .metric .value { font-size: 20px; font-weight: 700; margin-top: 4px; }
        .metric .value.green { color: #4ade80; }
        .metric .value.red { color: #f87171; }

        /* Position table - responsive */
        .pos-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .pos-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
        .pos-table th { text-align: left; padding: 10px 8px; border-bottom: 1px solid #30363d; color: #8b949e; font-weight: 600; font-size: 11px; text-transform: uppercase; white-space: nowrap; }
        .pos-table td { padding: 10px 8px; border-bottom: 1px solid #21262d; white-space: nowrap; }
        .pos-table .long { color: #4ade80; font-weight: 600; }
        .pos-table .short { color: #f87171; font-weight: 600; }
        .pos-table .pnl-pos { color: #4ade80; font-weight: 700; }
        .pos-table .pnl-neg { color: #f87171; font-weight: 700; }
        .pos-table .price-up { color: #4ade80; }
        .pos-table .price-down { color: #f87171; }

        /* Cards for mobile */
        .pos-cards { display: none; }
        .pos-card { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
        .pos-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .pos-card-header .code { font-weight: 700; font-size: 15px; }
        .pos-card-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
        .pos-card-row .label { color: #8b949e; }

        .btn { padding: 6px 12px; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #8b949e; cursor: pointer; font-size: 12px; text-decoration: none; display: inline-block; }
        .btn:hover { border-color: #58a6ff; color: #58a6ff; }
        .btn-close { border-color: #ef4444; color: #f87171; }
        .btn-close:hover { background: #2a0a0a; }
        .btn-refresh { float: right; font-size: 12px; }

        .refresh-info { font-size: 11px; color: #484f58; margin-top: 8px; }
        .loading { text-align: center; padding: 30px; color: #8b949e; }

        /* Responsive breakpoints */
        @media (max-width: 768px) {
            body { font-size: 13px; }
            .container { padding: 8px; }
            .card { padding: 12px; }
            .metrics-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .metric .value { font-size: 16px; }
            .metric .label { font-size: 10px; }
            /* Hide table, show cards on mobile */
            .pos-wrapper { display: none; }
            .pos-cards { display: block; }
            .nav a { padding: 5px 10px; font-size: 12px; }
            .top-nav { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .top-nav .brand { display: none; }
            .top-nav a { padding: 8px 10px; font-size: 12px; }
        }

        @media (max-width: 480px) {
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
            .metric .value { font-size: 14px; }
            .mode-bar { font-size: 11px; padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <span class="back-btn" onclick="history.back()" title="返回">←</span>
        <span class="brand">FTSeek-US</span>
        <a href="/">仪表盘</a>
        <a href="/trade">交易</a>
        <a href="/live-status" class="active">持仓状态</a>
        <a href="/mode-switch">模式切换</a>
        <a href="/risk">风控</a>
        <a href="/health">系统健康</a>
        <span class="spacer"></span>
        <span class="mode-tag {{ 'live' if is_live else 'sim' }}">{{ '🔴 实盘' if is_live else '🟢 模拟' }}</span>
    </div>

    <div class="container">

        <div class="card">
            <h2>💰 账户概览 <button class="btn btn-refresh" onclick="refresh()">🔄 刷新</button></h2>
            <div class="metrics-grid" id="metrics">
                <div class="metric"><div class="label">加载中...</div></div>
            </div>
            <div class="refresh-info" id="refreshTime"></div>
        </div>

        <div class="card">
            <h2>📊 当前持仓 <span id="posCount" style="font-size:12px;color:#8b949e"></span></h2>

            <!-- Desktop/Tablet: Table view -->
            <div class="pos-wrapper">
                <table class="pos-table">
                    <thead>
                        <tr>
                            <th>标的</th>
                            <th>方向</th>
                            <th>数量</th>
                            <th>成本</th>
                            <th>现价</th>
                            <th>市值</th>
                            <th>盈亏</th>
                            <th>盈亏%</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="posBody">
                        <tr><td colspan="9" class="loading">加载中...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Mobile: Card view -->
            <div class="pos-cards" id="posCards"></div>
        </div>
    </div>

    <script>
        function fmt(n, d=2) { return n == null || isNaN(n) ? '--' : Number(n).toFixed(d); }
        function fmtMoney(n) { return n == null || isNaN(n) ? '--' : '$' + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }
        function pnlPct(p) {
            if (!p.cost_price || !p.qty) return '--';
            const cost = p.cost_price * Math.abs(p.qty);
            if (cost === 0) return '--';
            return ((p.unrealized_pl / cost) * 100).toFixed(2) + '%';
        }

        async function refresh() {
            try {
                const res = await fetch('/api/live-account');
                const data = await res.json();

                if (data.error) {
                    document.getElementById('metrics').innerHTML = `<div class="metric"><div class="label" style="color:#f87171">❌ ${data.error}</div></div>`;
                    return;
                }

                const acc = data.account || {};
                const positions = data.positions || [];

                // Filter out zero-qty positions for display
                const activePositions = positions.filter(p => p.qty !== 0);

                // Total PnL (only active positions)
                const totalPnl = activePositions.reduce((s, p) => s + (p.unrealized_pl || 0), 0);

                document.getElementById('metrics').innerHTML = `
                    <div class="metric"><div class="label">USD 资产</div><div class="value">${fmtMoney(acc.usd_assets || acc.total_assets)}</div></div>
                    <div class="metric"><div class="label">USD 现金</div><div class="value green">${fmtMoney(acc.us_cash || acc.cash)}</div></div>
                    <div class="metric"><div class="label">购买力</div><div class="value">${fmtMoney(acc.power)}</div></div>
                    <div class="metric"><div class="label">持仓市值</div><div class="value">${fmtMoney(acc.market_val)}</div></div>
                    <div class="metric"><div class="label">未实现盈亏</div><div class="value ${totalPnl >= 0 ? 'green' : 'red'}">${totalPnl >= 0 ? '+' : ''}${fmtMoney(totalPnl)}</div></div>
                    <div class="metric"><div class="label">币种/模式</div><div class="value" style="font-size:14px;color:${data.is_live ? '#f87171' : '#4ade80'}">${acc.currency || '--'} / ${data.mode || '--'}</div></div>
                `;

                document.getElementById('posCount').textContent = `(${activePositions.length} 个)`;

                // Table view (desktop)
                const tbody = document.getElementById('posBody');
                if (activePositions.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#8b949e">无持仓</td></tr>';
                } else {
                    tbody.innerHTML = activePositions.map(p => {
                        const isLong = p.qty > 0;
                        const pnlClass = (p.unrealized_pl || 0) >= 0 ? 'pnl-pos' : 'pnl-neg';
                        const pnlSign = (p.unrealized_pl || 0) >= 0 ? '+' : '';
                        const priceClass = p.cur_price > p.cost_price ? 'price-up' : (p.cur_price < p.cost_price ? 'price-down' : '');
                        return `<tr>
                            <td><b>${p.code}</b></td>
                            <td class="${isLong ? 'long' : 'short'}">${isLong ? 'LONG' : 'SHORT'}</td>
                            <td>${Math.abs(p.qty)}</td>
                            <td>$${fmt(p.cost_price)}</td>
                            <td class="${priceClass}">${p.cur_price > 0 ? '$' + fmt(p.cur_price) : '<span style="color:#484f58">盘后</span>'}</td>
                            <td>${fmtMoney(p.market_val)}</td>
                            <td class="${pnlClass}">${pnlSign}${fmtMoney(p.unrealized_pl)}</td>
                            <td class="${pnlClass}">${pnlPct(p)}</td>
                            <td>
                                <a href="/manual-trade?symbol=${p.code}" class="btn">交易</a>
                                <button class="btn btn-close" onclick="closePos('${p.code}', ${p.qty})">平仓</button>
                            </td>
                        </tr>`;
                    }).join('');
                }

                // Card view (mobile)
                const cards = document.getElementById('posCards');
                if (activePositions.length === 0) {
                    cards.innerHTML = '<div style="text-align:center;color:#8b949e;padding:20px">无持仓</div>';
                } else {
                    cards.innerHTML = activePositions.map(p => {
                        const isLong = p.qty > 0;
                        const pnlClass = (p.unrealized_pl || 0) >= 0 ? 'pnl-pos' : 'pnl-neg';
                        const pnlSign = (p.unrealized_pl || 0) >= 0 ? '+' : '';
                        return `<div class="pos-card">
                            <div class="pos-card-header">
                                <span class="code">${p.code}</span>
                                <span class="${isLong ? 'long' : 'short'}" style="font-size:13px">${isLong ? '📈 LONG' : '📉 SHORT'} ${Math.abs(p.qty)}股</span>
                            </div>
                            <div class="pos-card-row"><span class="label">成本</span><span>$${fmt(p.cost_price)}</span></div>
                            <div class="pos-card-row"><span class="label">现价</span><span>${p.cur_price > 0 ? '$' + fmt(p.cur_price) : '盘后'}</span></div>
                            <div class="pos-card-row"><span class="label">市值</span><span>${fmtMoney(p.market_val)}</span></div>
                            <div class="pos-card-row"><span class="label">盈亏</span><span class="${pnlClass}">${pnlSign}${fmtMoney(p.unrealized_pl)} (${pnlPct(p)})</span></div>
                            <div style="margin-top:8px;display:flex;gap:8px">
                                <a href="/manual-trade?symbol=${p.code}" class="btn" style="flex:1;text-align:center">交易</a>
                                <button class="btn btn-close" style="flex:1" onclick="closePos('${p.code}', ${p.qty})">平仓</button>
                            </div>
                        </div>`;
                    }).join('');
                }

                document.getElementById('refreshTime').textContent = `最后刷新: ${data.timestamp || new Date().toISOString()}`;

            } catch (e) {
                document.getElementById('metrics').innerHTML = `<div class="metric"><div class="label" style="color:#f87171">请求失败: ${e.message}</div></div>`;
            }
        }

        async function closePos(symbol, totalQty) {
            const absQty = Math.abs(parseInt(totalQty) || 0);
            if (absQty === 0) {
                alert(`${symbol} 持仓数量为 0，无法平仓`);
                return;
            }
            const qty = prompt(`平仓 ${symbol}\n当前持仓: ${absQty} 股\n\n输入平仓数量 (留空或 ${absQty} = 全平):`, '');
            if (qty === null) return;
            const closeQty = qty.trim() === '' ? 0 : parseInt(qty);
            if (isNaN(closeQty) || closeQty < 0) {
                alert('请输入有效数量');
                return;
            }
            if (closeQty > absQty) {
                alert(`平仓数量不能超过持仓 ${absQty} 股`);
                return;
            }
            const isFull = closeQty === 0 || closeQty >= absQty;
            const reason = prompt('平仓理由:', isFull ? '手动全平' : `手动部分平仓 ${closeQty}/${absQty}`);
            if (!reason) return;
            try {
                const res = await fetch('/api/orders/close', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ symbol, reason, quantity: closeQty }),
                });
                const data = await res.json();
                alert(data.success ? `✅ ${symbol} ${isFull ? '全平' : '部分平仓 '+closeQty+'股'} 成功!` : `❌ 平仓失败: ${data.error || '未知错误'}`);
                if (data.success) refresh();
            } catch (e) { alert(`❌ 请求异常: ${e.message}`); }
        }

        refresh();
        setInterval(refresh, 30000);
    </script>
</body>
</html>
