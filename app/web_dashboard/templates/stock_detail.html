<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个股分析 - {{ symbol }}</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, 'SF Mono', monospace; background: #0d1117; color: #e6edf3; }
        nav { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 20px; display: flex; gap: 20px; align-items: center; }
        nav a { color: #8b949e; text-decoration: none; font-size: 14px; padding: 4px 8px; border-radius: 4px; }
        nav a:hover, nav a.active { color: #e6edf3; background: #21262d; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 20px; margin-bottom: 16px; }
        h2 { font-size: 15px; color: #8b949e; margin: 16px 0 10px; text-transform: uppercase; letter-spacing: 0.5px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        @media (max-width: 900px) { .grid, .grid-3 { grid-template-columns: 1fr; } }

        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
        .card-full { grid-column: 1 / -1; }

        /* Chart */
        #chartContainer { width: 100%; height: 400px; }

        /* Indicators */
        .indicator-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .indicator { text-align: center; }
        .indicator .label { font-size: 11px; color: #8b949e; text-transform: uppercase; }
        .indicator .value { font-size: 16px; font-weight: 700; margin-top: 2px; }
        .green { color: #4ade80; }
        .red { color: #f87171; }
        .yellow { color: #fbbf24; }
        .blue { color: #60a5fa; }

        /* Order Book */
        .ob-row { display: flex; align-items: center; height: 24px; font-size: 12px; font-family: 'SF Mono', monospace; }
        .ob-row .bar { height: 100%; opacity: 0.3; position: absolute; }
        .ob-row.ask .bar { background: #f87171; right: 0; }
        .ob-row.bid .bar { background: #4ade80; left: 0; }
        .ob-row .price { position: relative; z-index: 1; flex: 1; padding: 0 8px; }
        .ob-row .vol { position: relative; z-index: 1; width: 80px; text-align: right; padding-right: 8px; }
        .ob-row .cnt { position: relative; z-index: 1; width: 50px; text-align: right; color: #8b949e; }
        .ob-header { display: flex; font-size: 10px; color: #484f58; padding: 4px 8px; text-transform: uppercase; }
        .ob-header span:first-child { flex: 1; }
        .ob-header span:nth-child(2) { width: 80px; text-align: right; }
        .ob-header span:nth-child(3) { width: 50px; text-align: right; }
        .ob-spread { text-align: center; padding: 6px; font-size: 12px; color: #8b949e; border-top: 1px solid #30363d; border-bottom: 1px solid #30363d; }

        /* Ticker */
        .ticker-list { max-height: 300px; overflow-y: auto; font-size: 12px; font-family: 'SF Mono', monospace; }
        .ticker-row { display: flex; padding: 3px 8px; border-bottom: 1px solid #21262d; }
        .ticker-row.buy { color: #4ade80; }
        .ticker-row.sell { color: #f87171; }
        .ticker-row .t-time { width: 80px; color: #8b949e; }
        .ticker-row .t-price { flex: 1; }
        .ticker-row .t-vol { width: 60px; text-align: right; }
        .ticker-row .t-dir { width: 30px; text-align: center; }

        /* Recommendation */
        .rec-box { text-align: center; padding: 20px; border-radius: 8px; margin-bottom: 12px; }
        .rec-box.green { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); }
        .rec-box.red { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); }
        .rec-box.yellow { background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3); }
        .rec-dir { font-size: 24px; font-weight: 700; }
        .rec-score { font-size: 12px; color: #8b949e; margin-top: 4px; }
        .signal-list { list-style: none; padding: 0; }
        .signal-list li { padding: 6px 0; border-bottom: 1px solid #21262d; font-size: 13px; display: flex; justify-content: space-between; }
        .signal-list li:last-child { border-bottom: none; }
        .tag { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px; }
        .tag.bullish { background: rgba(74,222,128,0.2); color: #4ade80; }
        .tag.bearish { background: rgba(248,113,113,0.2); color: #f87171; }
        .tag.neutral { background: rgba(139,148,158,0.2); color: #8b949e; }
        .tag.attention { background: rgba(96,165,250,0.2); color: #60a5fa; }

        /* Position card */
        .pos-info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; }
        .pos-info .item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #21262d; }
        .pos-info .item .k { color: #8b949e; }

        /* Ktype selector */
        .ktype-btns { display: flex; gap: 6px; margin-bottom: 10px; }
        .ktype-btns button { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .ktype-btns button.active { background: #388bfd33; border-color: #388bfd; color: #58a6ff; }

        .refresh-btn { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .refresh-btn:hover { background: #30363d; color: #e6edf3; }

        .empty { text-align: center; color: #484f58; padding: 40px; }
        .loading { text-align: center; color: #8b949e; padding: 20px; }
    </style>
</head>
<body>
    <nav>
        <a href="/">指挥中心</a>
        <a href="/trade">交易</a>
        <a href="/review">分析</a>
        <a href="/system">系统</a>
        <span style="flex:1"></span>
        <span style="font-size:13px;color:#8b949e" id="symbolLabel">{{ symbol }}</span>
    </nav>

    <div class="container">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
            <h1 style="margin:0" id="pageTitle">{{ symbol }}</h1>
            <button class="refresh-btn" onclick="loadAll()">🔄 刷新</button>
            <span style="font-size:12px;color:#8b949e" id="lastUpdate"></span>
        </div>

        <div class="grid">
            <!-- K线图 -->
            <div class="card card-full">
                <div style="display:flex;justify-content:space-between;align-items:center">
                    <h2>📈 K线图</h2>
                    <div class="ktype-btns">
                        <button onclick="loadKline('K_1M', this)">1分</button>
                        <button onclick="loadKline('K_5M', this)" class="active">5分</button>
                        <button onclick="loadKline('K_15M', this)">15分</button>
                        <button onclick="loadKline('K_60M', this)">1时</button>
                        <button onclick="loadKline('K_DAY', this)">日线</button>
                    </div>
                </div>
                <div id="chartContainer"></div>
            </div>

            <!-- 技术指标 -->
            <div class="card">
                <h2>📊 技术指标 (日线)</h2>
                <div class="indicator-grid" id="technicalsGrid">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <!-- 建议 -->
            <div class="card">
                <h2>🎯 规则信号</h2>
                <div id="recommendationBox">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <!-- AI 深度分析 -->
            <div class="card card-full">
                <div style="display:flex;justify-content:space-between;align-items:center">
                    <h2>🧠 AI 深度分析 (deepseek-v4-pro)</h2>
                    <button class="refresh-btn" onclick="loadLLM()">🔄 重新分析</button>
                </div>
                <div id="llmAnalysisBox">
                    <div class="loading">⏳ LLM 分析中（首次加载约10-20秒）...</div>
                </div>
            </div>

            <!-- 引擎持仓 -->
            <div class="card">
                <h2>🤖 引擎持仓</h2>
                <div id="positionBox">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <!-- 盘口 -->
            <div class="card">
                <h2>📋 盘口 (买卖五档)</h2>
                <div id="orderbookBox">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <!-- 逐笔成交 -->
            <div class="card card-full">
                <h2>⚡ 逐笔成交 (最近100笔)</h2>
                <div id="tickerBox">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SYMBOL = '{{ symbol }}';
        let chart, candleSeries, volumeSeries;

        function initChart() {
            const container = document.getElementById('chartContainer');
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: 400,
                layout: { background: { color: '#0d1117' }, textColor: '#e6edf3' },
                grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
                crosshair: { mode: 0 },
                timeScale: { timeVisible: true, secondsVisible: false },
            });
            candleSeries = chart.addCandlestickSeries({
                upColor: '#4ade80', downColor: '#f87171',
                borderUpColor: '#4ade80', borderDownColor: '#f87171',
                wickUpColor: '#4ade80', wickDownColor: '#f87171',
            });
            volumeSeries = chart.addHistogramSeries({
                priceFormat: { type: 'volume' },
                priceScaleId: '',
            });
            volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

            window.addEventListener('resize', () => {
                chart.applyOptions({ width: container.clientWidth });
            });
        }

        function parseFutuTime(t) {
            // Futu time format: "2026-06-10 09:30:00" or "2026-06-10"
            if (!t) return 0;
            const d = new Date(t.replace(' ', 'T') + (t.includes('T') ? '' : (t.length <= 10 ? 'T00:00:00' : '')));
            return Math.floor(d.getTime() / 1000);
        }

        async function loadKline(ktype, btn) {
            if (btn) {
                document.querySelectorAll('.ktype-btns button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            try {
                const res = await fetch(`/api/stock/${SYMBOL}/kline?ktype=${ktype}&num=100`);
                const data = await res.json();
                if (data.kline && data.kline.length > 0) {
                    const candles = data.kline.map(k => ({
                        time: parseFutuTime(k.time),
                        open: k.open, high: k.high, low: k.low, close: k.close,
                    })).filter(c => c.time > 0);
                    const volumes = data.kline.map(k => ({
                        time: parseFutuTime(k.time),
                        value: k.volume,
                        color: k.close >= k.open ? 'rgba(74,222,128,0.3)' : 'rgba(248,113,113,0.3)',
                    })).filter(c => c.time > 0);
                    candleSeries.setData(candles);
                    volumeSeries.setData(volumes);
                    chart.timeScale().fitContent();
                }
            } catch (e) {
                console.error('Kline error:', e);
            }
        }

        async function loadTechnicals() {
            try {
                const res = await fetch(`/api/stock/${SYMBOL}/analysis`);
                const data = await res.json();
                renderTechnicals(data.technicals || {});
                renderRecommendation(data.recommendation || {});
                renderPosition(data.position);
            } catch (e) {
                console.error('Analysis error:', e);
            }
        }

        function renderTechnicals(t) {
            const el = document.getElementById('technicalsGrid');
            if (t.error) { el.innerHTML = '<div class="empty">❌ ' + t.error + '</div>'; return; }
            if (!t.cur_price) { el.innerHTML = '<div class="empty">无数据</div>'; return; }

            const items = [
                { label: '现价', value: '$' + t.cur_price, cls: '' },
                { label: 'MA5', value: t.ma5 ? '$' + t.ma5 : '--', cls: t.cur_price > (t.ma5||0) ? 'green' : 'red' },
                { label: 'MA10', value: t.ma10 ? '$' + t.ma10 : '--', cls: t.cur_price > (t.ma10||0) ? 'green' : 'red' },
                { label: 'MA20', value: t.ma20 ? '$' + t.ma20 : '--', cls: t.cur_price > (t.ma20||0) ? 'green' : 'red' },
                { label: 'MA60', value: t.ma60 ? '$' + t.ma60 : '--', cls: t.ma60 ? (t.cur_price > t.ma60 ? 'green' : 'red') : '' },
                { label: 'RSI(14)', value: t.rsi14 != null ? t.rsi14.toFixed(1) : '--', cls: t.rsi14 > 70 ? 'red' : t.rsi14 < 30 ? 'green' : '' },
                { label: 'MACD', value: t.macd != null ? t.macd.toFixed(4) : '--', cls: t.macd > 0 ? 'green' : 'red' },
                { label: 'Signal', value: t.macd_signal != null ? t.macd_signal.toFixed(4) : '--', cls: '' },
                { label: 'Hist', value: t.macd_hist != null ? t.macd_hist.toFixed(4) : '--', cls: t.macd_hist > 0 ? 'green' : 'red' },
                { label: 'ATR(14)', value: t.atr14 ? '$' + t.atr14 : '--', cls: '' },
                { label: '成交量', value: t.vol_current ? (t.vol_current/1000000).toFixed(1)+'M' : '--', cls: '' },
                { label: '量比', value: t.vol_ratio ? t.vol_ratio.toFixed(2) + 'x' : '--', cls: t.vol_ratio > 2 ? 'yellow' : '' },
            ];
            el.innerHTML = items.map(i =>
                '<div class="indicator"><div class="label">' + i.label + '</div><div class="value ' + i.cls + '">' + i.value + '</div></div>'
            ).join('');
        }

        function renderRecommendation(r) {
            const el = document.getElementById('recommendationBox');
            if (!r.direction) { el.innerHTML = '<div class="empty">无法生成建议</div>'; return; }

            const signalsHtml = (r.signals || []).map(s => {
                const cls = s[1].replace('+', '');
                return '<li><span>' + s[0] + '</span><span class="tag ' + cls + '">' + cls + '</span></li>';
            }).join('');

            el.innerHTML =
                '<div class="rec-box ' + r.color + '">' +
                '<div class="rec-dir ' + r.color + '">' + r.direction + '</div>' +
                '<div class="rec-score">综合评分: ' + (r.score > 0 ? '+' : '') + r.score + '</div>' +
                '</div>' +
                '<ul class="signal-list">' + signalsHtml + '</ul>';
        }

        function renderPosition(pos) {
            const el = document.getElementById('positionBox');
            if (!pos) { el.innerHTML = '<div class="empty">引擎无此标的持仓</div>'; return; }

            const pnl = pos.current_price && pos.entry_price ?
                (pos.direction === 'LONG' ?
                    ((pos.current_price - pos.entry_price) / pos.entry_price * 100).toFixed(2) :
                    ((pos.entry_price - pos.current_price) / pos.entry_price * 100).toFixed(2)
                ) : '--';
            const pnlCls = parseFloat(pnl) >= 0 ? 'green' : 'red';

            el.innerHTML =
                '<div class="pos-info">' +
                '<div class="item"><span class="k">方向</span><span class="' + (pos.direction === 'LONG' ? 'green' : 'red') + '">' + pos.direction + '</span></div>' +
                '<div class="item"><span class="k">数量</span><span>' + pos.quantity + '</span></div>' +
                '<div class="item"><span class="k">入场价</span><span>$' + (pos.entry_price || '--') + '</span></div>' +
                '<div class="item"><span class="k">现价</span><span>$' + (pos.current_price || '--') + '</span></div>' +
                '<div class="item"><span class="k">止损</span><span class="red">$' + (pos.stop_loss || '--') + '</span></div>' +
                '<div class="item"><span class="k">止盈</span><span class="green">$' + (pos.take_profit || '--') + '</span></div>' +
                '<div class="item"><span class="k">浮盈%</span><span class="' + pnlCls + '">' + (pnl >= 0 ? '+' : '') + pnl + '%</span></div>' +
                '</div>' +
                '<div style="margin-top:10px;text-align:center">' +
                '<a href="/trade?symbol=' + encodeURIComponent(SYMBOL) + '" style="color:#58a6ff;font-size:13px">→ 前往交易页操作</a>' +
                '</div>';
        }

        async function loadOrderbook() {
            const el = document.getElementById('orderbookBox');
            try {
                const res = await fetch(`/api/stock/${SYMBOL}/orderbook`);
                const data = await res.json();
                if (data.error) { el.innerHTML = '<div class="empty">❌ ' + data.error + '</div>'; return; }

                const asks = (data.asks || []).slice(0, 5).reverse();
                const bids = (data.bids || []).slice(0, 5);
                const maxVol = Math.max(...[...asks, ...bids].map(x => x.volume), 1);

                const spread = (asks.length && bids.length) ?
                    ((asks[asks.length-1].price - bids[0].price) / bids[0].price * 100).toFixed(3) + '%' : '--';

                let html = '<div class="ob-header"><span>价格</span><span>数量</span><span>笔数</span></div>';

                asks.forEach(a => {
                    const w = (a.volume / maxVol * 100).toFixed(1);
                    html += '<div class="ob-row ask" style="position:relative"><div class="bar" style="width:' + w + '%"></div><span class="price red">' + a.price.toFixed(2) + '</span><span class="vol">' + a.volume + '</span><span class="cnt">' + a.order_count + '</span></div>';
                });

                html += '<div class="ob-spread">价差: ' + spread + '</div>';

                bids.forEach(b => {
                    const w = (b.volume / maxVol * 100).toFixed(1);
                    html += '<div class="ob-row bid" style="position:relative"><div class="bar" style="width:' + w + '%"></div><span class="price green">' + b.price.toFixed(2) + '</span><span class="vol">' + b.volume + '</span><span class="cnt">' + b.order_count + '</span></div>';
                });

                el.innerHTML = html;
            } catch (e) {
                el.innerHTML = '<div class="empty">加载失败</div>';
            }
        }

        async function loadTicker() {
            const el = document.getElementById('tickerBox');
            try {
                const res = await fetch(`/api/stock/${SYMBOL}/ticker?num=100`);
                const data = await res.json();
                if (data.error) { el.innerHTML = '<div class="empty">❌ ' + data.error + '</div>'; return; }
                if (!data.ticker || !data.ticker.length) { el.innerHTML = '<div class="empty">无逐笔数据 (盘后)</div>'; return; }

                // Show most recent first
                const tickers = data.ticker.slice().reverse();
                let html = '<div class="ticker-list">';
                tickers.forEach(t => {
                    const dir = (t.direction || '').toLowerCase();
                    const cls = dir.includes('buy') || dir === 'b' ? 'buy' : dir.includes('sell') || dir === 's' ? 'sell' : '';
                    const dirIcon = cls === 'buy' ? '▲' : cls === 'sell' ? '▼' : '·';
                    const time = (t.time || '').split(' ').pop().slice(0, 8);
                    html += '<div class="ticker-row ' + cls + '">' +
                        '<span class="t-time">' + time + '</span>' +
                        '<span class="t-dir">' + dirIcon + '</span>' +
                        '<span class="t-price">$' + t.price.toFixed(2) + '</span>' +
                        '<span class="t-vol">' + t.volume + '</span>' +
                        '</div>';
                });
                html += '</div>';

                // Summary: buy vs sell pressure
                const buys = data.ticker.filter(t => { const d = (t.direction||'').toLowerCase(); return d.includes('buy') || d === 'b'; });
                const sells = data.ticker.filter(t => { const d = (t.direction||'').toLowerCase(); return d.includes('sell') || d === 's'; });
                const buyVol = buys.reduce((s, t) => s + t.volume, 0);
                const sellVol = sells.reduce((s, t) => s + t.volume, 0);
                const total = buyVol + sellVol;
                const buyPct = total > 0 ? (buyVol / total * 100).toFixed(1) : 50;
                const sellPct = total > 0 ? (sellVol / total * 100).toFixed(1) : 50;

                html = '<div style="display:flex;gap:20px;margin-bottom:10px;font-size:13px">' +
                    '<span>🟢 买入: <strong>' + buyVol + '</strong> (' + buyPct + '%)</span>' +
                    '<span>🔴 卖出: <strong>' + sellVol + '</strong> (' + sellPct + '%)</span>' +
                    '<span style="color:#8b949e">买卖比: ' + (sellVol > 0 ? (buyVol/sellVol).toFixed(2) : '--') + '</span>' +
                    '</div>' + html;

                el.innerHTML = html;
            } catch (e) {
                el.innerHTML = '<div class="empty">加载失败</div>';
            }
        }

        async function loadLLM() {
            const el = document.getElementById('llmAnalysisBox');
            el.innerHTML = '<div class="loading">⏳ LLM 分析中（约10-20秒）...</div>';
            try {
                const res = await fetch(`/api/stock/${SYMBOL}/llm-analysis`);
                const data = await res.json();
                if (data.error) {
                    el.innerHTML = '<div class="empty">❌ ' + data.error + '</div>';
                    return;
                }
                const a = data.analysis || {};
                const dirColor = a.direction === 'LONG' ? 'green' : a.direction === 'SHORT' ? 'red' : 'yellow';
                const confPct = ((a.confidence || 0) * 100).toFixed(0);

                el.innerHTML =
                    '<div style="display:grid;grid-template-columns:200px 1fr;gap:16px">' +
                    // 左侧：方向 + 置信度
                    '<div class="rec-box ' + dirColor + '" style="display:flex;flex-direction:column;justify-content:center">' +
                    '<div class="rec-dir ' + dirColor + '">' + (a.direction || '--') + '</div>' +
                    '<div class="rec-score">置信度: ' + confPct + '%</div>' +
                    '<div style="margin-top:8px;font-size:18px;font-weight:700">' + (a.action || '--') + '</div>' +
                    '</div>' +
                    // 右侧：分析内容
                    '<div>' +
                    '<div style="font-size:15px;font-weight:600;margin-bottom:8px">' + (a.summary || '') + '</div>' +
                    '<div style="font-size:13px;color:#c9d1d9;line-height:1.6;margin-bottom:12px">' + (a.reasoning || '') + '</div>' +
                    '<div style="display:flex;gap:16px;font-size:13px;margin-bottom:8px">' +
                    (a.key_levels ? '<span>支撑: <strong class="green">$' + (a.key_levels.support || '--') + '</strong></span>' +
                    '<span>阻力: <strong class="red">$' + (a.key_levels.resistance || '--') + '</strong></span>' : '') +
                    '</div>' +
                    (a.risk_notes ? '<div style="font-size:12px;color:#fbbf24;padding:6px 10px;background:rgba(251,191,36,0.1);border-radius:4px">⚠ ' + a.risk_notes + '</div>' : '') +
                    '</div></div>' +
                    '<div style="margin-top:12px;font-size:11px;color:#484f58">模型: ' + (data.model_used || '--') + ' | 延迟: ' + ((data.latency_ms || 0)/1000).toFixed(1) + 's</div>';
            } catch (e) {
                el.innerHTML = '<div class="empty">❌ 请求失败: ' + e.message + '</div>';
            }
        }

        async function loadAll() {
            document.getElementById('lastUpdate').textContent = '更新中...';
            initChart();
            await Promise.all([
                loadKline('K_5M'),
                loadTechnicals(),
                loadOrderbook(),
                loadTicker(),
            ]);
            document.getElementById('lastUpdate').textContent = '更新于 ' + new Date().toLocaleTimeString();
            // LLM 分析异步加载（不阻塞其他内容）
            loadLLM();
        }

        // Auto refresh every 30s
        setInterval(() => {
            loadOrderbook();
            loadTicker();
        }, 30000);

        loadAll();
    </script>
</body>
</html>
