# ============================================================
# FTSeek-US 退出策略 — 主线生产 SSOT (Single Source of Truth)
# ============================================================
# 适用范围: 主线 ExitRuleDispatcher / ExitMonitor / atr_stop_engine
# 读取者: app/risk/position_exit_monitor.py, app/risk/exit_rule_dispatcher.py
#         app/pipeline/position_monitor.py
#
# ⚠️ 不要与以下 yaml 混淆:
#   - config/exit_profiles.yaml — harness/shadow_bridge 影子系统专用 (回测/辩论)
#                                  即使参数名相同 (如 activation_profit_atr) 也是
#                                  独立配置, 改这里不会影响 shadow, 反之亦然
#   - config/unified_config.yaml::dynamic_exit — regime-aware 兜底参数, 优先级低于本表
#
# 设计原则:
# 1. 主线退出参数只在此文件定义, 代码只读取不硬编码
# 2. 修改策略 = 改 YAML, 不需要改 Python 代码
# 3. 启动时强制校验: 代码逻辑必须覆盖此文件所有规则
# ============================================================

version: "2.5"
last_updated: "2026-05-31"
design_rationale: "ATR动态止损 + 分层止盈 + 行业差异化 + 日内短线模式 + session-aware ATR + 时间加权盘末退出 (P2优化) | Phase 3 (2026-05-31): 参数完全外部化 + ATR下限/财报上限 + ExitRuleDispatcher 影子模式"

# ── Phase 3 (2026-05-31): 渐进式追踪止损参数外部化 ──
# _update_trail_state 中 4 档渐进 SL 的所有 magic number 集中到此处
progressive_trailing:
  enabled: true
  # 各档触发的 ATR 利润阈值 (与 _update_trail_state 4 档对齐)
  tier_thresholds_atr:
    tier1_max: 0.5      # <0.5 ATR: 不动 (固定 SL)
    tier2_max: 1.0      # 0.5~1.0 ATR: 保本
    tier3_max: 2.0      # 1.0~2.0 ATR: 紧凑追踪
    # >=2.0 ATR: 标准追踪 (使用 chandelier_trail.multiplier_by_regime)
  tier3_compact_multiplier: 1.2    # 1.0~2.0 ATR: peak - 1.2×ATR (原 1.5, Phase 3 收紧)
  tier2_compact_multiplier: 0.8    # 0.5~1.0 ATR: peak - 0.8×ATR (原 breakeven, Phase 3 紧凑追踪)
  breakeven_buffer_pct: 0.001       # 保本 buffer = 入场价 × 0.1%
  fallback_long_sl_pct: 0.92        # 兜底 LONG SL (无 ATR/policy 时)
  fallback_short_sl_pct: 1.08       # 兜底 SHORT SL
  # P1 修复 (2026-05-29): effective_atr 下限 (防止 session_ratio 极端缩水)
  effective_atr_floor_ratio: 0.35   # effective_atr ≥ daily_atr × 0.35
  # ATR Volatility Floor 系数 (atr ≥ median_tr_200d × coef)
  atr_floor_coef: 0.85
  # ATR 下限百分比 (Phase 3 新增): atr ≥ price × pct/100
  atr_floor_price_pct: 0.0          # 默认 0 表示不启用，可根据需要打开
  # 保留入场 session ratio cosine 平滑窗口 (分钟)
  session_blend_window_minutes: 90.0

# ── RFC-057 (2026-06-01): 全局入场冷却 (grace period) ──
# 数据驱动 (n=60): <30min 持仓 31.7% wr -$27,437 (占总亏损 188%)
# 30min-1h: 25% wr +$14,970 (放过噪声窗口反而盈利)
# 入场后 min_hold_minutes 内仅允许 flash_exit / circuit_breaker / earnings_guard
# 其他规则 (trailing_stop / day_trade / scale_out / time_decay / velocity_exit) 被屏蔽
# 安全底线: 浮亏 >= max_grace_loss_pct (-3%) 立即解除保护, 防止 grace 包过宽导致大亏
global_hold_protection:
  enabled: true
  min_hold_minutes_after_entry: 30  # P0 (2026-06-03): 10→30min, 减少入场后立即止损
  max_grace_loss_pct: 0.03          # 浮亏 >=3% 立即解除保护 (硬底兜底)
  allowed_during_grace:
    - circuit_breaker
    - earnings_guard                # 财报突发也必须能逃
    - pre_close                     # 盘末退出 (避免隔夜跳空)
    # M4 (2026-06-03): 移除 flash_exit — 数据证明入场后 120s 内闪退 173 次全部误触发
    # flash_exit 已由 min_holding_seconds=120 独立保护, 无需穿透 grace period
  log_each_block: true              # 每次屏蔽记日志便于审计

# ── Phase 3 (2026-05-31): 退出监控调度参数 ──
exit_monitor:
  scan_interval_seconds: 60         # 扫描周期 (分钟以下)
  cooldown_seconds: 120             # 同一持仓退出冷却
  min_hold_minutes: 30              # P0 (2026-06-03): 20→30min, 匹配 grace period

# ── Phase 3 (2026-05-31): 退出规则互斥 (新 ExitRuleDispatcher 使用) ──
# key=高优先级触发的规则, value=被压制不再上报的规则列表
exit_rules_exclusivity:
  pre_close: [day_trade, trailing_stop, scale_out, time_decay]
  flash_exit: [day_trade, trailing_stop, scale_out]
  earnings_guard: [day_trade, trailing_stop, scale_out, time_decay]
  trailing_stop: [time_decay]
  day_trade: [time_decay]

# ── 全局风控 ──
global:
  max_daily_drawdown_pct: 3.0       # 日最大回撤 3%
  max_consecutive_losses: 3          # 连续亏损 3 次熔断
  max_total_positions: 8             # 最大持仓数
  max_position_pct: 15               # 单仓最大占比 15%

# ── 退出规则定义 (唯一真相源) ──
exit_rules:
  
  # 规则 1: Flash Exit (60秒内剧烈波动)
  # P0 禁用 (2026-06-03): 6笔全亏 0% WR -$1,362, 纯噪音
  flash_exit:
    enabled: false
    trigger: "adverse_move >= flash_multiplier * atr"
    scan_interval_seconds: 60             # 优化 (2026-05-03 P2): 从 30s 延长到 60s, 降低假触发率
    flash_multiplier_default: 2.0         # 根因修复 (2026-06-02): 1.0→2.0, dispatcher 改用速度检测 (prev→current), 2×ATR_raw 才是真闪崩
    earnings_multiplier: 1.5              # 财报期放宽到 1.5x
    min_atr: 0.5                          # ATR 底限
    min_holding_seconds: 120              # 根因修复 (2026-06-02): 30s→120s, 给信号发展时间 (30s 导致 173 次误触发)

  # 规则 2: ATR 动态止损 (替代固定 -8%)
  atr_stop:
    enabled: true
    method: "entry_price - atr * multiplier"
    # 非线性状态机：根据利润深度调整 ATR 倍数
    # 优化 (2026-05-03): 收紧整体倍数以匹配 PRE_CLOSE_EXIT 豁免节奏
    # 优化 (2026-05-30 Task#7): 3档扩展为5档, 让退出曲线更贴合波动特征, 减少"由盈转亏"
    multiplier_by_profit:
      initial: 3.0                   # P0 (2026-06-03): 2.0→3.0, 减少92笔1h内sl_hit
      profit_05atr: 1.8             # 新增 (2026-05-30): 盈利≥0.5ATR 即开始收紧锁利
      profit_1atr: 1.6              # 收紧 (2026-05-30): 1.8 → 1.6, 更积极锁利
      profit_2atr: 1.4              # 新增 (2026-05-30): 盈利≥2ATR 进一步收紧
      profit_5atr: 1.2              # 保持: 大盈利最紧凑 (锁定利润)
    # 硬底限：任何情况不超过成本的 -15%
    max_loss_pct: 15.0
    # 波动率底限：ATR 不能低于 200 日中位 TR 的 70%
    atr_floor_pct: 70

  # 规则 3: Chandelier 追踪止损 (替代固定 3% 回撤)
  chandelier_trail:
    enabled: true
    activation_profit_atr: 0.6      # RFC-055: 0.8→0.6ATR, 更早激活追踪锁利 (SHORT 55.8%WR)
    multiplier_by_regime:
      normal: 2.5                   # 优化 (2026-05-03): 从 2.0 放宽到 2.5, 给利润更多呼吸空间
      trending: 3.5                 # 优化 (2026-05-03): 从 3.0 放宽到 3.5, 趋势市让利润奔跑
      volatile: 2.0                 # 优化 (2026-05-03): 从 1.5 放宽到 2.0, 震荡市适度收紧
    # 止损线只能上移（多头）/下移（空头），永不倒退
    ratchet: true

  # 规则 4: 保本触发
  breakeven:
    enabled: true
    trigger_profit_atr: 0.4         # 优化 (2026-05-30 Task#7): 从 0.5 降至 0.4, 保本触发更积极
    buffer_pct: 0.15                # 优化 (2026-05-30 Task#7): 从 0.2% 降至 0.15%, 减少滑点摩擦 (单位: 百分比 0.15 = 0.15%)

  # 规则 5: 分层止盈 (分批减仓)
  scale_out:
    enabled: true
    tier_mode: atr                  # Phase 3: atr | pct (默认 ATR 模式)
    atr_tiers:                      # RFC-055: 4层→2层, 减少过早减仓, 让利润发展
      - profit_atr: 1.5
        close_pct: 30
        ratchet_sl_pct: 0.8
      - profit_atr: 3.0
        close_pct: 70
        ratchet_sl_pct: 1.5
        trailing_remainder: true
    tiers:                          # pct 模式 (向后兼容, tier_mode=pct 时使用)
      # Fix 9 (2026-05-31): 对齐代码 DEFAULT_TIERS — trigger_pct 使用小数 (0.015=1.5%)
      - trigger_pct: 0.015           # 1.5% (was 5.0%)
        close_pct: 25                # 25% (was 30%)
        new_stop_pct: 0.005          # 止损上移至 entry+0.5%
      - trigger_pct: 0.030           # 3.0% (was 10.0%)
        close_pct: 25                # 25% (was 30%)
        new_stop_pct: 0.015          # 止损上移至 entry+1.5%
      - trigger_pct: 0.050           # 5.0% (was 18.0%)
        close_pct: 25                # 25% (was 40%)
        new_stop_pct: 0.030          # 止损上移至 entry+3.0%

  # 规则 5.5: 速度捕捉退出 (Phase 3 2026-05-31)
  velocity_exit:
    enabled: false                   # P0 (2026-06-03): 禁用，样本不足且与 trailing_stop 冲突
    lookback_bars: 3              # 检测最近 N 根 K 线的变动
    sigma_window: 20              # σ 计算窗口 (K 线数)
    sigma_multiplier: 2.0         # 触发阈值: 变动 > N × σ
    close_pct: 30                 # 平仓比例 (%)
    cooldown_seconds: 60          # 冷却时间
    trail_mult: 1.0               # 触发后收紧追踪止损到此 ATR 倍数

  # 规则 3.5: 盘末退出 (Pre-Close Exit) — 优化 (2026-05-03 P2)
  # 根因修复: 原单一 1 ATR 阈值导致 54% 仓位被动强平, 平均利润仅 +0.08%
  # 新方案: 分层退出 + 时间加权 + 亏损仓位强制平仓 + 小利润仓位减仓
  pre_close_exit:
    enabled: true
    window_minutes: 8               # RFC-055: 15→8min, 让利润有更多发展空间 (54%被强平)
    # ── P1 修复 (2026-05-08): 入场后最小持有时间保护 ──
    min_hold_minutes_before_pre_close: 30  # 持仓 <30 分钟不触发盘末退出
    # ── 时间加权: 距收盘越近, 退出越积极 ──
    time_weighted: true             # 优化 (2026-05-03 P2): 新增时间加权机制
    # 距收盘 <5min: 所有阈值 ×0.6 (更积极退出, 避免隔夜跳空风险)
    urgent_threshold_mult: 0.6      # 紧急窗口乘数 (<5min)
    # 距收盘 5~10min: 所有阈值 ×0.8
    warning_threshold_mult: 0.8     # 警告窗口乘数 (5~10min)
    # 距收盘 10~15min: 所有阈值 ×1.0 (标准)
    # ── 分层退出 ──
    # 层1: 亏损仓位 → 全平 (不持有亏损过夜)
    loss_flat: true
    # 层2: 0~0.5 ATR 微利 → 减半仓 (降低隔夜风险敞口)
    half_exit_below_atr: 0.5        # 低于 0.5 ATR 减半
    # 层3: 0.5~1.0 ATR → 减 1/4
    quarter_exit_below_atr: 1.0     # 低于 1.0 ATR 减1/4
    # 层4: ≥1.0 ATR → 保留过夜 (不变)
    hold_threshold_atr: 1.0         # 盈利≥1 ATR 可持有过夜

  # ── Task #3 (2026-05-31): 自适应分级退出 ──
  # 目标: PRE_CLOSE 占比 54% → <35%, 让利润仓位有更多时间达到目标
  # 调度入口: ExitRuleDispatcher._eval_pre_close (mode=adaptive 时启用)
  pre_close:
    enabled: true
    mode: adaptive                  # adaptive | legacy
    profit_exit:
      min_profit_atr: 1.0           # PnL >= 1.0 ATR → 锁利全平
      close_ratio: 1.0
    breakeven_exit:
      tolerance_atr: 0.3            # |PnL| < 0.3 ATR → 持平减半仓
      close_ratio: 0.50
    loss_exit:
      min_loss_atr: 1.5             # PnL <= -1.5 ATR → 止损全平
      close_ratio: 1.0
    force_close_remaining: false    # 中间地带 (0.3~1.0 / -1.5~-0.3) 不强平, 允许过夜
    window_minutes:
      trending: 10                  # 趋势市: 收盘前 10 分钟
      range_bound: 5                # 震荡市: 收盘前 5 分钟 (早平无价值持仓)
      high_vol: 15                  # 高波动: 收盘前 15 分钟 (保守)
      default: 10

  # 规则 6: 时间止损
  # O3 (2026-05-16): 禁用 — 30天 sharpe=-0.40, win_rate=29% (5/15 exit_reason_pnl 报告)
  # 退出时机更应由价格行为 (chandelier/SL) 决定, 而非时间. 之前 7 笔 time_stop 平均亏损 -0.53%.
  # 回退方式: enabled: true (主线), 短线 time_gate 仍生效不受影响.
  time_stop:
    enabled: true                   # RFC-055: 重新启用 — 甜蜜区30min-6hr, >6hr亏-$17K
    max_holding_hours: 6            # RFC-055: 72→6h, 匹配盈利甜蜜区上限
    min_profit_to_hold: 1.0         # RFC-055: 2.0%→1.0ATR, 盈利仓位可豁免
    extension_hours: 2              # RFC-055: 24→2h, 短线不加长延时

  # 规则 6.5: 成本缓冲 (与 cost_model 联动)
  # 在最终止损线外额外让出 k × 双边总成本, 规避被噪声成本打穿
  # 例: cost_bps=10, current=100, k=1.5 → buffer = 100 × 10/10000 × 1.5 = 0.15
  cost_buffer:
    enabled: true
    k: 1.5                          # 让利乘子（1.0=刚好覆盖成本，1.5=留安全带）

  # 规则 7: 财报保护
  earnings_guard:
    enabled: true
    days_before: 2                  # 财报前 2 天收紧
    days_after: 1                   # 财报后 1 天收紧
    action: "reduce_position_50pct" # 减仓 50%
    flash_multiplier_override: 0.5  # Flash Exit 阈值减半

# ── 行业差异化配置 ──
sector_overrides:
  tech:                             # 科技股 (高波动)
    atr_multiplier: 3.0             # 放宽到 3.0x
    flash_multiplier: 1.0
  biotech:                          # 生物制药 (极高风险)
    atr_multiplier: 3.5
    max_position_pct: 5             # 单仓不超过 5%
  utility:                          # 公用事业 (低波动)
    atr_multiplier: 2.0
    flash_multiplier: 0.6
  default:                          # 默认
    atr_multiplier: 3.0             # P0 (2026-06-03): 2.0→3.0, 匹配 atr_stop.initial
    flash_multiplier: 1.0           # 优化 (2026-05-03): 从 0.8 提高到 1.0, 匹配 flash_exit 新基准

# ── 做空差异化 ──
short_overrides:
  atr_multiplier: 2.0              # 做空止损更紧 (2.0x vs 2.5x)
  max_loss_pct: 10.0               # 最大亏损 10% (做多 15%)

  # 幻方 Principle: 追踪止损加速收紧 (做空反弹更暴力)
  trail_multiplier:
    normal: 1.5                    # 正常市况：峰值 + 1.5x ATR
    trending: 1.2                  # 趋势市：峰值 + 1.2x ATR (更紧)
    volatile: 1.0                  # 震荡市：峰值 + 1.0x ATR (极紧)

  # 幻方 Principle: 时间止损加速 (做空需要催化驱动)
  time_stop:
    max_holding_hours: 48          # 做空最大 48h (做多 72h)
    acceleration_enabled: true
    day2_multiplier: 0.8           # 第 2 天收紧到 80%
    day3_multiplier: 0.6           # 第 3 天收紧到 60%

  # 幻方 Principle: 技术破位快速平仓
  technical_breach:
    enabled: true                     # P0 修复 (2026-05-08): 显式开关
    trigger_atr_mult: 3.0             # P0 (2026-06-03): 2.0→3.0, 减少 STRUCTURE_EXIT 误触发 (33笔 30%WR -$3,106)
                                      #   注意：unified_config.yaml 的 breach_threshold_pct 不影响此处逻辑
    cover_pct: 100                    # 平仓 100%
    # P0 修复 (2026-05-08): 防呆机制
    require_resistance_20d: true      # 必须存在真实阻力位，禁止降级到 peak_price
    min_loss_pct: 1.0                 # P3 优化 (2026-05-22): 0.5→1.0 最小亏损门槛提高，减少微亏误杀
    entry_cooldown_minutes: 60        # P3 优化 (2026-05-22): 30→60min 给足行情发展空间

  scale_out:                       # 做空止盈更积极
    tier_1_pct: 10.0               # +10% 平 40%
    tier_2_pct: 20.0               # +20% 平 60%

# ── 时段自适应 (P2 2026-05-01 新增, 幻方架构)
# 修复 (2026-05-12): opening_drive session Flash Exit 最低阈值 1.5x ATR
# 根因: 开盘前 5 分钟波动本身 2-3x ATR, 原 1.0x 阈值易误触发 (QCOM 亏损 -4.8%)
# 原则: 不在 YAML 里放参数表。所有 session 参数从 SharedKernel 派生。
# YAML 只定义"是否启用"和"数据来源"。参数值由 SharedKernel.calibrate_scalers_from_data()
# 从实盘振幅数据 + 退出质量反馈 自动校准。
#
# 生效机制:
#   ExitMonitor.scan_positions() → effective_atr = atr × session_vol_ratio
#   session_vol_ratio 来自 SharedKernel.DEFAULT_SESSION_VOL_RATIO
#   一个 ratio 影响全部 5 条退出规则 (Flash/ATR/Chandelier/DayTrade/TimeDecay)
#
# 时段波动率比值 (参考值, 实际由 SharedKernel 校准):
#   opening_drive:  1.50  (开盘 1.5x 日均波动 → 所有止损自动放宽)
#   morning:        1.20  (早盘 1.2x)
#   midday:         0.75  (午盘 0.75x → 适度收紧, 2026-05-30 Task#7 从 0.60 抬升)
#   afternoon:      0.95  (午后 0.95x)
#   closing_drive:  1.00  (尾盘 1.0x → 回归基准, 2026-05-30 Task#7 从 1.15 下调)
session_adaptation:
  enabled: true
  source: "shared_kernel"          # 参数值从 SharedKernel 取，不在此定义
  apply_to:
    - flash_exit                   # Flash Exit 乘数 × session_vol_ratio
    - atr_stop                     # ATR 止损距离 × session_vol_ratio
    - chandelier_trail             # Chandelier 追踪 × session_vol_ratio
    - day_trade_initial_stop       # 短线初始止损 × session_vol_ratio
    - day_trade_time_decay         # 短线时间衰减速率 × session_vol_ratio
  path_dependency:                 # 入口 session 信息传递到出口
    enabled: true
    rule: "低置信度 session 入场 (opening_drive) → 止损收紧 0.85x"

# ── 日内/短线主动管理模式 (P1 2026-05-01 新增) ──
# 问题: 趋势跟踪模式 (v2.1) 的 exit 阈值太高 (2ATR激活追踪, 8%分层止盈),
#       实际1-3天短线持仓永远达不到触发条件, 导致所有退出都是 PRE_CLOSE_EXIT 强制平仓。
# 方案: 新增 day_trade_mode, 从入场即生效的紧止损, 到小幅止盈的利润锁定,
#       让短线策略也能主动退出而非被动等收盘。
day_trade_mode:
  enabled: true
  # 适用条件: 非财报期 + 非ETF + 持仓时间<3天
  apply_conditions:
    exclude_etf: true               # ETF(QQQ/SPY等)不适合短线模式
    exclude_earnings_period: true   # 财报期波动异常, 使用趋势模式
    max_holding_days: 3             # 持有>3天自动切换趋势模式

  # F11+F12 修复 (2026-05-12): R/R 从 0.6 → 2.67, profit_lock 禁用 (chandelier 接管)
  # 原 R/R = 3%/5% = 0.6 → 盈亏平衡需要 77% 胜率 → 结构性负 EV
  # 新 R/R = 8%/3% = 2.67 → 盈亏平衡仅需 27% 胜率
  initial_stop:
    atr_multiplier: 1.5             # 收紧: 从 1.8x → 1.5x
    max_loss_pct: 3.0               # 收紧: 从 5.0% → 3.0%
    atr_source: "5min"

  # 主动止盈 — 3 档分层
  take_profit:
    tier_1:
      profit_pct: 4.0               # 从 3.0% → 4.0%
      close_pct: 33                 # 从 50% → 33% (只平 1/3)
      move_sl_to: "breakeven"
    tier_2:
      profit_pct: 8.0               # 从 6.0% → 8.0%
      close_pct: 33                 # 从 50% → 33%
      move_sl_to: "chandelier_2x"   # 新增: 切换到 Chandelier 追踪
    tier_3:                         # 新增
      profit_pct: 15.0
      close_pct: 100                # 剩余清仓

  # F12: 浮盈保护禁用 — 由 chandelier_trail 接管, 避免框死利润
  profit_lock:
    enabled: false                  # DEPRECATED 2026-05-12
    # 例: 买入$100, 涨到$102 (+2%) → 激活保护 → 回撤到$100.80 时退出, 锁定+0.8%

  # 时间衰减: 持仓无进展自动退出
  # 修复 (2026-05-12): 隔夜持仓重置基准时间 + 首次扫描 30min 宽限期
  time_decay:
    enabled: true
    max_idle_minutes: 60            # 模拟盘: 90→60min, 加速信号轮转
    min_progress_pct: 0.5           # 优化: 从 0.2% 提到 0.5% (避免无意义进展判断)
    grace_period_minutes: 30        # 修复 (2026-05-12): 首次扫描宽限期
    overnight_reset_threshold: 60   # 修复 (2026-05-12): 持仓>60min 视为隔夜, 重置基准
    # 幻方 Principle: 短线仓位的敌人是时间。信号强度随时间指数衰减。
    # 如果2.5小时内持仓没有朝有利方向移动, 说明信号已失效。

  # 做空加速 (沿用 short_overrides 逻辑, 阈值更紧)
  short:
    initial_stop_atr: 1.5           # 优化: 从 1.2x 放宽到 1.5x
    max_loss_pct: 5.0               # 优化: 从 4.0% 放宽到 5.0%
    take_profit_tier_1: 2.0         # 优化: 从 1.5% 提到 2.0%
    take_profit_tier_2: 5.0         # 优化: 从 4.0% 提到 5.0%
    max_idle_minutes: 60            # 模拟盘: 90→60min, 与LONG对齐

# ============================================================
# SCALPING 策略退出参数覆写 (Task #9, 2026-05-30)
# ============================================================
# SCALPING 使用独立退出引擎 (app/scalping/exits.py) 但配置统一到此文件管理
# - 启动时由 _load_scalping_exit_config() 一次性加载, 缓存到模块级 _SCALPING_EXIT_CONFIG
# - enabled: false 时所有 SCALPING 类回退到代码默认值 (向后兼容)
# - 修改参数无需改 Python 代码
# ------------------------------------------------------------
scalping_overrides:
  enabled: true

  # ── ATRExit (app/scalping/exits.py::ATRExit) ──
  atr_exit:
    tp_multiplier: 1.5              # TP = entry ± 1.5×ATR
    sl_multiplier: 1.0              # SL = entry ∓ 1.0×ATR
    min_tp_pct: 0.005               # 最低止盈 0.5% (ATR 太小时兜底)
    max_tp_pct: 0.05                # 最高止盈 5%   (ATR 太大时限制)
    min_sl_pct: 0.003               # 最低止损 0.3%
    max_sl_pct: 0.03                # 最高止损 3%

  # ── 轻量追踪止损 (ATRExit.check_exit 内嵌) ──
  trailing:
    enabled: true
    activation_profit_pct: 0.015    # 盈利 ≥1.5% 时激活追踪
    trail_multiplier: 0.8           # 回撤 0.8×ATR 触发
    min_trail_pct: 0.008            # 最小追踪距离 0.8% (ATR 极小时兜底)

  # ── 时间退出 (TimeExit) ──
  time_exit:
    max_hold_minutes: 60            # 最大持仓 60 分钟
    profit_extension_minutes: 30    # 盈利时可延长 30 分钟

  # ── 时段缩放 (覆盖 base 参数, 与 time_gate.py / unified_config.scalping.phases 对齐) ──
  # 物理含义: phase_amplitude / global_amplitude
  # SSOT: unified_config.yaml::scalping.phases (此处仅作为退出系统兜底)
  phase_scaling:
    opening_drive:
      tp_scale: 1.5
      sl_scale: 1.5
    morning:
      tp_scale: 1.2
      sl_scale: 1.2
    midday:
      tp_scale: 0.7
      sl_scale: 0.5
    afternoon:
      tp_scale: 1.0
      sl_scale: 1.0
    closing_drive:
      tp_scale: 0.5
      sl_scale: 0.7
