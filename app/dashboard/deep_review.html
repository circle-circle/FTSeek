<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTSeek 深度复盘系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1600px; margin: 0 auto; }
        h1 { color: #2c3e50; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #7f8c8d; margin-bottom: 30px; font-size: 14px; }
        
        /* 筛选栏 */
        .filter-bar { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .filter-item label { display: block; font-size: 12px; color: #6c757d; margin-bottom: 5px; }
        .filter-item select, .filter-item input { width: 100%; padding: 8px 12px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px; }
        .filter-actions { display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #007bff; color: white; }
        .btn-primary:hover { background: #0056b3; }
        .btn-secondary { background: #6c757d; color: white; }
        
        /* KPI卡片 */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .kpi-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .kpi-label { font-size: 12px; color: #6c757d; margin-bottom: 8px; }
        .kpi-value { font-size: 28px; font-weight: 700; color: #2c3e50; }
        .kpi-value.success { color: #28a745; }
        .kpi-value.danger { color: #dc3545; }
        .kpi-value.warning { color: #ffc107; }
        
        /* 图表区域 */
        .chart-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px; }
        .chart-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .chart-title { font-size: 16px; font-weight: 600; color: #2c3e50; margin-bottom: 15px; }
        .chart-container { height: 300px; position: relative; }
        
        /* 交易表格 */
        .table-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        th { background: #f8f9fa; font-weight: 600; color: #495057; font-size: 13px; }
        td { font-size: 13px; }
        tr:hover { background: #f8f9fa; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-danger { background: #f8d7da; color: #721c24; }
        .badge-info { background: #d1ecf1; color: #0c5460; }
        
        /* 策略对比 */
        .strategy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .strategy-card { background: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 4px solid #007bff; }
        .strategy-name { font-weight: 600; color: #2c3e50; margin-bottom: 10px; }
        .strategy-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .stat-item { font-size: 12px; }
        .stat-label { color: #6c757d; }
        .stat-value { font-weight: 600; color: #2c3e50; }
        
        .loading { text-align: center; padding: 40px; color: #6c757d; }
        .error { padding: 15px; background: #f8d7da; color: #721c24; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 FTSeek 深度复盘系统</h1>
        <p class="subtitle">追踪交易记录、分析策略表现、优化配置参数，找到高胜率高收益的最优解</p>
        
        <!-- 筛选栏 -->
        <div class="filter-bar">
            <div class="filter-grid">
                <div class="filter-item">
                    <label>时间周期</label>
                    <select id="period-filter" onchange="applyFilters()">
                        <option value="all">全部时间</option>
                        <option value="day">今日</option>
                        <option value="week">本周</option>
                        <option value="month">本月</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>开始日期</label>
                    <input type="date" id="start-date" onchange="applyFilters()">
                </div>
                <div class="filter-item">
                    <label>结束日期</label>
                    <input type="date" id="end-date" onchange="applyFilters()">
                </div>
                <div class="filter-item">
                    <label>策略</label>
                    <select id="strategy-filter" onchange="applyFilters()">
                        <option value="">全部策略</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>股票代码</label>
                    <select id="code-filter" onchange="applyFilters()">
                        <option value="">全部股票</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>交易方向</label>
                    <select id="action-filter" onchange="applyFilters()">
                        <option value="">全部</option>
                        <option value="BUY">买入</option>
                        <option value="SELL">卖出</option>
                    </select>
                </div>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="applyFilters()">🔍 应用筛选</button>
                <button class="btn btn-secondary" onclick="resetFilters()">🔄 重置</button>
            </div>
        </div>
        
        <!-- KPI指标 -->
        <div class="kpi-grid" id="kpi-cards">
            <div class="loading">加载KPI数据...</div>
        </div>
        
        <!-- 图表区域 -->
        <div class="chart-grid">
            <div class="chart-card">
                <div class="chart-title">📈 收益曲线</div>
                <div class="chart-container">
                    <canvas id="equity-chart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-title">📊 策略对比</div>
                <div class="chart-container">
                    <canvas id="strategy-chart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- 策略表现 -->
        <div class="table-card">
            <div class="table-header">
                <h3>🎯 策略表现对比</h3>
            </div>
            <div id="strategy-stats" class="strategy-grid">
                <div class="loading">加载策略数据...</div>
            </div>
        </div>
        
        <!-- 交易记录表格 -->
        <div class="table-card">
            <div class="table-header">
                <h3>📝 交易记录</h3>
                <span id="trade-count" style="color: #6c757d;"></span>
            </div>
            <div style="overflow-x: auto;">
                <table id="trades-table">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>代码</th>
                            <th>方向</th>
                            <th>策略</th>
                            <th>入场价</th>
                            <th>出场价</th>
                            <th>数量</th>
                            <th>盈亏</th>
                            <th>盈亏率</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="trades-body">
                        <tr><td colspan="10" class="loading">加载交易记录...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const API_BASE = '/api/review';
        let equityChart = null;
        let strategyChart = null;
        
        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadFilters();
        });
        
        // 加载筛选选项
        async function loadFilters() {
            try {
                const response = await fetch(`${API_BASE}/filters`);
                const result = await response.json();
                
                if (result.status === 'ok') {
                    const { strategies, codes, date_range } = result.data;
                    
                    // 填充策略下拉框
                    const strategySelect = document.getElementById('strategy-filter');
                    strategies.forEach(s => {
                        const option = document.createElement('option');
                        option.value = s;
                        option.textContent = s;
                        strategySelect.appendChild(option);
                    });
                    
                    // 填充股票代码下拉框
                    const codeSelect = document.getElementById('code-filter');
                    codes.forEach(c => {
                        const option = document.createElement('option');
                        option.value = c;
                        option.textContent = c;
                        codeSelect.appendChild(option);
                    });
                    
                    // 设置日期范围 - 修复：使用正确的字段名
                    if (date_range.min_date) {
                        document.getElementById('start-date').min = date_range.min_date;
                        document.getElementById('start-date').value = date_range.min_date;
                    }
                    if (date_range.max_date) {
                        document.getElementById('end-date').max = date_range.max_date;
                        document.getElementById('end-date').value = date_range.max_date;
                    }
                    
                    // 加载数据（在日期设置完成后）
                    loadAllData();
                }
            } catch (error) {
                console.error('加载筛选选项失败:', error);
                loadAllData(); // 即使筛选加载失败也尝试加载数据
            }
        }
        
        // 加载所有数据
        async function loadAllData() {
            await Promise.all([
                loadKPIs(),
                loadTrades(),
                loadStrategyStats(),
                loadEquityCurve()
            ]);
        }
        
        // 应用筛选
        async function applyFilters() {
            await loadAllData();
        }
        
        // 重置筛选
        function resetFilters() {
            document.getElementById('period-filter').value = 'all';
            document.getElementById('start-date').value = document.getElementById('start-date').min || '';
            document.getElementById('end-date').value = document.getElementById('end-date').max || '';
            document.getElementById('strategy-filter').value = '';
            document.getElementById('code-filter').value = '';
            document.getElementById('action-filter').value = '';
            loadAllData();
        }
        
        // 获取筛选参数
        function getFilterParams() {
            const period = document.getElementById('period-filter').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const strategy = document.getElementById('strategy-filter').value;
            const code = document.getElementById('code-filter').value;
            const action = document.getElementById('action-filter').value;
            
            return { period, start_date: startDate, end_date: endDate, strategy, code, action };
        }
        
        // 加载KPI
        async function loadKPIs() {
            try {
                const params = getFilterParams();
                const queryParams = new URLSearchParams({
                    period: params.period,
                    start_date: params.start_date || '',
                    end_date: params.end_date || ''
                });
                
                const response = await fetch(`${API_BASE}/summary?${queryParams}`);
                const result = await response.json();
                
                if (result.status === 'ok') {
                    const data = result.data;
                    
                    const kpiHtml = `
                        <div class="kpi-card">
                            <div class="kpi-label">总交易次数</div>
                            <div class="kpi-value">${data.total_trades}</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">胜率</div>
                            <div class="kpi-value ${data.win_rate >= 0.6 ? 'success' : data.win_rate >= 0.4 ? 'warning' : 'danger'}">
                                ${(data.win_rate * 100).toFixed(1)}%
                            </div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">总盈亏</div>
                            <div class="kpi-value ${data.total_pnl >= 0 ? 'success' : 'danger'}">
                                ${data.total_pnl >= 0 ? '+' : ''}${data.total_pnl.toFixed(2)}
                            </div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">平均盈亏</div>
                            <div class="kpi-value ${data.avg_pnl >= 0 ? 'success' : 'danger'}">
                                ${data.avg_pnl >= 0 ? '+' : ''}${data.avg_pnl.toFixed(2)}
                            </div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">盈亏比</div>
                            <div class="kpi-value ${data.profit_factor >= 1.5 ? 'success' : 'warning'}">
                                ${data.profit_factor.toFixed(2)}
                            </div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">盈利/亏损</div>
                            <div class="kpi-value">
                                <span style="color: #28a745;">${data.winning_trades}</span> / 
                                <span style="color: #dc3545;">${data.losing_trades}</span>
                            </div>
                        </div>
                    `;
                    
                    document.getElementById('kpi-cards').innerHTML = kpiHtml;
                }
            } catch (error) {
                console.error('加载KPI失败:', error);
                document.getElementById('kpi-cards').innerHTML = '<div class="error">加载KPI数据失败</div>';
            }
        }
        
        // 加载交易记录
        async function loadTrades() {
            try {
                const params = getFilterParams();
                const queryParams = new URLSearchParams({
                    start_date: params.start_date || '',
                    end_date: params.end_date || '',
                    strategy: params.strategy || '',
                    code: params.code || '',
                    action: params.action || '',
                    limit: '100'
                });
                
                const response = await fetch(`${API_BASE}/trades?${queryParams}`);
                const result = await response.json();
                
                if (result.status === 'ok') {
                    const { trades, total } = result.data;
                    
                    document.getElementById('trade-count').textContent = `共 ${total} 条记录`;
                    
                    if (trades.length === 0) {
                        document.getElementById('trades-body').innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 40px; color: #6c757d;">暂无交易记录</td></tr>';
                        return;
                    }
                    
                    const html = trades.map(t => `
                        <tr>
                            <td>${new Date(t.entry_time).toLocaleString('zh-CN')}</td>
                            <td><strong>${t.code}</strong></td>
                            <td><span class="badge ${t.action === 'BUY' ? 'badge-info' : 'badge-danger'}">${t.action}</span></td>
                            <td>${t.strategy}</td>
                            <td>${t.entry_price}</td>
                            <td>${t.exit_price || '-'}</td>
                            <td>${t.quantity}</td>
                            <td style="color: ${t.pnl >= 0 ? '#28a745' : '#dc3545'}; font-weight: 600;">
                                ${t.pnl >= 0 ? '+' : ''}${t.pnl.toFixed(2)}
                            </td>
                            <td style="color: ${t.pnl_percent >= 0 ? '#28a745' : '#dc3545'};">
                                ${t.pnl_percent ? (t.pnl_percent >= 0 ? '+' : '') + t.pnl_percent.toFixed(2) + '%' : '-'}
                            </td>
                            <td><span class="badge badge-success">${t.status}</span></td>
                        </tr>
                    `).join('');
                    
                    document.getElementById('trades-body').innerHTML = html;
                }
            } catch (error) {
                console.error('加载交易记录失败:', error);
                document.getElementById('trades-body').innerHTML = '<tr><td colspan="10" class="error">加载交易记录失败</td></tr>';
            }
        }
        
        // 加载策略统计
        async function loadStrategyStats() {
            try {
                const params = getFilterParams();
                const queryParams = new URLSearchParams({
                    start_date: params.start_date || '',
                    end_date: params.end_date || ''
                });
                
                const response = await fetch(`${API_BASE}/strategy-stats?${queryParams}`);
                const result = await response.json();
                
                if (result.status === 'ok') {
                    const { strategies } = result.data;
                    
                    const html = strategies.map(s => `
                        <div class="strategy-card">
                            <div class="strategy-name">${s.name}</div>
                            <div class="strategy-stats">
                                <div class="stat-item">
                                    <div class="stat-label">交易次数</div>
                                    <div class="stat-value">${s.total_trades}</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">胜率</div>
                                    <div class="stat-value" style="color: ${s.win_rate >= 0.6 ? '#28a745' : '#ffc107'}">
                                        ${(s.win_rate * 100).toFixed(1)}%
                                    </div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">总盈亏</div>
                                    <div class="stat-value" style="color: ${s.total_pnl >= 0 ? '#28a745' : '#dc3545'}">
                                        ${s.total_pnl >= 0 ? '+' : ''}${s.total_pnl}
                                    </div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">盈亏比</div>
                                    <div class="stat-value">${s.profit_factor}</div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                    
                    document.getElementById('strategy-stats').innerHTML = html;
                }
            } catch (error) {
                console.error('加载策略统计失败:', error);
                document.getElementById('strategy-stats').innerHTML = '<div class="error">加载策略数据失败</div>';
            }
        }
        
        // 加载收益曲线
        async function loadEquityCurve() {
            try {
                const params = getFilterParams();
                const queryParams = new URLSearchParams({
                    start_date: params.start_date || '',
                    end_date: params.end_date || '',
                    group_by: 'day'
                });
                
                const response = await fetch(`${API_BASE}/equity-curve?${queryParams}`);
                const result = await response.json();
                
                if (result.status === 'ok') {
                    const { curve } = result.data;
                    
                    const labels = curve.map(c => c.period);
                    const cumulativePnl = curve.map(c => c.cumulative_pnl);
                    
                    if (equityChart) {
                        equityChart.destroy();
                    }
                    
                    const ctx = document.getElementById('equity-chart').getContext('2d');
                    equityChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: '累计盈亏',
                                data: cumulativePnl,
                                borderColor: '#007bff',
                                backgroundColor: 'rgba(0, 123, 255, 0.1)',
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                y: {
                                    beginAtZero: false,
                                    grid: { color: '#f0f0f0' }
                                },
                                x: {
                                    grid: { display: false }
                                }
                            }
                        }
                    });
                }
            } catch (error) {
                console.error('加载收益曲线失败:', error);
            }
        }
    </script>
</body>
</html>
