<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTSeek 模拟盘监控看板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0e1a; color: #f7fafc; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { background: #111827; border-bottom: 1px solid #2d3748; padding: 20px 30px; margin-bottom: 20px; border-radius: 12px; }
        .header-title { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        .header-subtitle { font-size: 14px; color: #a0aec0; }
        
        .info-box { background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; border-radius: 8px; padding: 16px; margin: 20px 0; }
        .info-title { font-weight: 600; color: #3b82f6; margin-bottom: 8px; }
        .info-text { font-size: 14px; color: #a0aec0; }
        
        .section { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 12px; padding: 24px; margin: 20px 0; }
        .section-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
        
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { text-align: left; padding: 12px; background: #111827; color: #a0aec0; font-size: 13px; border-bottom: 1px solid #2d3748; }
        .data-table td { padding: 12px; border-bottom: 1px solid #2d3748; font-size: 14px; }
        .data-table tr:hover { background: #111827; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
        .badge-buy { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .badge-sell { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .badge-open { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .positive { color: #10b981; }
        .negative { color: #ef4444; }
        
        .no-data { text-align: center; padding: 60px; color: #a0aec0; }
        .error-msg { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 16px; border-radius: 8px; margin: 20px 0; }
        
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
        .kpi-card { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 12px; padding: 20px; }
        .kpi-label { font-size: 13px; color: #a0aec0; margin-bottom: 8px; }
        .kpi-value { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .kpi-sub { font-size: 12px; color: #a0aec0; }
    </style>
</head>
<body>
    <header>
        <div class="header-title">📊 FTSeek 模拟盘监控看板</div>
        <div class="header-subtitle">从 2026-03-31 开始积累交易数据 | 初始资金：1,000,000 HKD</div>
    </header>
    
    <div class="container">
        <div class="info-box">
            <div class="info-title">💡 数据说明</div>
            <div class="info-text">从 2026-03-31 开始积累交易数据。当前所有交易均为持仓状态，盈亏数据将在交易平仓后自动计算。</div>
        </div>
        
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-label">总交易数</div>
                <div class="kpi-value" id="totalTrades">加载中...</div>
                <div class="kpi-sub" id="tradesSub">-</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">持仓中</div>
                <div class="kpi-value" id="openTrades">-</div>
                <div class="kpi-sub">未平仓订单</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">已平仓</div>
                <div class="kpi-value" id="closedTrades">-</div>
                <div class="kpi-sub">已完成交易</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">总盈亏</div>
                <div class="kpi-value" id="totalPnl">-</div>
                <div class="kpi-sub">HKD (待平仓)</div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">📋 持仓明细 (16 笔)</div>
            <div id="positionsTable">加载中...</div>
        </div>
        
        <div class="section">
            <div class="section-title">📜 全部交易记录 (16 笔)</div>
            <div id="tradesTable">加载中...</div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api/v1/review';
        
        async function loadData() {
            try {
                console.log('正在加载数据...');
                const response = await fetch(`${API_BASE}/trades?limit=100`);
                console.log('Response status:', response.status);
                
                const result = await response.json();
                console.log('API 返回:', result);
                
                if (result.status !== 'ok' || !result.data) {
                    throw new Error('API 返回格式错误');
                }
                
                const trades = result.data;
                console.log('交易数据:', trades.length, '笔');
                
                // 更新 KPI
                const openCount = trades.filter(t => t.status === 'open').length;
                const closedCount = trades.filter(t => t.status === 'closed').length;
                const totalPnl = trades.filter(t => t.status === 'closed').reduce((sum, t) => sum + (t.pnl || 0), 0);
                
                document.getElementById('totalTrades').textContent = trades.length;
                document.getElementById('tradesSub').textContent = `${closedCount} 已平仓 / ${openCount} 持仓中`;
                document.getElementById('openTrades').textContent = openCount;
                document.getElementById('closedTrades').textContent = closedCount;
                
                const pnlEl = document.getElementById('totalPnl');
                pnlEl.textContent = (totalPnl >= 0 ? '+' : '') + totalPnl.toFixed(0);
                pnlEl.className = 'kpi-value ' + (totalPnl >= 0 ? 'positive' : 'negative');
                
                // 渲染持仓明细
                renderPositions(trades.filter(t => t.status === 'open'));
                
                // 渲染交易记录
                renderTrades(trades);
                
                console.log('数据加载完成');
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('positionsTable').innerHTML = '<div class="error-msg">加载失败：' + error.message + '</div>';
                document.getElementById('tradesTable').innerHTML = '<div class="error-msg">加载失败：' + error.message + '</div>';
            }
        }
        
        function renderPositions(trades) {
            const div = document.getElementById('positionsTable');
            
            if (!trades || trades.length === 0) {
                div.innerHTML = '<div class="no-data">暂无持仓</div>';
                return;
            }
            
            let html = '<table class="data-table">';
            html += '<thead><tr><th>订单 ID</th><th>代码</th><th>名称</th><th>方向</th><th>成交价</th><th>数量</th><th>时间</th><th>状态</th></tr></thead>';
            html += '<tbody>';
            
            trades.forEach(t => {
                const price = t.exit_price || t.entry_price || 0;
                html += `<tr>
                    <td>${t.id || '-'}</td>
                    <td>${t.code || '-'}</td>
                    <td>${t.name || '-'}</td>
                    <td><span class="badge ${t.action === 'BUY' ? 'badge-buy' : 'badge-sell'}">${t.action}</span></td>
                    <td>${price.toFixed(1)}</td>
                    <td>${t.quantity || 0}</td>
                    <td>${(t.entry_time || '').replace('T', ' ').substr(0, 16)}</td>
                    <td><span class="badge badge-open">持仓中</span></td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            div.innerHTML = html;
        }
        
        function renderTrades(trades) {
            const div = document.getElementById('tradesTable');
            
            if (!trades || trades.length === 0) {
                div.innerHTML = '<div class="no-data">暂无交易记录</div>';
                return;
            }
            
            let html = '<table class="data-table">';
            html += '<thead><tr><th>订单 ID</th><th>代码</th><th>名称</th><th>方向</th><th>成交价</th><th>数量</th><th>盈亏</th><th>时间</th><th>状态</th></tr></thead>';
            html += '<tbody>';
            
            trades.slice(0, 50).forEach(t => {
                const price = t.exit_price || t.entry_price || 0;
                const pnl = t.status === 'closed' ? (t.pnl || 0) : null;
                const pnlClass = pnl >= 0 ? 'positive' : 'negative';
                const pnlText = pnl !== null ? ((pnl >= 0 ? '+' : '') + pnl.toFixed(0)) : '-';
                
                html += `<tr>
                    <td>${t.id || '-'}</td>
                    <td>${t.code || '-'}</td>
                    <td>${t.name || '-'}</td>
                    <td><span class="badge ${t.action === 'BUY' ? 'badge-buy' : 'badge-sell'}">${t.action}</span></td>
                    <td>${price.toFixed(1)}</td>
                    <td>${t.quantity || 0}</td>
                    <td class="${pnlClass}">${pnlText}</td>
                    <td>${(t.entry_time || '').replace('T', ' ').substr(0, 16)}</td>
                    <td><span class="badge ${t.status === 'closed' ? 'badge-buy' : 'badge-open'}">${t.status === 'closed' ? '已平仓' : '持仓中'}</span></td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            div.innerHTML = html;
        }
        
        // 页面加载时执行
        console.log('页面加载完成，开始加载数据...');
        loadData();
        
        // 每 60 秒刷新一次
        setInterval(loadData, 60000);
    </script>
</body>
</html>
