<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人工交易录入 - FTSeek-US</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f6fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin-top: 30px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0 !important;
            font-weight: 600;
            padding: 15px 20px;
        }
        .card-header.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .card-header.tertiary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .form-label {
            font-weight: 500;
            color: #2d3436;
            margin-bottom: 8px;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #dfe6e9;
            padding: 10px 15px;
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102,126,234,0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }
        .btn-secondary {
            background: #6c757d;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
        }
        .rating-stars {
            display: flex;
            gap: 5px;
        }
        .rating-stars input[type="radio"] {
            display: none;
        }
        .rating-stars label {
            font-size: 24px;
            color: #dfe6e9;
            cursor: pointer;
            transition: color 0.2s;
        }
        .rating-stars input[type="radio"]:checked ~ label,
        .rating-stars label:hover,
        .rating-stars label:hover ~ label {
            color: #f5576c;
        }
        .rating-stars input[type="radio"]:checked ~ label {
            color: #f5576c;
        }
        .help-text {
            font-size: 12px;
            color: #636e72;
            margin-top: 5px;
        }
        .required::after {
            content: " *";
            color: #e74c3c;
        }
        .alert-success {
            border-radius: 8px;
            border: none;
        }
        .alert-danger {
            border-radius: 8px;
            border: none;
        }
        .section-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
        .badge-decision { background-color: #667eea; color: white; }
        .badge-timing { background-color: #f093fb; color: white; }
        .badge-position { background-color: #4facfe; color: white; }
        .badge-risk { background-color: #f5576c; color: white; }
        .badge-psychology { background-color: #43e97b; color: white; }
        .badge-strategy { background-color: #fa709a; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-journal-plus me-2"></i>人工交易录入</h2>
            <div>
                <a href="/dashboard" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>返回 Dashboard
                </a>
            </div>
        </div>

        <div id="alertContainer"></div>

        <form id="tradeEntryForm">
            <!-- 基础交易信息 -->
            <div class="card">
                <div class="card-header">
                    <i class="bi bi-cart-check me-2"></i>基础交易信息
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="stock_code" class="form-label required">股票代码</label>
                            <input type="text" class="form-control" id="stock_code" 
                                   placeholder="如：AAPL, MSFT" required>
                            <div class="help-text">美股代码，无需后缀</div>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label for="side" class="form-label required">方向</label>
                            <select class="form-select" id="side" required>
                                <option value="">请选择</option>
                                <option value="buy">买入 (Buy)</option>
                                <option value="sell">卖出 (Sell)</option>
                            </select>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label for="quantity" class="form-label required">数量</label>
                            <input type="number" class="form-control" id="quantity" 
                                   placeholder="100" min="1" required>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label for="price" class="form-label required">价格 (USD)</label>
                            <input type="number" class="form-control" id="price" 
                                   placeholder="150.50" step="0.01" min="0" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="trade_time" class="form-label required">交易时间</label>
                            <input type="datetime-local" class="form-control" id="trade_time" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="order_id" class="form-label">订单 ID</label>
                            <input type="text" class="form-control" id="order_id" 
                                   placeholder="可选，系统自动生成">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="strategy_name" class="form-label">策略名称</label>
                            <input type="text" class="form-control" id="strategy_name" 
                                   placeholder="如：ma_cross_v2">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="account_type" class="form-label required">账户类型</label>
                            <select class="form-select" id="account_type" required>
                                <option value="paper">模拟账户</option>
                                <option value="real">实盘账户</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 决策维度 -->
            <div class="card">
                <div class="card-header secondary">
                    <i class="bi bi-brain me-2"></i>决策维度
                    <span class="section-badge badge-decision">Decision</span>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="decision_reason" class="form-label required">决策理由</label>
                            <select class="form-select" id="decision_reason" required>
                                <option value="">请选择</option>
                                <option value="technical_breakout">技术突破</option>
                                <option value="technical_support">技术支撑</option>
                                <option value="fundamental_good">基本面良好</option>
                                <option value="news_positive">利好消息</option>
                                <option value="momentum">动量跟随</option>
                                <option value="mean_reversion">均值回归</option>
                                <option value="arbitrage">套利机会</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="decision_confidence" class="form-label required">信心评分</label>
                            <div class="rating-stars" id="decision_confidence_stars">
                                <input type="radio" id="dc10" name="decision_confidence" value="10" required>
                                <label for="dc10" title="10 - 非常有信心">★</label>
                                <input type="radio" id="dc9" name="decision_confidence" value="9">
                                <label for="dc9" title="9">★</label>
                                <input type="radio" id="dc8" name="decision_confidence" value="8">
                                <label for="dc8" title="8">★</label>
                                <input type="radio" id="dc7" name="decision_confidence" value="7">
                                <label for="dc7" title="7">★</label>
                                <input type="radio" id="dc6" name="decision_confidence" value="6">
                                <label for="dc6" title="6">★</label>
                                <input type="radio" id="dc5" name="decision_confidence" value="5" checked>
                                <label for="dc5" title="5 - 中等">★</label>
                                <input type="radio" id="dc4" name="decision_confidence" value="4">
                                <label for="dc4" title="4">★</label>
                                <input type="radio" id="dc3" name="decision_confidence" value="3">
                                <label for="dc3" title="3">★</label>
                                <input type="radio" id="dc2" name="decision_confidence" value="2">
                                <label for="dc2" title="2">★</label>
                                <input type="radio" id="dc1" name="decision_confidence" value="1">
                                <label for="dc1" title="1 - 非常不确定">★</label>
                            </div>
                            <div class="help-text">1-10 分，5 分为中等信心</div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="decision_notes" class="form-label">决策备注</label>
                        <textarea class="form-control" id="decision_notes" rows="2" 
                                  placeholder="详细描述决策依据..."></textarea>
                    </div>
                </div>
            </div>

            <!-- 时机维度 -->
            <div class="card">
                <div class="card-header tertiary">
                    <i class="bi bi-clock-history me-2"></i>时机维度
                    <span class="section-badge badge-timing">Timing</span>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="entry_timing_score" class="form-label">入场时机评分</label>
                            <input type="number" class="form-control" id="entry_timing_score" 
                                   min="1" max="10" value="5" placeholder="1-10">
                            <div class="help-text">交易后可补充，1-10 分</div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="exit_timing_score" class="form-label">出场时机评分</label>
                            <input type="number" class="form-control" id="exit_timing_score" 
                                   min="1" max="10" value="5" placeholder="1-10">
                            <div class="help-text">交易后可补充，1-10 分</div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="timing_reason" class="form-label">时机说明</label>
                            <input type="text" class="form-control" id="timing_reason" 
                                   placeholder="如：入场较好，出场过早">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 持仓维度 -->
            <div class="card">
                <div class="card-header" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                    <i class="bi bi-pie-chart me-2"></i>持仓维度
                    <span class="section-badge badge-position">Position</span>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="position_size_score" class="form-label">仓位评分</label>
                            <input type="number" class="form-control" id="position_size_score" 
                                   min="1" max="10" value="5" placeholder="1-10">
                            <div class="help-text">1-10 分，评估仓位是否合理</div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="holding_period" class="form-label">预期持仓周期</label>
                            <select class="form-select" id="holding_period">
                                <option value="intraday">日内交易</option>
                                <option value="1-3days">1-3 天</option>
                                <option value="3-7days">3-7 天</option>
                                <option value="1-4weeks">1-4 周</option>
                                <option value="long">长期持有</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="position_pct" class="form-label">仓位占比 (%)</label>
                            <input type="number" class="form-control" id="position_pct" 
                                   step="0.1" min="0" max="100" placeholder="如：10.5">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 风控维度 -->
            <div class="card">
                <div class="card-header" style="background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);">
                    <i class="bi bi-shield-check me-2"></i>风控维度
                    <span class="section-badge badge-risk">Risk Control</span>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="stop_loss_planned" class="form-label">计划止损价</label>
                            <input type="number" class="form-control" id="stop_loss_planned" 
                                   step="0.01" min="0" placeholder="USD">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="stop_loss_executed" class="form-label">止损执行</label>
                            <select class="form-select" id="stop_loss_executed">
                                <option value="">待执行</option>
                                <option value="true">已执行</option>
                                <option value="false">未执行</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="take_profit_planned" class="form-label">计划止盈价</label>
                            <input type="number" class="form-control" id="take_profit_planned" 
                                   step="0.01" min="0" placeholder="USD">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="take_profit_executed" class="form-label">止盈执行</label>
                            <select class="form-select" id="take_profit_executed">
                                <option value="">待执行</option>
                                <option value="true">已执行</option>
                                <option value="false">未执行</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="risk_reward_ratio" class="form-label">风险收益比</label>
                            <input type="number" class="form-control" id="risk_reward_ratio" 
                                   step="0.1" min="0" placeholder="如：2.5">
                            <div class="help-text">预期收益/预期风险，建议 ≥ 2</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="max_loss_pct" class="form-label">最大亏损占比 (%)</label>
                            <input type="number" class="form-control" id="max_loss_pct" 
                                   step="0.1" min="0" max="100" placeholder="如：2.0">
                            <div class="help-text">该交易最大亏损占总资金比例</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 心理维度 -->
            <div class="card">
                <div class="card-header" style="background: linear-gradient(135deg, #43e97b 0%, #fa709a 100%);">
                    <i class="bi bi-heart-pulse me-2"></i>心理维度
                    <span class="section-badge badge-psychology">Psychology</span>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="emotion_state" class="form-label required">情绪状态</label>
                            <select class="form-select" id="emotion_state" required>
                                <option value="calm">平静 (Calm)</option>
                                <option value="nervous">紧张 (Nervous)</option>
                                <option value="excited">兴奋 (Excited)</option>
                                <option value="frustrated">沮丧 (Frustrated)</option>
                                <option value="confident">自信 (Confident)</option>
                                <option value="fearful">恐惧 (Fearful)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="emotion_intensity" class="form-label required">情绪强度</label>
                            <div class="rating-stars" id="emotion_intensity_stars">
                                <input type="radio" id="ei10" name="emotion_intensity" value="10" required>
                                <label for="ei10" title="10 - 极度强烈">★</label>
                                <input type="radio" id="ei9" name="emotion_intensity" value="9">
                                <label for="ei9" title="9">★</label>
                                <input type="radio" id="ei8" name="emotion_intensity" value="8">
                                <label for="ei8" title="8">★</label>
                                <input type="radio" id="ei7" name="emotion_intensity" value="7">
                                <label for="ei7" title="7">★</label>
                                <input type="radio" id="ei6" name="emotion_intensity" value="6">
                                <label for="ei6" title="6">★</label>
                                <input type="radio" id="ei5" name="emotion_intensity" value="5" checked>
                                <label for="ei5" title="5 - 中等">★</label>
                                <input type="radio" id="ei4" name="emotion_intensity" value="4">
                                <label for="ei4" title="4">★</label>
                                <input type="radio" id="ei3" name="emotion_intensity" value="3">
                                <label for="ei3" title="3">★</label>
                                <input type="radio" id="ei2" name="emotion_intensity" value="2">
                                <label for="ei2" title="2">★</label>
                                <input type="radio" id="ei1" name="emotion_intensity" value="1">
                                <label for="ei1" title="1 - 平静">★</label>
                            </div>
                            <div class="help-text">1-10 分，5 分为中等强度</div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="psychology_notes" class="form-label">心理备注</label>
                        <textarea class="form-control" id="psychology_notes" rows="2" 
                                  placeholder="记录当时的心理状态和想法..."></textarea>
                    </div>
                </div>
            </div>

            <!-- 策略维度 -->
            <div class="card">
                <div class="card-header" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
                    <i class="bi bi-diagram-3 me-2"></i>策略维度
                    <span class="section-badge badge-strategy">Strategy</span>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="strategy_followed" class="form-label">是否遵循策略</label>
                            <select class="form-select" id="strategy_followed">
                                <option value="true">是</option>
                                <option value="false">否</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="strategy_adjustment" class="form-label">策略调整</label>
                            <input type="text" class="form-control" id="strategy_adjustment" 
                                   placeholder="如：无，或描述调整内容">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="strategy_confidence" class="form-label">策略信心</label>
                            <select class="form-select" id="strategy_confidence">
                                <option value="high">高</option>
                                <option value="medium" selected>中</option>
                                <option value="low">低</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 学习总结 -->
            <div class="card">
                <div class="card-header" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);">
                    <i class="bi bi-lightbulb me-2"></i>学习总结
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="key_learning" class="form-label">关键学习</label>
                        <textarea class="form-control" id="key_learning" rows="3" 
                                  placeholder="这笔交易中学到了什么？"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="improvement_action" class="form-label">改进行动</label>
                        <textarea class="form-control" id="improvement_action" rows="2" 
                                  placeholder="下次可以如何改进？"></textarea>
                    </div>
                </div>
            </div>

            <!-- 提交按钮 -->
            <div class="d-grid gap-2 d-md-flex justify-content-md-center mb-5">
                <button type="button" class="btn btn-secondary btn-lg" onclick="resetForm()">
                    <i class="bi bi-arrow-counterclockwise me-2"></i>重置
                </button>
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-check-circle me-2"></i>提交交易记录
                </button>
            </div>
        </form>
    </div>

    <!-- 提交确认模态框 -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">确认提交</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>请确认以下交易信息：</p>
                    <ul id="confirmList" class="list-group"></ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="confirmSubmit">确认提交</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 设置默认交易时间为当前时间
        document.addEventListener('DOMContentLoaded', function() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('trade_time').value = now.toISOString().slice(0, 16);
        });

        // 表单验证
        document.getElementById('tradeEntryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 收集表单数据
            const formData = {
                stock_code: document.getElementById('stock_code').value,
                side: document.getElementById('side').value,
                quantity: document.getElementById('quantity').value,
                price: document.getElementById('price').value,
                trade_time: document.getElementById('trade_time').value,
                order_id: document.getElementById('order_id').value || generateOrderId(),
                strategy_name: document.getElementById('strategy_name').value,
                account_type: document.getElementById('account_type').value,
                decision_reason: document.getElementById('decision_reason').value,
                decision_confidence: document.querySelector('input[name="decision_confidence"]:checked')?.value || 5,
                decision_notes: document.getElementById('decision_notes').value,
                entry_timing_score: document.getElementById('entry_timing_score').value,
                exit_timing_score: document.getElementById('exit_timing_score').value,
                timing_reason: document.getElementById('timing_reason').value,
                position_size_score: document.getElementById('position_size_score').value,
                holding_period: document.getElementById('holding_period').value,
                position_pct: document.getElementById('position_pct').value,
                stop_loss_planned: document.getElementById('stop_loss_planned').value,
                stop_loss_executed: document.getElementById('stop_loss_executed').value,
                take_profit_planned: document.getElementById('take_profit_planned').value,
                take_profit_executed: document.getElementById('take_profit_executed').value,
                risk_reward_ratio: document.getElementById('risk_reward_ratio').value,
                max_loss_pct: document.getElementById('max_loss_pct').value,
                emotion_state: document.getElementById('emotion_state').value,
                emotion_intensity: document.querySelector('input[name="emotion_intensity"]:checked')?.value || 5,
                psychology_notes: document.getElementById('psychology_notes').value,
                strategy_followed: document.getElementById('strategy_followed').value === 'true',
                strategy_adjustment: document.getElementById('strategy_adjustment').value,
                strategy_confidence: document.getElementById('strategy_confidence').value,
                key_learning: document.getElementById('key_learning').value,
                improvement_action: document.getElementById('improvement_action').value
            };

            // 显示确认模态框
            showConfirmModal(formData);
        });

        // 显示确认模态框
        function showConfirmModal(data) {
            const confirmList = document.getElementById('confirmList');
            confirmList.innerHTML = `
                <li class="list-group-item"><strong>股票:</strong> ${data.stock_code}</li>
                <li class="list-group-item"><strong>方向:</strong> ${data.side === 'buy' ? '买入' : '卖出'}</li>
                <li class="list-group-item"><strong>数量:</strong> ${data.quantity}</li>
                <li class="list-group-item"><strong>价格:</strong> $${data.price}</li>
                <li class="list-group-item"><strong>信心评分:</strong> ${data.decision_confidence}/10</li>
                <li class="list-group-item"><strong>情绪状态:</strong> ${data.emotion_state}</li>
                <li class="list-group-item"><strong>账户类型:</strong> ${data.account_type === 'paper' ? '模拟' : '实盘'}</li>
            `;
            
            const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
            modal.show();

            document.getElementById('confirmSubmit').onclick = function() {
                submitTrade(data);
                modal.hide();
            };
        }

        // 提交交易
        async function submitTrade(data) {
            try {
                const response = await fetch('/api/review/trades', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('success', `✅ 交易记录提交成功！交易 ID: ${result.trade_id}`);
                    resetForm();
                } else {
                    showAlert('danger', `❌ 提交失败：${result.error || '未知错误'}`);
                }
            } catch (error) {
                showAlert('danger', `❌ 网络错误：${error.message}`);
            }
        }

        // 显示提示消息
        function showAlert(type, message) {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            
            // 5 秒后自动关闭
            setTimeout(() => {
                const alert = alertContainer.querySelector('.alert');
                if (alert) {
                    alert.remove();
                }
            }, 5000);
        }

        // 重置表单
        function resetForm() {
            document.getElementById('tradeEntryForm').reset();
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('trade_time').value = now.toISOString().slice(0, 16);
        }

        // 生成订单 ID
        function generateOrderId() {
            return 'ORD_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
    </script>
</body>
</html>
