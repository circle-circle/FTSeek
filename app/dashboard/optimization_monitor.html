<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTSeek 系统优化监控面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .badge-success {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }
        
        .badge-error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .stat-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #2c3e50;
        }
        
        .stat-value.success {
            color: #28a745;
        }
        
        .stat-value.warning {
            color: #ffc107;
        }
        
        .stat-value.error {
            color: #dc3545;
        }
        
        .decision-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .decision-item {
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #007bff;
        }
        
        .decision-item.approved {
            border-left-color: #28a745;
        }
        
        .decision-item.rejected {
            border-left-color: #dc3545;
        }
        
        .decision-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .decision-code {
            font-weight: 600;
            color: #2c3e50;
        }
        
        .decision-time {
            font-size: 12px;
            color: #6c757d;
        }
        
        .decision-details {
            font-size: 13px;
            color: #495057;
        }
        
        .trace-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .trace-input input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .trace-input button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .trace-input button:hover {
            background: #0056b3;
        }
        
        .timeline {
            position: relative;
            padding-left: 30px;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #e0e0e0;
        }
        
        .timeline-item {
            position: relative;
            margin-bottom: 15px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 16px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #007bff;
        }
        
        .timeline-time {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 5px;
        }
        
        .timeline-message {
            font-size: 14px;
            color: #2c3e50;
        }
        
        .optimization-list {
            display: grid;
            gap: 15px;
        }
        
        .optimization-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .optimization-info h4 {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .optimization-info p {
            font-size: 13px;
            color: #6c757d;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(0,123,255,0.3);
        }
        
        .refresh-btn:hover {
            background: #0056b3;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        
        .error-message {
            padding: 15px;
            background: #f8d7da;
            color: #721c24;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 FTSeek 系统优化监控面板</h1>
        <p class="subtitle">实时监控系统优化状态、决策缓冲层和配置健康度</p>
        
        <!-- 系统优化状态总览 -->
        <div class="card" style="margin-bottom: 30px;">
            <div class="card-header">
                <span class="card-title">⚡ 系统优化状态</span>
                <span id="optimization-count" class="badge badge-success">加载中...</span>
            </div>
            <div id="optimization-list" class="optimization-list">
                <div class="loading">正在加载优化状态...</div>
            </div>
        </div>
        
        <div class="grid">
            <!-- 决策缓冲层统计 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">📊 决策缓冲层</span>
                    <span id="buffer-status" class="badge badge-success">运行中</span>
                </div>
                <div id="buffer-stats" class="stats-grid">
                    <div class="loading">加载中...</div>
                </div>
            </div>
            
            <!-- 配置校验状态 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">✅ 配置健康度</span>
                    <span id="config-status" class="badge badge-success">检查中...</span>
                </div>
                <div id="config-validation">
                    <div class="loading">正在校验配置...</div>
                </div>
            </div>
        </div>
        
        <div class="grid">
            <!-- 最近决策记录 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">📝 最近决策记录</span>
                    <button onclick="loadRecentDecisions()" style="padding: 5px 15px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer;">刷新</button>
                </div>
                <div id="recent-decisions" class="decision-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>
            
            <!-- Trace ID 查询 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">🔍 决策链路追踪</span>
                </div>
                <div class="trace-input">
                    <input type="text" id="trace-id-input" placeholder="输入 Trace ID (如: TRC-959982D9A394)">
                    <button onclick="queryTrace()">查询</button>
                </div>
                <div id="trace-result">
                    <p style="color: #6c757d; text-align: center; padding: 20px;">输入Trace ID查询完整决策链路</p>
                </div>
            </div>
        </div>
    </div>
    
    <button class="refresh-btn" onclick="refreshAll()" title="刷新所有数据">🔄</button>
    
    <script>
        const API_BASE = '/api/dashboard';
        
        // 加载系统优化状态
        async function loadOptimizationStatus() {
            try {
                const response = await fetch(`${API_BASE}/system/optimization-status`);
                const result = await response.json();
                
                if (result.status === 'ok') {
                    const { optimizations, active_count, total_count } = result.data;
                    
                    document.getElementById('optimization-count').textContent = 
                        `${active_count}/${total_count} 活跃`;
                    
                    const listHtml = optimizations.map(opt => `
                        <div class="optimization-item">
                            <div class="optimization-info">
                                <h4>${opt.name}</h4>
                                <p>${Object.entries(opt.metrics).map(([k, v]) => `${k}: ${v}`).join(' | ')}</p>
                            </div>
                            <span class="badge badge-success">${opt.status}</span>
                        </div>
                    `).join('');
                    
                    document.getElementById('optimization-list').innerHTML = listHtml;
                }
            } catch (error) {
                console.error('加载优化状态失败:', error);
            }
        }
        
        // 加载决策缓冲层统计
        async function loadBufferStats() {
            try {
                const response = await fetch(`${API_BASE}/decision-buffer/stats`);
                const result = await response.json();
                
                if (result.status === 'ok') {
                    const stats = result.data;
                    
                    const statsHtml = `
                        <div class="stat-item">
                            <div class="stat-label">总接收信号</div>
                            <div class="stat-value">${stats.total_received || 0}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">批准率</div>
                            <div class="stat-value ${stats.approval_rate >= 0.7 ? 'success' : 'warning'}">
                                ${(stats.approval_rate * 100).toFixed(1)}%
                            </div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">已批准</div>
                            <div class="stat-value success">${stats.total_approved || 0}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">已拒绝</div>
                            <div class="stat-value ${stats.total_rejected > 0 ? 'error' : ''}">
                                ${stats.total_rejected || 0}
                            </div>
                        </div>
                    `;
                    
                    document.getElementById('buffer-stats').innerHTML = statsHtml;
                }
            } catch (error) {
                console.error('加载决策缓冲层统计失败:', error);
            }
        }
        
        // 加载配置校验结果
        async function loadConfigValidation() {
            try {
                const response = await fetch(`${API_BASE}/config/validation`);
                const result = await response.json();
                
                if (result.status === 'ok') {
                    const { is_valid, errors, warnings, infos, summary } = result.data;
                    
                    const statusBadge = is_valid ? 
                        '<span class="badge badge-success">✅ 校验通过</span>' :
                        '<span class="badge badge-error">❌ 校验失败</span>';
                    
                    document.getElementById('config-status').innerHTML = statusBadge;
                    
                    let html = `<p style="margin-bottom: 15px; color: #6c757d;">${summary}</p>`;
                    
                    if (errors.length > 0) {
                        html += '<div style="margin-bottom: 15px;">';
                        html += '<h4 style="color: #dc3545; margin-bottom: 10px;">错误:</h4>';
                        html += errors.map(e => `
                            <div style="padding: 10px; background: #f8d7da; border-radius: 6px; margin-bottom: 8px;">
                                <strong>${e.field}</strong>: ${e.message}
                                ${e.suggestion ? `<br><small style="color: #721c24;">建议: ${e.suggestion}</small>` : ''}
                            </div>
                        `).join('');
                        html += '</div>';
                    }
                    
                    if (warnings.length > 0) {
                        html += '<div style="margin-bottom: 15px;">';
                        html += '<h4 style="color: #ffc107; margin-bottom: 10px;">警告:</h4>';
                        html += warnings.map(w => `
                            <div style="padding: 10px; background: #fff3cd; border-radius: 6px; margin-bottom: 8px;">
                                <strong>${w.field}</strong>: ${w.message}
                            </div>
                        `).join('');
                        html += '</div>';
                    }
                    
                    document.getElementById('config-validation').innerHTML = html;
                }
            } catch (error) {
                console.error('加载配置校验失败:', error);
            }
        }
        
        // 加载最近决策记录
        async function loadRecentDecisions() {
            try {
                const response = await fetch(`${API_BASE}/decision-buffer/recent?limit=20`);
                const result = await response.json();
                
                if (result.status === 'ok') {
                    const decisions = result.data.decisions;
                    
                    if (decisions.length === 0) {
                        document.getElementById('recent-decisions').innerHTML = 
                            '<p style="text-align: center; color: #6c757d; padding: 20px;">暂无决策记录</p>';
                        return;
                    }
                    
                    const html = decisions.map(d => `
                        <div class="decision-item ${d.status.toLowerCase()}">
                            <div class="decision-header">
                                <span class="decision-code">${d.code} ${d.action}</span>
                                <span class="decision-time">${d.created_at}</span>
                            </div>
                            <div class="decision-details">
                                分数: ${d.score.toFixed(2)} | 置信度: ${(d.confidence * 100).toFixed(1)}% | 
                                状态: <strong>${d.status}</strong>
                                ${d.rejection_reason ? `<br>原因: ${d.rejection_reason}` : ''}
                            </div>
                        </div>
                    `).join('');
                    
                    document.getElementById('recent-decisions').innerHTML = html;
                }
            } catch (error) {
                console.error('加载决策记录失败:', error);
            }
        }
        
        // 查询Trace ID
        async function queryTrace() {
            const traceId = document.getElementById('trace-id-input').value.trim();
            
            if (!traceId) {
                alert('请输入Trace ID');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/trace/${traceId}`);
                const result = await response.json();
                
                if (result.status === 'ok') {
                    const { trace_id, decision, timeline } = result.data;
                    
                    const html = `
                        <div style="margin-bottom: 20px;">
                            <h4 style="margin-bottom: 10px;">决策详情</h4>
                            <p><strong>代码:</strong> ${decision.code}</p>
                            <p><strong>方向:</strong> ${decision.action}</p>
                            <p><strong>分数:</strong> ${decision.score.toFixed(2)}</p>
                            <p><strong>置信度:</strong> ${(decision.confidence * 100).toFixed(1)}%</p>
                            <p><strong>状态:</strong> ${decision.status}</p>
                        </div>
                        <h4 style="margin-bottom: 10px;">决策链路时间线</h4>
                        <div class="timeline">
                            ${timeline.map(t => `
                                <div class="timeline-item">
                                    <div class="timeline-time">${t.timestamp}</div>
                                    <div class="timeline-message">${t.message}</div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    
                    document.getElementById('trace-result').innerHTML = html;
                } else {
                    document.getElementById('trace-result').innerHTML = 
                        `<div class="error-message">${result.message}</div>`;
                }
            } catch (error) {
                console.error('查询Trace失败:', error);
            }
        }
        
        // 刷新所有数据
        function refreshAll() {
            loadOptimizationStatus();
            loadBufferStats();
            loadConfigValidation();
            loadRecentDecisions();
        }
        
        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', () => {
            refreshAll();
            
            // 每30秒自动刷新
            setInterval(refreshAll, 30000);
        });
    </script>
</body>
</html>
