# FTSeek CI/CD Pipeline — Phase 1: CI (Continuous Integration)
# 目的：自动拦截语法错误、代码风格问题、测试失败和配置不一致
# 触发：Push 到 master 或 PR 到 master

name: FTSeek CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # =========================================================
  # 1. 代码质量检查 (Lint & Syntax)
  # =========================================================
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          
      - name: 语法检查 (py_compile)
        run: |
          echo "=== 检查 app/ 目录 ==="
          find app/ -name "*.py" -exec python -m py_compile {} +
          echo "=== 检查 scripts/ 目录 ==="
          find scripts/ -name "*.py" -exec python -m py_compile {} +
          echo "✅ 语法检查通过"
          
      - name: 代码风格检查 (flake8)
        run: |
          flake8 app/ --max-line-length=120 \
            --ignore=E501,W503,W504,E402,E731,W291,W293 \
            --exclude=venv,__pycache__,tests,deprecated \
            --statistics
        continue-on-error: true  # 风格问题不阻塞 CI，但会在日志中警告

  # =========================================================
  # 2. 单元测试 (Unit Tests)
  # =========================================================
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-timeout pytest-cov
          
      - name: 运行测试
        run: |
          # 运行 tests/ 目录下的所有测试
          # --timeout=60: 单个测试最多 60 秒
          # --ignore: 跳过不需要 CI 运行的测试
          pytest tests/ -v --timeout=60 --tb=short \
            --ignore=tests/simulation_validation_test.py \
            --ignore=tests/test_backtest_compare.py
        env:
          PYTHONPATH: .

  # =========================================================
  # 3. 配置一致性审计 (Config Audit)
  # =========================================================
  config-audit:
    name: 配置一致性检查
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          
      - name: 安装依赖
        run: pip install pyyaml
          
      - name: 审计 FTSeek 配置
        run: python scripts/config_audit.py FTSeek