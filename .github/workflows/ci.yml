name: CI — Regression Tests

on:
  push:
    # 2026-07-26: 原只监 master/main, 而日常工作分支为 rfc-* — 本周 10+ commit CI 一次没跑过。
    branches: [master, main, "rfc-*"]
  pull_request:
    branches: [master, main]

jobs:
  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run full test suite
        # 2026-07-26: 扫尾清零批后全量 980 passed / ~35s, 首次具备当门禁的成本条件;
        # 原三子集 (regression/risk/coordinator) 升级为全量 tests/。
        run: |
          python -m pytest tests/ -q --tb=short \
            --junitxml=test-results/full.xml

      - name: Syntax and undefined-name checks on modified files
        run: |
          changed_files="$(git diff --name-only HEAD~1 -- '*.py')" || {
            echo "Unable to compute modified Python files" >&2
            exit 1
          }
          if [ -z "$changed_files" ]; then
            echo "No modified Python files; checks not applicable"
          else
            printf '%s\n' "$changed_files"
            printf '%s\n' "$changed_files" | xargs -d '\n' python -m py_compile
            printf '%s\n' "$changed_files" | xargs -d '\n' python scripts/check_undefined_names.py
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
