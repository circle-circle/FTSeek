name: CI — Regression Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install pytest pytest-asyncio pytest-cov pytz

      - name: Run regression tests
        run: |
          python -m pytest tests/regression/ -v --tb=short \
            --junitxml=test-results/regression.xml

      - name: Run risk tests
        run: |
          python -m pytest tests/risk/ -v --tb=short \
            --ignore=tests/risk/test_exit_engine.py \
            --junitxml=test-results/risk.xml

      - name: Run coordinator tests
        run: |
          python -m pytest tests/coordinator/ -v --tb=short \
            --junitxml=test-results/coordinator.xml

      - name: Syntax check all modified files
        run: |
          git diff --name-only HEAD~1 -- '*.py' 2>/dev/null | \
            xargs -r python -m py_compile

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
