name: CI — Regression Tests

on:
  push:
    # 2026-07-26: 原只监 master/main, 而日常工作分支为 rfc-* — 本周 10+ commit CI 一次没跑过。
    branches: [master, main, "rfc-*"]
  pull_request:
    branches: [master, main]

jobs:
  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install pytest pytest-asyncio pytest-cov pytz

      - name: Run full test suite
        # 2026-07-26: 扫尾清零批后全量 980 passed / ~35s, 首次具备当门禁的成本条件;
        # 原三子集 (regression/risk/coordinator) 升级为全量 tests/。
        run: |
          python -m pytest tests/ -q --tb=short \
            --junitxml=test-results/full.xml

      - name: Syntax check all modified files
        run: |
          git diff --name-only HEAD~1 -- '*.py' 2>/dev/null | \
            xargs -r python -m py_compile

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
